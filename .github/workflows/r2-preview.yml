name: Publish isolated R2 preview

on:
  push:
    branches: ['implementation/round2-seven-groups']
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'prototypes/brush-rt/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/prepare-r2-preview.mjs'
      - '.github/workflows/r2-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: illustro-r2-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout R2 implementation
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build brush runtime
        run: npm run brush:build
      - name: Isolate storage and service worker for this preview build only
        run: node scripts/prepare-r2-preview.mjs
      - name: Typecheck and build R2 at its dedicated URL
        run: |
          npm --workspace @illustro/editor exec -- tsc --noEmit
          VITE_COMMIT_SHA="$GITHUB_SHA" npm --workspace @illustro/editor exec -- vite build --base=/illustro/r2-preview/
          test -f apps/editor/dist/index.html
          grep -q '/illustro/r2-preview/assets/' apps/editor/dist/index.html
          grep -q 'illustro-r2-preview-' apps/editor/dist/sw.js
          printf '{"sourceCommit":"%s","branch":"implementation/round2-seven-groups","isolatedStorage":true}\n' "$GITHUB_SHA" > apps/editor/dist/release.json
      - name: Upload R2 preview build
        uses: actions/upload-artifact@v4
        with:
          name: illustro-r2-preview-build
          path: apps/editor/dist/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout existing Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 0
      - name: Clear only R2 preview directory
        run: |
          rm -rf site/r2-preview
          mkdir -p site/r2-preview
      - name: Download completed R2 preview build
        uses: actions/download-artifact@v4
        with:
          name: illustro-r2-preview-build
          path: site/r2-preview
      - name: Publish R2 directory without modifying existing public app
        shell: bash
        run: |
          set -euo pipefail
          test -f site/r2-preview/index.html
          test -f site/r2-preview/release.json
          git -C site config user.name 'github-actions[bot]'
          git -C site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C site add --all r2-preview
          unexpected="$(git -C site diff --cached --name-only | grep -Ev '^r2-preview/' || true)"
          test -z "$unexpected"
          if git -C site diff --cached --quiet; then
            echo 'R2 preview is already current'
            exit 0
          fi
          git -C site commit -m "preview: publish R2 $GITHUB_SHA"
          git -C site pull --rebase origin gh-pages
          git -C site push origin HEAD:gh-pages
      - name: Verify expected release is publicly accessible
        shell: bash
        env:
          PREVIEW_URL: https://totoro0419.github.io/illustro/r2-preview/
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl --fail --location --silent --show-error "$PREVIEW_URL/release.json" -o /tmp/r2-release.json &&
              grep -q "$GITHUB_SHA" /tmp/r2-release.json &&
              curl --fail --location --silent --show-error "$PREVIEW_URL" -o /tmp/r2-index.html &&
              grep -q 'r2-preview/assets/' /tmp/r2-index.html; then
              echo "Published and verified $PREVIEW_URL at commit $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo 'Public R2 preview did not become available with the expected revision'
          exit 1
