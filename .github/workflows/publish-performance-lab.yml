name: Publish Illustro Performance Lab
on:
  push:
    branches:
      - research/interactive-performance-lab-2026-10-30
    paths:
      - qa/performance-lab/index.html
      - .github/workflows/publish-performance-lab.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: illustro-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare only lab page
        shell: bash
        run: |
          mkdir -p _site/qa/performance-lab
          cp qa/performance-lab/index.html _site/qa/performance-lab/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
