name: Realtime Brush Candidate
on:
  push:
    branches: ['brush/realtime-redesign-2026-10-03', 'brush/foundation-2026-10-03']
    paths: ['packages/brush-rt/**', 'prototypes/brush-rt/*.mjs', 'prototypes/brush-rt/index.html', '.github/workflows/brush-rt-candidate.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brush-rt-candidate
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: [webgl2, webgpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check syntax and build without third-party bundler
        run: |
          for source in packages/brush-rt/src/*.mjs prototypes/brush-rt/*.mjs; do node --check "$source"; done
          node prototypes/brush-rt/build.mjs
      - name: Verify canonical data and scheduling
        shell: bash
        run: |
          set -o pipefail
          node --test packages/brush-rt/test/*.test.mjs | tee docs/brush-rt/evidence/node-tests.txt
      - name: Install browser test runtime
        run: |
          npm install --prefix /tmp/rt-browser playwright@1.62.1 --no-audit --no-fund
          /tmp/rt-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: GPU shader, pixel, input and sustained proxy tests
        env:
          RT_PLAYWRIGHT_PATH: /tmp/rt-browser/node_modules/playwright
          RT_LONG_TEST: '1'
          RT_BACKEND: '${{ matrix.backend }}'
        shell: bash
        run: |
          set -o pipefail
          node prototypes/brush-rt/browser-check.mjs 2>&1 | tee docs/brush-rt/evidence/browser-console.txt
      - name: Preserve evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brush-rt-evidence-${{ matrix.backend }}
          path: docs/brush-rt/evidence
  targeted-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        backend: [webgl2, webgpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build exact candidate
        run: node prototypes/brush-rt/build.mjs
      - name: Install browser test runtime
        run: |
          npm install --prefix /tmp/rt-browser playwright@1.62.1 --no-audit --no-fund
          /tmp/rt-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Wide sweep correctness and performance feedback
        env:
          RT_PLAYWRIGHT_PATH: /tmp/rt-browser/node_modules/playwright
          RT_QUICK_TEST: '1'
          RT_BACKEND: '${{ matrix.backend }}'
        shell: bash
        run: |
          set -o pipefail
          node prototypes/brush-rt/foundation-quick-check.mjs 2>&1 | tee docs/brush-rt/evidence/foundation-quick-console.txt
      - name: Preserve targeted feedback including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-quick-evidence-${{ matrix.backend }}
          path: docs/brush-rt/evidence
