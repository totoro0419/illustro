name: C02 retained presentation comparison
on:
  push:
    branches: [implementation/stage4-c02-brush-engine]
    paths: ['c01/app/**', 'c01/test/**', '.github/workflows/c02-performance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 4a002dd4dde701579ce0cc0c9bb7bb9da96807f0
          path: before
      - uses: actions/checkout@v4
        with:
          repository: totoro0419/illustro_old
          ref: 884285a3364184bde3f0893f260e966a310fb67f
          path: legacy
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
        working-directory: c01
      - name: Build the frozen legacy runtime
        working-directory: legacy
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run brush:build > /tmp/legacy-build.log
          npm --workspace @illustro/editor exec -- vite build --base=./ >> /tmp/legacy-build.log
      - name: Run matched nominal-brush input / next-frame comparison
        run: node test/performance-compare.mjs
        working-directory: c01
        env:
          ILLUSTRO_BENCH_ROOTS: >-
            {"legacy":"${{ github.workspace }}/legacy/apps/editor/dist","before":"${{ github.workspace }}/before/c01","after":"${{ github.workspace }}/c01"}
          ILLUSTRO_BENCH_CASES: >-
            [{"name":"thin","size":10,"brush":"gpen","width":640,"height":480,"strokes":10},{"name":"broad","size":300,"brush":"gpen","width":2560,"height":1920,"strokes":10},{"name":"texture","size":300,"brush":"pencil","width":2560,"height":1920,"strokes":10}]
          ILLUSTRO_BENCH_OUT: /tmp/c02-performance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c02-performance-comparison
          path: /tmp/c02-performance.json
