name: C02 retained presentation comparison
on:
  push:
    branches: [implementation/stage4-c02-brush-engine]
    paths: ['c01/app/**', 'c01/test/**', '.github/workflows/c02-performance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 4a002dd4dde701579ce0cc0c9bb7bb9da96807f0
          path: before
      - uses: actions/checkout@v4
        with:
          repository: totoro0419/illustro_old
          ref: 884285a3364184bde3f0893f260e966a310fb67f
          path: legacy
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
        working-directory: c01
      - name: Build the frozen legacy runtime
        working-directory: legacy
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run brush:build > /tmp/legacy-build.log
          npm --workspace @illustro/editor exec -- vite build --base=./ >> /tmp/legacy-build.log
      - name: Equal visual envelope auxiliary round-ink comparison
        id: quality
        continue-on-error: true
        run: node test/performance-compare.mjs
        working-directory: c01
        env:
          ILLUSTRO_BENCH_ROOTS: >-
            {"legacy":"${{ github.workspace }}/legacy/apps/editor/dist","before":"${{ github.workspace }}/before/c01","after":"${{ github.workspace }}/c01"}
          ILLUSTRO_BENCH_CASES: >-
            [{"name":"quality-thin","quality":true,"size":10,"brush":"round","width":640,"height":480,"strokes":10,"samples":1},{"name":"quality-broad","quality":true,"size":300,"brush":"round","width":2560,"height":1920,"strokes":10,"samples":1}]
          ILLUSTRO_BENCH_OUT: /tmp/c02-quality-performance.json
      - name: Run matched nominal-brush input / next-frame comparison
        run: node test/performance-compare.mjs
        working-directory: c01
        env:
          ILLUSTRO_BENCH_ROOTS: >-
            {"legacy":"${{ github.workspace }}/legacy/apps/editor/dist","before":"${{ github.workspace }}/before/c01","after":"${{ github.workspace }}/c01"}
          ILLUSTRO_BENCH_CASES: >-
            [{"name":"thin","size":10,"brush":"gpen","width":640,"height":480,"strokes":10},{"name":"pencil","size":32,"brush":"pencil","width":1600,"height":1200,"strokes":10},{"name":"marker","size":200,"brush":"marker","width":1600,"height":1200,"strokes":10},{"name":"fifty","size":78,"brush":"gpen","width":1600,"height":1200,"strokes":50},{"name":"broad","size":300,"brush":"gpen","width":2560,"height":1920,"strokes":10},{"name":"texture","size":300,"brush":"pencil","width":2560,"height":1920,"strokes":10}]
          ILLUSTRO_BENCH_OUT: /tmp/c02-performance.json
      - name: After-only backlog, density and simultaneous input
        run: node test/performance-compare.mjs
        working-directory: c01
        env:
          ILLUSTRO_BENCH_ROOTS: >-
            {"after":"${{ github.workspace }}/c01"}
          ILLUSTRO_BENCH_CASES: >-
            [{"name":"hundred","size":12,"brush":"gpen","width":640,"height":480,"strokes":100},{"name":"dense","size":200,"brush":"pencil","width":1600,"height":1200,"strokes":10,"samples":32},{"name":"correction-zoom","size":78,"brush":"gpen","width":1600,"height":1200,"strokes":10,"correction":"strong","zoom":2},{"name":"simultaneous","size":300,"brush":"gpen","width":2560,"height":1920,"strokes":10,"simultaneous":true}]
          ILLUSTRO_BENCH_OUT: /tmp/c02-after-stress.json
      - name: Retained display group ablation (same input and formal brush)
        working-directory: c01
        run: |
          ILLUSTRO_DISPLAY_GROUP=256 ILLUSTRO_BENCH_OUT=/tmp/c02-groups-256.json node test/performance-compare.mjs
          ILLUSTRO_DISPLAY_GROUP=512 ILLUSTRO_BENCH_OUT=/tmp/c02-groups-512.json node test/performance-compare.mjs
        env:
          ILLUSTRO_BENCH_ROOTS: >-
            {"after":"${{ github.workspace }}/c01"}
          ILLUSTRO_BENCH_CASES: >-
            [{"name":"thin","size":10,"brush":"gpen","width":640,"height":480,"strokes":10},{"name":"broad","size":300,"brush":"gpen","width":2560,"height":1920,"strokes":10},{"name":"texture","size":300,"brush":"pencil","width":2560,"height":1920,"strokes":10},{"name":"simultaneous","size":300,"brush":"gpen","width":2560,"height":1920,"strokes":10,"simultaneous":true}]
      - name: Preserve quality comparison failure after collecting other evidence
        if: always() && steps.quality.outcome == 'failure'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c02-performance-comparison
          path: |
            /tmp/c02-performance.json
            /tmp/c02-after-stress.json
            /tmp/c02-quality-performance.json
            /tmp/c02-groups-*.json
