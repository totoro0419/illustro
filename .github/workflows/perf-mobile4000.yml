name: Mobile 4000 canvas
on:
  push:
    branches: ['perf/mobile-4000-2026-10-15']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mobile-4000-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Source integrity, color preservation, Core and unit regression
        run: |
          git diff --exit-code 45357428592c0366a90aa4ecac97a1ba72937fc8 -- apps/editor/src/color
          npm run prep:check
          npm run core:check
          npm run brush:build > /tmp/brush-build.log
          npx vitest run apps/editor/src
          node --test packages/brush-rt/test/*.test.mjs > /tmp/brush-tests.log
          node scripts/check-test-summary.mjs /tmp/brush-tests.log
      - name: Build exact review app
        env: {VITE_COMMIT_SHA: '${{ github.sha }}'}
        run: |
          npm --workspace @illustro/editor exec -- tsc --noEmit
          npm --workspace @illustro/editor exec -- vite build --base=./
      - name: Install browser
        run: |
          npm install --prefix /tmp/handoff-browser playwright@1.62.1 --no-audit --no-fund
          /tmp/handoff-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Real browser color, gesture, persistence, export and prior features
        env:
          RT_PLAYWRIGHT_PATH: /tmp/handoff-browser/node_modules/playwright
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          M08_PERF_REVIEW: '1'
          M05_EXPECT_MILESTONE: M07
          M06_EXPECT_MILESTONE: M07
          M08_CORRUPT_ALL_RENDER_CACHES: '1'
        run: |
          node scripts/stroke-handoff-operations.mjs
          node scripts/editor-m09-smoke.mjs
          node scripts/editor-orbit-smoke.mjs
          node scripts/editor-color-hit-smoke.mjs
          node scripts/editor-gesture-cancel-smoke.mjs
          node scripts/editor-m05-smoke.mjs
          node scripts/editor-m06-smoke.mjs
          node scripts/editor-m08-smoke.mjs
          node scripts/editor-home-smoke.mjs
          node scripts/editor-works-smoke.mjs
          node scripts/editor-works-safety-smoke.mjs
      - uses: actions/upload-artifact@v4
        with: {name: mobile-build, path: apps/editor/dist/}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-regression
          path: |
            /tmp/*-evidence/
            /tmp/illustro-m05/
            /tmp/brush-tests.log
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run brush:build > /tmp/brush-build.log
      - run: |
          npm install --prefix /tmp/handoff-browser playwright@1.62.1 --no-audit --no-fund
          /tmp/handoff-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Four sizes, three layer counts, seven brushes, both GPUs, overlap and history
        env:
          RT_PLAYWRIGHT_PATH: /tmp/handoff-browser/node_modules/playwright
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          node scripts/stroke-handoff-quality.mjs
          HANDOFF_HEAVY_AREA=1 HANDOFF_QUALITY_OUTPUT=/tmp/handoff-quality/heavy/report.json node scripts/stroke-handoff-quality.mjs
          VITE_COMMIT_SHA=${{ github.sha }} npm --workspace @illustro/editor exec -- vite build --base=./
          UNDO_QUALITY_CANVAS_SIZE=4000 UNDO_QUALITY_OUTPUT=/tmp/handoff-quality/navigation/report.json node scripts/undo-navigation-quality.mjs
          MOBILE_QUALITY_OUTPUT=/tmp/handoff-quality/direct.json node scripts/mobile-composition-quality.mjs
          MOBILE_INPUT_OUTPUT=/tmp/handoff-quality/input/report.json node scripts/mobile-input-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: mobile-quality, path: /tmp/handoff-quality/}
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare immutable baseline
        run: |
          git worktree add --detach /tmp/handoff-before 163f128838d22da4303a61e2f98e26862016740a
          cd /tmp/handoff-before
          npm ci --ignore-scripts --no-audit --no-fund
          npm run brush:build > /tmp/handoff-before-build.log
          VITE_COMMIT_SHA=163f128838d22da4303a61e2f98e26862016740a npm --workspace @illustro/editor exec -- vite build --base=./
      - run: |
          npm run brush:build > /tmp/brush-build.log
          VITE_COMMIT_SHA=${{ github.sha }} npm --workspace @illustro/editor exec -- vite build --base=./
          npm install --prefix /tmp/handoff-browser playwright@1.62.1 --no-audit --no-fund
          /tmp/handoff-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Matched mobile-width4000 drawing comparison and sustained1100 strokes
        env:
          RT_PLAYWRIGHT_PATH: /tmp/handoff-browser/node_modules/playwright
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          MOBILE_ROOT=/tmp/handoff-before/apps/editor/dist MOBILE_SIZES=512,2048,4000 MOBILE_OUTPUT=/tmp/handoff-evidence/before.json EXPECTED_COMMIT_SHA=163f128838d22da4303a61e2f98e26862016740a node scripts/mobile-canvas-benchmark.mjs
          MOBILE_SIZES=512,2048,4000 MOBILE_OUTPUT=/tmp/handoff-evidence/after.json node scripts/mobile-canvas-benchmark.mjs
          HANDOFF_STRESS_SIZE=4000 HANDOFF_STRESS_OUTPUT=/tmp/handoff-evidence/stress/report.json node scripts/stroke-handoff-stress.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: mobile-performance, path: /tmp/handoff-evidence/}
  publish:
    needs: [regression, quality, performance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: gh-pages, path: site}
      - uses: actions/download-artifact@v4
        with: {name: mobile-build, path: review-build}
      - uses: actions/download-artifact@v4
        with: {name: mobile-performance, path: review-evidence}
      - uses: actions/download-artifact@v4
        with: {name: mobile-quality, path: review-evidence/quality}
      - uses: actions/download-artifact@v4
        with: {name: mobile-regression, path: review-evidence/regression}
      - name: Verify evidence and preserve every other QA page
        env: {EXPECTED_COMMIT_SHA: '${{ github.sha }}'}
        run: |
          node scripts/mobile-canvas-report.mjs review-evidence
          (cd site && find qa -type f ! -path 'qa/perf-mobile4000/*' -print0 | sort -z | xargs -0 sha256sum) > /tmp/old-qa.before
          mkdir -p site/qa/perf-mobile4000/app site/qa/perf-mobile4000/evidence
          cp -a review-build/. site/qa/perf-mobile4000/app/
          cp -a review-evidence/. site/qa/perf-mobile4000/evidence/
          printf '%s\n' '<!doctype html><html lang="ja"><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./app/"><title>Illustro 4000pxスマホ描画の確認</title><script>location.replace("./app/"+location.search+location.hash)</script><a href="./app/">4000pxスマホ描画の確認ページを開く</a></html>' > site/qa/perf-mobile4000/index.html
          (cd site && find qa -type f ! -path 'qa/perf-mobile4000/*' -print0 | sort -z | xargs -0 sha256sum) > /tmp/old-qa.after
          diff -u /tmp/old-qa.before /tmp/old-qa.after
      - name: Publish isolated QA only
        working-directory: site
        run: |
          current=$(git ls-remote origin refs/heads/perf/mobile-4000-2026-10-15 | cut -f1)
          if [ "$current" != "$GITHUB_SHA" ]; then echo 'Newer source exists; preserving it.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/perf-mobile4000
          git diff --cached --quiet || git commit -m 'qa: publish isolated mobile4000 review'
          git push origin HEAD:gh-pages
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Wait for the exact source on public Pages
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          PUBLIC_EVIDENCE_URL: https://totoro0419.github.io/illustro/qa/perf-mobile4000/evidence/qa-status.json
        run: |
          ready=0
          for i in $(seq 1 36); do
            curl -fsSL "$PUBLIC_EVIDENCE_URL?build=$GITHUB_SHA" -o /tmp/public-handoff.json || true
            if node -e "try{process.exit(JSON.parse(require('fs').readFileSync('/tmp/public-handoff.json')).sourceCommit===process.env.EXPECTED_COMMIT_SHA?0:1)}catch{process.exit(1)}"; then ready=1; break; fi
            sleep 5
          done
          test "$ready" = 1
      - name: Install public-verification browser
        run: |
          npm install --prefix /tmp/handoff-browser playwright@1.62.1 --no-audit --no-fund
          /tmp/handoff-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify real drawing, immediate history and fixed save on public build
        env:
          RT_PLAYWRIGHT_PATH: /tmp/handoff-browser/node_modules/playwright
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          HANDOFF_PUBLIC_URL: https://totoro0419.github.io/illustro/qa/perf-mobile4000/app/
          UNDO_PUBLIC_URL: https://totoro0419.github.io/illustro/qa/perf-mobile4000/app/
          UNDO_QUALITY_QUICK: '1'
          UNDO_QUALITY_CANVAS_SIZE: '4000'
          MOBILE_PUBLIC_URL: https://totoro0419.github.io/illustro/qa/perf-mobile4000/app/
          MOBILE_INPUT_OUTPUT: /tmp/handoff-public/mobile/report.json
          UNDO_QUALITY_OUTPUT: /tmp/handoff-public/navigation/report.json
          HANDOFF_OPERATIONS_OUTPUT: /tmp/handoff-public/report.json
        run: |
          node scripts/stroke-handoff-operations.mjs
          node scripts/undo-navigation-quality.mjs
          node scripts/mobile-input-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: mobile-public-verification, path: /tmp/handoff-public/}
