name: Verify and publish tiered image history
on:
  push:
    branches: ['perf/tile-history-2026-10-18']
    paths: ['apps/**', 'packages/**', 'prototypes/**', 'scripts/tile-history-review.mjs', '.github/workflows/tile-history.yml', 'docs/production-prep/source-lock.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tile-history-preview
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      RT_PLAYWRIGHT_PATH: /tmp/history-browser/node_modules/playwright
      HISTORY_OUTPUT: /tmp/tile-history/report.json
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check history ownership, errors and all existing unit regressions
        run: |
          npm run brush:build > /tmp/history-brush-build.log
          npm run prep:check
          npm run core:check
          npm run brush:regression
          npm --workspace @illustro/editor exec -- vitest run
          npm --workspace @illustro/editor exec -- tsc --noEmit
      - name: Build exact current and immutable PR34 applications
        env: {VITE_COMMIT_SHA: '${{ github.sha }}'}
        run: |
          npm --workspace @illustro/editor exec -- vite build --base=./
          git worktree add --detach /tmp/history-base 24993dff35835ec4bd6da12763b0fa328e20b5ca
          cd /tmp/history-base
          npm ci --ignore-scripts --no-audit --no-fund
          npm run brush:build > /tmp/history-base-build.log
          VITE_COMMIT_SHA=24993dff35835ec4bd6da12763b0fa328e20b5ca npm --workspace @illustro/editor exec -- vite build --base=./
          cp -a apps/editor/dist /tmp/illustro-history-before
      - name: Install verification browser
        run: |
          npm install --prefix /tmp/history-browser playwright@1.62.1 --no-audit --no-fund
          /tmp/history-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Matched 512, 2000 and 4000px tests on WebGL2 and WebGPU
        run: node scripts/tile-history-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: tile-history-comparison, path: /tmp/tile-history/}
      - uses: actions/upload-artifact@v4
        with: {name: tile-history-application, path: apps/editor/dist/}
      - uses: actions/upload-artifact@v4
        with: {name: tile-history-baseline, path: /tmp/illustro-history-before/}
  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      RT_PLAYWRIGHT_PATH: /tmp/history-browser/node_modules/playwright
      HANDOFF_OPERATIONS_OUTPUT: /tmp/tile-history-regression/operations/report.json
      M05_EVIDENCE_DIRECTORY: /tmp/tile-history-regression/recovery
      M05_EXPECT_MILESTONE: M07
      M08_EVIDENCE_DIRECTORY: /tmp/tile-history-regression/canvas
      M09_EVIDENCE_DIRECTORY: /tmp/tile-history-regression/color
      HOME_EVIDENCE_DIRECTORY: /tmp/tile-history-regression/works
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build exact regression application
        env: {VITE_COMMIT_SHA: '${{ github.sha }}'}
        run: |
          npm run brush:build > /tmp/history-brush-build.log
          npm --workspace @illustro/editor exec -- vite build --base=./
          npm install --prefix /tmp/history-browser playwright@1.62.1 --no-audit --no-fund
          /tmp/history-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Immediate Undo, saved-head ordering and portable reload
        run: node scripts/stroke-handoff-operations.mjs
      - name: Journal protection, crash recovery and offline
        run: node scripts/editor-m05-smoke.mjs
      - name: Canvas navigation and color interactions
        run: |
          node scripts/editor-m08-smoke.mjs
          node scripts/editor-m09-smoke.mjs
      - name: Reopen works and preserve home save safety
        run: node scripts/editor-works-safety-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: tile-history-regression, path: /tmp/tile-history-regression/}
  publish:
    needs: [compare, persistence]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      RT_PLAYWRIGHT_PATH: /tmp/history-browser/node_modules/playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: gh-pages, path: site}
      - uses: actions/download-artifact@v4
        with: {name: tile-history-application, path: site/qa/undo-tile-history/after}
      - uses: actions/download-artifact@v4
        with: {name: tile-history-baseline, path: site/qa/undo-tile-history/before}
      - uses: actions/download-artifact@v4
        with: {name: tile-history-comparison, path: site/qa/undo-tile-history/evidence}
      - uses: actions/download-artifact@v4
        with: {name: tile-history-regression, path: site/qa/undo-tile-history/evidence/regression}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Require both-backend comparison and publish only the new directory
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync('site/qa/undo-tile-history/evidence/report.json'));
          assert.equal(r.sourceCommit,process.env.EXPECTED_COMMIT_SHA);assert.equal(r.cases.length,6);assert.deepEqual(r.errors,[]);
          fs.writeFileSync('site/qa/undo-tile-history/evidence/qa-status.json',JSON.stringify({sourceCommit:r.sourceCommit,baselineCommit:r.baselineCommit,workflowRun:process.env.GITHUB_RUN_ID,checks:'Matched pixels, ordered history, GPU/memory/OPFS, missing archive, navigation, save and recovery verified in Chromium software GPU',unverified:['Physical Android latency/FPS/temperature','Actual RSS/VRAM','User acceptance']},null,2));
          JS
          cp qa/undo-tile-history/index.html site/qa/undo-tile-history/
          cd site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/undo-tile-history
          test -z "$(git diff --cached --name-only | sed '/^qa\/undo-tile-history\//d')"
          git diff --cached --quiet || git commit -m "qa: publish verified image history $GITHUB_SHA"
          git push origin HEAD:gh-pages
      - name: Wait for the exact isolated public source
        run: |
          for i in $(seq 1 48); do
            curl -fsSL "https://totoro0419.github.io/illustro/qa/undo-tile-history/evidence/qa-status.json?source=$GITHUB_SHA" -o /tmp/history-public.json || true
            if node -e "try{process.exit(JSON.parse(require('fs').readFileSync('/tmp/history-public.json')).sourceCommit===process.env.EXPECTED_COMMIT_SHA?0:1)}catch{process.exit(1)}"; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Verify public hot, cold, disk and failed-read paths on both GPUs
        env:
          HISTORY_PUBLIC_ORIGIN: https://totoro0419.github.io/illustro/qa/undo-tile-history
          HISTORY_QUICK: '1'
          HISTORY_OUTPUT: /tmp/history-public/report.json
        run: |
          npm install --prefix /tmp/history-browser playwright@1.62.1 --no-audit --no-fund
          /tmp/history-browser/node_modules/.bin/playwright install --with-deps chromium
          node scripts/tile-history-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: tile-history-public-verification, path: /tmp/history-public/}
