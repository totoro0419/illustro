name: R2 round 5 audit (isolated)
on:
  push:
    branches: [fix/r2-audit-round5-2026-11-27]
    paths:
      - 'scripts/r2-automated-audit/**'
      - 'scripts/editor-works-safety-smoke.mjs'
      - '.github/workflows/r2-automated-audit.yml'
  workflow_dispatch:
    inputs:
      selection:
        description: 'all, group A-F, or comma-separated feature IDs'
        required: true
        default: all
        type: string
permissions:
  contents: write
concurrency:
  group: r2-chat-audit-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      R2_AUDIT_FIX_URL: http://127.0.0.1:4173/
      EXPECTED_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      R2_CHROME_CHANNEL: chrome
      RT_PLAYWRIGHT_PATH: /tmp/r2-audit-browser/node_modules/playwright
      PREP_PNG_PATH: /tmp/r2-audit-browser/node_modules/pngjs
      R2_AUDIT_OUT: r2-audit-evidence
      R2_FIXTURE_DIR: r2-audit-fixtures
      AUDIT_SELECTION: ${{ inputs.selection || 'LAY-005,AUT-002,AUT-003' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies and build once
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run brush:build
          npm --workspace @illustro/editor exec -- tsc --noEmit
          VITE_COMMIT_SHA="$EXPECTED_COMMIT_SHA" npm --workspace @illustro/editor exec -- vite build --base=/
          printf '{"sourceCommit":"%s","isolatedStorage":true,"isolation":"localhost and fresh browser context"}\n' "$EXPECTED_COMMIT_SHA" > apps/editor/dist/release.json
      - name: Generate fixtures with real codecs
        id: fixtures
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pil libheif-examples ffmpeg
          sudo apt-get install -y --no-install-recommends libheif-plugin-x265 libheif-plugin-aomenc libheif-plugin-libde265 libheif-plugin-dav1d || true
          /usr/bin/python3 scripts/r2-automated-audit/generate-fixtures.py
      - name: Browser and local origin
        run: |
          npm install --prefix /tmp/r2-audit-browser playwright@1.62.1 pngjs@7.0.0 --no-audit --no-fund
          command -v google-chrome
          mkdir -p r2-audit-evidence
          python3 -m http.server 4173 --bind 127.0.0.1 --directory apps/editor/dist >r2-audit-evidence/server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS "${R2_AUDIT_FIX_URL}release.json" | grep -q "$EXPECTED_COMMIT_SHA"; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Validate registry and syntax
        run: |
          node --check scripts/r2-automated-audit/browser.mjs
          node --check scripts/r2-automated-audit/run.mjs
          node scripts/r2-automated-audit/self-test.mjs
      - name: Run selected checks
        run: |
          set +e
          root="$R2_AUDIT_OUT"
          # Split selected IDs only; the built app is shared.
          for group in A B C; do
            case "$group" in
              A) ids='SAV-006,SAV-007,REF-006,IO-006';;
              B) ids='FIL-005,LIN-007,TRN-005,VEC-004,LAY-005';;
              C) ids='COL-008,FX-007,HIS-005,AUT-002,AUT-003,AUT-004,AUT-005';;
            esac
            selected="$(node -e 'const a=process.argv[1].split(",");console.log(process.argv[2].split(",").filter(x=>a.includes(x)).join(","))' "$AUDIT_SELECTION" "$ids")"
            if [ -n "$selected" ]; then R2_AUDIT_OUT="$root/group-$group" node scripts/r2-automated-audit/run.mjs "$selected" & pids="$pids $!"; fi
          done
          if [ -z "$pids" ]; then node scripts/r2-automated-audit/run.mjs "$AUDIT_SELECTION"; exit $?; fi
          rc=0
          for pid in $pids; do wait "$pid" || rc=1; done
          for group in "$root"/group-*; do
            for case in "$group"/*; do
              if [ -d "$case" ] && [ -f "$case/result.json" ]; then cp -a "$case" "$root/"; fi
            done
          done
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: r2-automated-audit-${{ env.EXPECTED_COMMIT_SHA }}
          path: |
            r2-audit-evidence/
            r2-audit-fixtures/
            r2-D-016-failure.png
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve actual results on audit branch
        if: ${{ always() && !cancelled() }}
        run: |
          test -d r2-audit-evidence || exit 1
          git fetch origin fix/r2-audit-round5-2026-11-27
          git checkout --detach FETCH_HEAD
          node scripts/r2-automated-audit/save-chat-report.mjs
          if ! git diff --quiet "$EXPECTED_COMMIT_SHA" HEAD -- apps packages prototypes scripts .github/workflows; then
            git restore docs/device-audit/03-CHAT-REMAINING17.csv docs/device-audit/03-CHAT-REMAINING17-SUMMARY.md docs/device-audit/03-chat-evidence/actual-results.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/device-audit/03-CHAT-REMAINING17.csv docs/device-audit/03-CHAT-REMAINING17-SUMMARY.md docs/device-audit/03-chat-evidence/
          if ! git diff --cached --quiet; then
            git commit -m "Record actual R2 chat audit evidence for $EXPECTED_COMMIT_SHA"
            git push origin HEAD:refs/heads/fix/r2-audit-round5-2026-11-27
          fi
      - name: Fail if fixtures could not be verified
        if: ${{ always() && steps.fixtures.outcome != 'success' }}
        run: exit 1
