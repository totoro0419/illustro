name: M02 Layer Add Select

on:
  push:
    branches: ['milestone/M02-layer-add-select']
    paths:
      - 'apps/editor/**'
      - 'packages/core/**'
      - 'packages/brush-rt/**'
      - 'scripts/editor-m02-smoke.mjs'
      - 'docs/research/M02_LAYER_ADD_SELECT_COMPETITOR_RESEARCH.md'
      - 'docs/implementation/M02_LAYER_ADD_SELECT_DESIGN.md'
      - 'docs/CANONICAL_INDEX.json'
      - 'docs/production-prep/source-lock.json'
      - 'package*.json'
      - '.github/workflows/m02-layer-add-select.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m02-layer-add-select
  cancel-in-progress: true

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout M02 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Core and production-prep checks
        run: |
          sha256sum packages/brush-rt/src/renderer.mjs
          npm run core:check
          npm run prep:check
      - name: M01 adapter and M02 Layer integration tests
        run: npx vitest run apps/editor/src/strokeCommit.test.ts apps/editor/src/layerSelection.test.ts
      - name: Brush Foundation 93-test regression
        run: |
          npm run brush:build > /tmp/m02-brush-build.log
          node --test packages/brush-rt/test/*.test.mjs | tee /tmp/m02-brush-regression.log
          grep -Eq '(^|[^0-9])tests +93([^0-9]|$)' /tmp/m02-brush-regression.log
          grep -Eq '(^|[^0-9])pass +93([^0-9]|$)' /tmp/m02-brush-regression.log
          grep -Eq '(^|[^0-9])fail +0([^0-9]|$)' /tmp/m02-brush-regression.log
      - name: Build M02 editor
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
        run: |
          npm --workspace @illustro/editor exec -- tsc --noEmit
          npm --workspace @illustro/editor exec -- vite build --base=./
      - name: Install browser verifier
        run: |
          npm install --prefix /tmp/m02-browser playwright@1.62.1 pngjs@7.0.0 --no-audit --no-fund
          /tmp/m02-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Production editor regression
        env:
          RT_PLAYWRIGHT_PATH: /tmp/m02-browser/node_modules/playwright
          PREP_PNG_PATH: /tmp/m02-browser/node_modules/pngjs
          PREP_EVIDENCE_DIRECTORY: /tmp/m02-evidence/production
        run: node scripts/editor-smoke.mjs
      - name: M02 WebGL2 and WebGPU local integration
        env:
          RT_PLAYWRIGHT_PATH: /tmp/m02-browser/node_modules/playwright
          PREP_PNG_PATH: /tmp/m02-browser/node_modules/pngjs
          M02_EVIDENCE_DIRECTORY: /tmp/m02-evidence/local
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/editor-m02-smoke.mjs
      - name: Checkout current Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Preserve M01 and replace only M02 QA
        run: |
          test -d site/qa/m01
          (cd site && find qa/m01 -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/m01.before
          rm -rf site/qa/m02
          mkdir -p site/qa/m02
          cp -a apps/editor/dist/. site/qa/m02/
          touch site/.nojekyll
          (cd site && find qa/m01 -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/m01.after
          diff -u /tmp/m01.before /tmp/m01.after
      - name: Publish M02 without touching older QA pages
        working-directory: site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/m02 .nojekyll
          if git diff --cached --quiet; then
            echo 'QA output already matches gh-pages.'
          else
            git commit -m 'qa: publish M02 fixed review page'
            git push origin HEAD:gh-pages
          fi
      - name: Wait for this exact M02 build and confirm M01 remains reachable
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          ok=0
          for i in $(seq 1 60); do
            m02=$(curl -L -sS -H 'Cache-Control: no-cache' -o /tmp/m02.html -w '%{http_code}' "https://totoro0419.github.io/illustro/qa/m02/?build=$EXPECTED_COMMIT_SHA" || true)
            m01=$(curl -L -sS -H 'Cache-Control: no-cache' -o /tmp/m01.html -w '%{http_code}' "https://totoro0419.github.io/illustro/qa/m01/?m02-check=$EXPECTED_COMMIT_SHA" || true)
            asset=$(sed -n 's#.*src="\./\([^"]*\.js\)".*#\1#p' /tmp/m02.html | head -n 1)
            if [ "$m02" = '200' ] && [ "$m01" = '200' ] && [ -n "$asset" ]; then
              code=$(curl -L -sS -H 'Cache-Control: no-cache' -o /tmp/m02.js -w '%{http_code}' "https://totoro0419.github.io/illustro/qa/m02/$asset?build=$EXPECTED_COMMIT_SHA" || true)
              if [ "$code" = '200' ] && grep -q "$EXPECTED_COMMIT_SHA" /tmp/m02.js && grep -q '<title>Illustro</title>' /tmp/m01.html; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          if [ "$ok" != '1' ]; then
            echo 'The exact M02 build did not become publicly reachable.'
            exit 1
          fi
      - name: Verify actual public M02 with WebGL2 and WebGPU
        env:
          RT_PLAYWRIGHT_PATH: /tmp/m02-browser/node_modules/playwright
          PREP_PNG_PATH: /tmp/m02-browser/node_modules/pngjs
          M02_EVIDENCE_DIRECTORY: /tmp/m02-evidence/public
          M02_PUBLIC_URL: https://totoro0419.github.io/illustro/qa/m02/
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          ok=0
          for attempt in 1 2 3; do
            if node scripts/editor-m02-smoke.mjs; then ok=1; break; fi
            sleep 10
          done
          test "$ok" = '1'
      - name: Upload M02 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m02-layer-add-select-evidence
          path: /tmp/m02-evidence