name: Publish isolated R2 Round 4 audit fixes preview
on:
  push:
    branches:
      - fix/r2-audit-round4-2026-11-26
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'prototypes/brush-rt/**'
      - 'scripts/prepare-r2-audit-fixes-round4-preview.mjs'
      - 'scripts/r2-audit-fixes-browser-smoke.mjs'
      - 'scripts/r2-audit-fixes-round4-browser-smoke.mjs'
      - 'scripts/r2-audit-fixes-fill-browser-smoke.mjs'
      - 'scripts/r2-audit-fixes-specks-browser-smoke.mjs'
      - 'scripts/r2-audit-fixes-remaining-browser-smoke.mjs'
      - 'scripts/prepare-r2-preview.mjs'
      - 'scripts/r2-round4-line-fixture.py'
      - '.github/workflows/r2-audit-fixes-round4-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: illustro-r2-audit-fixes-round4-preview-recovery
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run brush:build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate original audit fixture
        run: |
          python -m pip install pillow
          python scripts/r2-round4-line-fixture.py "$RUNNER_TEMP/r4-fixtures"
      - uses: actions/upload-artifact@v4
        with:
          name: round4-line-fixture
          path: ${{ runner.temp }}/r4-fixtures
      - name: Related automated regression tests
        run: |
          export R2_ROUND4_FIXTURE_DIR="$RUNNER_TEMP/r4-fixtures"
          npx --no-install vitest run apps/editor/src/selection apps/editor/src/fill apps/editor/src/color apps/editor/src/assets apps/editor/src/export apps/editor/src/workBrushSettings.test.ts apps/editor/src/round4WorkBrushState.test.ts apps/editor/src/persistence packages/core
          node --check scripts/r2-audit-fixes-round4-browser-smoke.mjs
      - name: Isolate Round 4 fixes from R2 and main storage
        run: node scripts/prepare-r2-audit-fixes-round4-preview.mjs
      - name: Typecheck and compile independent app
        run: |
          npm --workspace @illustro/editor exec -- tsc --noEmit
          VITE_COMMIT_SHA="$GITHUB_SHA" npm --workspace @illustro/editor exec -- vite build --base=/illustro/r2-audit-fixes-round4/
          test -f apps/editor/dist/index.html
          grep -q '/illustro/r2-audit-fixes-round4/assets/' apps/editor/dist/index.html
          grep -q 'illustro-preview-cache:illustro-r2-audit-fixes-round4:' apps/editor/dist/sw.js
          printf '{"sourceCommit":"%s","branch":"fix/r2-audit-round4-2026-11-26","isolatedStorage":true,"isolation":"localStorage/sessionStorage/IndexedDB/OPFS/Cache/SW (Round4 namespace)"}\n' "$GITHUB_SHA" > apps/editor/dist/release.json
      - uses: actions/upload-artifact@v4
        with:
          name: illustro-r2-audit-fixes-round4-preview
          path: apps/editor/dist/
          if-no-files-found: error
          retention-days: 3

  prepublish-browser:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        check: [SEL-001, BRU-011, LIN-006, D-007-regression, D-008-regression, D-028-regression]
    env:
      R2_CHROME_CHANNEL: chrome
      RT_PLAYWRIGHT_PATH: /tmp/r2-audit-browser/node_modules/playwright
      PREP_PNG_PATH: /tmp/r2-audit-browser/node_modules/pngjs
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      R2_AUDIT_FIX_URL: http://127.0.0.1:4173/illustro/r2-audit-fixes-round4/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test dependencies
        run: |
          npm install --prefix /tmp/r2-audit-browser playwright@1.62.1 pngjs@7.0.0 --no-audit --no-fund
          command -v google-chrome
      - uses: actions/download-artifact@v4
        with:
          name: illustro-r2-audit-fixes-round4-preview
          path: local-site/illustro/r2-audit-fixes-round4
      - name: Serve the exact built artifact under its production base
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory local-site >/tmp/r2-local-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS "${R2_AUDIT_FIX_URL}release.json" | grep -q "$GITHUB_SHA"; then exit 0; fi
            sleep 1
          done
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: round4-line-fixture
          path: r4-fixtures
      - name: Independently operate and check pixels
        shell: bash
        run: |
          set -o pipefail
          export R2_ROUND4_FIXTURE_DIR="$PWD/r4-fixtures"
          case "${{ matrix.check }}" in
            SEL-001|BRU-011|LIN-006) node scripts/r2-audit-fixes-round4-browser-smoke.mjs "${{ matrix.check }}" ;;
            D-007-regression) node scripts/r2-audit-fixes-fill-browser-smoke.mjs D-007 ;;
            D-008-regression) node scripts/r2-audit-fixes-remaining-browser-smoke.mjs D-008 ;;
            D-028-regression) sed 's/illustro-r2-audit-fixes-round3/illustro-r2-audit-fixes-round4/g' scripts/r2-audit-fixes-round3-browser-smoke.mjs > scripts/.round4-regression-browser.mjs; node scripts/.round4-regression-browser.mjs D-028 ;;
            *) exit 1 ;;
          esac 2>&1 | tee r2-browser-result.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: prepublish-browser-${{ matrix.check }}
          path: |
            r2-browser-result.log
            r2-*-failure.png
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: [build, prepublish-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out site without touching existing folders
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 0
      - run: |
          rm -rf site/r2-audit-fixes-round4
          mkdir -p site/r2-audit-fixes-round4
      - uses: actions/download-artifact@v4
        with:
          name: illustro-r2-audit-fixes-round4-preview
          path: site/r2-audit-fixes-round4
      - name: Commit only new isolated directory
        shell: bash
        run: |
          set -euo pipefail
          test -f site/r2-audit-fixes-round4/index.html
          test -f site/r2-audit-fixes-round4/release.json
          git -C site config user.name 'github-actions[bot]'
          git -C site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C site add --all r2-audit-fixes-round4
          unexpected="$(git -C site diff --cached --name-only | grep -Ev '^r2-audit-fixes-round4/' || true)"
          test -z "$unexpected"
          if git -C site diff --cached --quiet; then exit 0; fi
          git -C site commit -m "preview: isolated R2 audit fixes $GITHUB_SHA"
          git -C site pull --rebase origin gh-pages
          unexpected="$(git -C site diff-tree --no-commit-id --name-only -r HEAD | grep -Ev '^r2-audit-fixes-round4/' || true)"
          test -z "$unexpected"
          git -C site push origin HEAD:gh-pages
      - name: Verify actual served commit
        shell: bash
        run: |
          set -euo pipefail
          URL=https://totoro0419.github.io/illustro/r2-audit-fixes-round4/
          for attempt in $(seq 1 24); do
            if curl --fail --location --silent "${URL}release.json" -o /tmp/audit-fix-release.json &&
              grep -q "$GITHUB_SHA" /tmp/audit-fix-release.json &&
              curl --fail --location --silent "$URL" -o /tmp/audit-fix-index.html &&
              grep -q 'r2-audit-fixes-round4/assets/' /tmp/audit-fix-index.html; then
              echo "Verified isolated preview at $URL commit $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "Fix preview content did not match source commit"; exit 1


  browser-smoke:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        check: [SEL-001, BRU-011, LIN-006]
    env:
      R2_CHROME_CHANNEL: chrome
      RT_PLAYWRIGHT_PATH: /tmp/r2-audit-browser/node_modules/playwright
      PREP_PNG_PATH: /tmp/r2-audit-browser/node_modules/pngjs
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      R2_AUDIT_FIX_URL: https://totoro0419.github.io/illustro/r2-audit-fixes-round4/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test dependencies
        run: |
          npm install --prefix /tmp/r2-audit-browser playwright@1.62.1 pngjs@7.0.0 --no-audit --no-fund
          command -v google-chrome
      - uses: actions/download-artifact@v4
        with:
          name: round4-line-fixture
          path: r4-fixtures
      - name: Independently operate and check pixels
        shell: bash
        run: |
          set -o pipefail
          export R2_ROUND4_FIXTURE_DIR="$PWD/r4-fixtures"
          case "${{ matrix.check }}" in
            SEL-001|BRU-011|LIN-006) node scripts/r2-audit-fixes-round4-browser-smoke.mjs "${{ matrix.check }}" ;;
            D-007-regression) node scripts/r2-audit-fixes-fill-browser-smoke.mjs D-007 ;;
            D-008-regression) node scripts/r2-audit-fixes-remaining-browser-smoke.mjs D-008 ;;
            D-028-regression) sed 's/illustro-r2-audit-fixes-round3/illustro-r2-audit-fixes-round4/g' scripts/r2-audit-fixes-round3-browser-smoke.mjs > scripts/.round4-regression-browser.mjs; node scripts/.round4-regression-browser.mjs D-028 ;;
            *) exit 1 ;;
          esac 2>&1 | tee r2-browser-result.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-smoke-${{ matrix.check }}
          path: |
            r2-browser-result.log
            r2-*-failure.png
          if-no-files-found: warn
          retention-days: 7
