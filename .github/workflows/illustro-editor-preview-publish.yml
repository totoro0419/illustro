name: Illustro editor preview at /preview (preserve live home)

on:
  push:
    branches: [gh-pages]
    paths:
      - .github/workflows/illustro-editor-preview-publish.yml

permissions:
  contents: write
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: illustro-pages-from-gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen editor preview source
        uses: actions/checkout@v4
        with:
          ref: preview/illustro-c03-c10-20261117
          persist-credentials: false
      - name: Checkout existing publishing branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: existing-site
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Build editor
        run: |
          npm ci --no-audit --no-fund
          npm run brush:build > /tmp/illustro-brush-build.log 2>&1 || { tail -n 80 /tmp/illustro-brush-build.log; exit 1; }
          npm --workspace @illustro/editor run build -- --base=/illustro/preview/
      - name: Preserve existing public homepage and add editor preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pages-output/preview
          cp -a existing-site/index.html pages-output/index.html
          cp -a existing-site/.nojekyll pages-output/.nojekyll
          cp -a apps/editor/dist/. pages-output/preview/
          cmp existing-site/index.html pages-output/index.html
          test -f pages-output/preview/index.html
          test -s pages-output/index.html
      - name: Commit preview files to the actual Pages publishing branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p existing-site/preview
          cp -a apps/editor/dist/. existing-site/preview/
          git -C existing-site config user.name "github-actions[bot]"
          git -C existing-site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C existing-site add -- preview/
          changed="$(git -C existing-site diff --cached --name-only)"
          if [[ -n "$changed" ]]; then
            while IFS= read -r file; do
              [[ "$file" == preview/* ]] || { echo "Refusing to change non-preview file: $file"; exit 1; }
            done <<< "$changed"
            git -C existing-site commit -m "deploy: publish Illustro editor preview under preview/"
            git -C existing-site push origin HEAD:gh-pages
          else
            echo "Preview files are already committed"
          fi
          test -f existing-site/preview/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-output
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy from approved publishing branch
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify live editor and preserved homepage
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors --output /tmp/preview.html "https://totoro0419.github.io/illustro/preview/"
          curl --fail --location --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors --output /tmp/home.html "https://totoro0419.github.io/illustro/"
          grep -qi '<html' /tmp/preview.html
          grep -qi 'Illustro Brush Foundation' /tmp/home.html
  report:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Record preview status for inspection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_RESULT" == "success" ]]; then
            state=success
            message="Preview live and previous homepage remains available"
          else
            state=failure
            message="Preview build, Pages deployment, or website verification failed"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --method POST \
            -f state="$state" -f context="illustro-preview/pages" -f description="$message" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --silent
