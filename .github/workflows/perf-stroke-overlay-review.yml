name: Stroke overlay review
on:
  push:
    branches: ['perf/stroke-overlay-2026-10-16']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: stroke-overlay-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  supersede:
    runs-on: ubuntu-latest
    steps:
      - name: Stop superseded comparison runs on this review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/perf-stroke-overlay-review.yml/runs?branch=perf%2Fstroke-overlay-2026-10-16&per_page=20" --jq ".workflow_runs[] | select(.id < $GITHUB_RUN_ID and (.status == \"in_progress\" or .status == \"queued\")) | .id" > /tmp/old-overlay-runs
          while read -r obsolete_run; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$obsolete_run/cancel" || true
          done < /tmp/old-overlay-runs
  regression:
    needs: supersede
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Canonical preservation, discovered tests and editor build
        run: |
          git diff --exit-code d9f52391bb2eeed4750e571262c8a089171d011e -- apps/editor/src/color packages/brush-rt/src/foundation.mjs packages/brush-rt/src/model.mjs packages/brush-rt/src/shaders.mjs packages/brush-rt/src/canonical.worker.mjs packages/core
          npm run prep:check
          npm run core:check
          npm run brush:build > /tmp/brush-build.log
          git diff --exit-code -- prototypes/brush-rt/dist/illustro-brush-rt.html
          npx vitest run apps/editor/src
          node --test packages/brush-rt/test/*.test.mjs > /tmp/brush-tests.log
          node scripts/check-test-summary.mjs /tmp/brush-tests.log
          npm --workspace @illustro/editor exec -- tsc --noEmit
          VITE_COMMIT_SHA=${{ github.sha }} npm --workspace @illustro/editor exec -- vite build --base=./
      - run: |
          npm install --prefix /tmp/overlay-browser playwright@1.62.1 --no-audit --no-fund
          /tmp/overlay-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Brushes, views, history, save, Recovery, export, color and home
        env:
          RT_PLAYWRIGHT_PATH: /tmp/overlay-browser/node_modules/playwright
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          M08_PERF_REVIEW: '1'
          M05_EXPECT_MILESTONE: M07
          M06_EXPECT_MILESTONE: M07
          M08_CORRUPT_ALL_RENDER_CACHES: '1'
          MOBILE_HOME: '1'
          MOBILE_INPUT_OUTPUT: /tmp/overlay-regression/mobile/report.json
          UNDO_QUALITY_CANVAS_SIZE: '4000'
          UNDO_QUALITY_OUTPUT: /tmp/overlay-regression/navigation/report.json
        run: |
          node scripts/stroke-handoff-operations.mjs
          node scripts/editor-m09-smoke.mjs
          node scripts/editor-orbit-smoke.mjs
          node scripts/editor-color-hit-smoke.mjs
          node scripts/editor-gesture-cancel-smoke.mjs
          node scripts/editor-m05-smoke.mjs
          node scripts/editor-m06-smoke.mjs
          node scripts/editor-m08-smoke.mjs
          node scripts/editor-home-smoke.mjs
          node scripts/editor-works-smoke.mjs
          node scripts/editor-works-safety-smoke.mjs
          node scripts/mobile-input-smoke.mjs
          node scripts/undo-navigation-quality.mjs
      - uses: actions/upload-artifact@v4
        with: {name: overlay-app, path: apps/editor/dist/}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-regression
          path: |
            /tmp/overlay-regression/
            /tmp/*-evidence/
            /tmp/illustro-m05/
            /tmp/brush-tests.log
  quality:
    needs: supersede
    strategy:
      fail-fast: false
      matrix:
        backend: [webgl2, webgpu]
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          npm run brush:build > /tmp/brush-build.log
          git worktree add --detach /tmp/overlay-before d9f52391bb2eeed4750e571262c8a089171d011e
          cd /tmp/overlay-before
          npm ci --ignore-scripts --no-audit --no-fund
          npm run brush:build > /tmp/overlay-before-build.log
          VITE_COMMIT_SHA=d9f52391bb2eeed4750e571262c8a089171d011e npm --workspace @illustro/editor exec -- vite build --base=./
      - uses: actions/upload-artifact@v4
        if: matrix.backend == 'webgl2'
        with: {name: overlay-before-app, path: /tmp/overlay-before/apps/editor/dist/}
      - run: |
          npm install --prefix /tmp/overlay-browser playwright@1.62.1 --no-audit --no-fund
          /tmp/overlay-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Exact strict pixels and fit-view visual comparison
        env:
          RT_PLAYWRIGHT_PATH: /tmp/overlay-browser/node_modules/playwright
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          FORMAL_BEFORE_ROOT: /tmp/overlay-before/packages/brush-rt/dist
          FORMAL_QUALITY_OUTPUT: /tmp/overlay-quality/formal/report.json
          OVERLAY_BACKENDS: ${{ matrix.backend }}
          OVERLAY_SIZES: '2000,4000,8000'
          OVERLAY_LAYOUTS: 'phone,tablet'
          OVERLAY_MODES: 'A,C'
          OVERLAY_BRUSHES: 'thin,broad,pencil,erase,lower,fade,fine,marker,technical,soft'
        run: |
          node scripts/stroke-overlay-formal.mjs
          node scripts/stroke-overlay-quality.mjs
      - name: Existing strict pressure and presentation cache quality
        env:
          RT_PLAYWRIGHT_PATH: /tmp/overlay-browser/node_modules/playwright
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          HANDOFF_QUALITY_OUTPUT: /tmp/overlay-quality/strict/report.json
          VIEWPORT_QUALITY_OUTPUT: /tmp/overlay-quality/viewport/report.json
          PRESSURE_QUALITY_OUTPUT: /tmp/overlay-quality/pressure/report.json
        run: |
          node scripts/stroke-handoff-quality.mjs
          node scripts/viewport-cache-quality.mjs
          node scripts/preview-pressure-quality.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'overlay-quality-${{ matrix.backend }}', path: /tmp/overlay-quality/}
  performance:
    needs: supersede
    strategy:
      fail-fast: false
      matrix:
        backend: [webgl2, webgpu]
        size: ['512x384', '2000', '4000', '8000']
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          npm run brush:build > /tmp/brush-build.log
          git worktree add --detach /tmp/overlay-before d9f52391bb2eeed4750e571262c8a089171d011e
          cd /tmp/overlay-before
          npm ci --ignore-scripts --no-audit --no-fund
          npm run brush:build > /tmp/overlay-before-build.log
      - run: |
          npm install --prefix /tmp/overlay-browser playwright@1.62.1 --no-audit --no-fund
          /tmp/overlay-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Matched same-runner PR30 and stroke-only matrix
        env:
          RT_PLAYWRIGHT_PATH: /tmp/overlay-browser/node_modules/playwright
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          INSTANT_BACKENDS: ${{ matrix.backend }}
          INSTANT_SIZES: ${{ matrix.size }}
          INSTANT_OUTPUT: /tmp/overlay-performance/matrix.json
        run: node scripts/stroke-overlay-benchmark.mjs
      - name: Three balanced 4000px fit repetitions
        if: matrix.size == '4000'
        env:
          RT_PLAYWRIGHT_PATH: /tmp/overlay-browser/node_modules/playwright
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          INSTANT_BACKENDS: ${{ matrix.backend }}
          INSTANT_SIZES: '4000'
          INSTANT_VIEWS: fit
          INSTANT_KINDS: long
          INSTANT_MODES: 'A,C'
          INSTANT_ROUNDS: '3'
          INSTANT_OUTPUT: /tmp/overlay-performance/paired.json
        run: node scripts/stroke-overlay-benchmark.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'overlay-performance-${{ matrix.backend }}-${{ matrix.size }}', path: /tmp/overlay-performance/}
  profiles:
    needs: supersede
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run brush:build > /tmp/brush-build.log
      - run: |
          npm install --prefix /tmp/overlay-browser playwright@1.62.1 --no-audit --no-fund
          /tmp/overlay-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Quality and workload at all area ratios
        env:
          RT_PLAYWRIGHT_PATH: /tmp/overlay-browser/node_modules/playwright
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          OVERLAY_BACKENDS: webgl2
          OVERLAY_MODES: C
          OVERLAY_PROFILE_COMPARE: '1'
          OVERLAY_BRUSHES: 'thin,broad,pencil,fine'
          OVERLAY_RATIOS: '1,0.5,0.25,0.125,0.0625,0.03125,0.015625,0.0078125'
          OVERLAY_QUALITY_OUTPUT: /tmp/overlay-profiles/report.json
        run: node scripts/stroke-overlay-quality.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: overlay-profiles, path: /tmp/overlay-profiles/}

  history:
    needs: supersede
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          npm run brush:build > /tmp/brush-build.log
          git worktree add --detach /tmp/overlay-before d9f52391bb2eeed4750e571262c8a089171d011e
          cd /tmp/overlay-before
          npm ci --ignore-scripts --no-audit --no-fund
          npm run brush:build > /tmp/overlay-before-build.log
      - run: |
          npm install --prefix /tmp/overlay-browser playwright@1.62.1 --no-audit --no-fund
          /tmp/overlay-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Completed histories do not participate in normal preview
        env:
          RT_PLAYWRIGHT_PATH: /tmp/overlay-browser/node_modules/playwright
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          node scripts/stroke-overlay-history.mjs
          node scripts/stroke-overlay-allocation.mjs
          node scripts/stroke-overlay-layers.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-history
          path: |
            /tmp/overlay-history/
            /tmp/overlay-allocation/
            /tmp/overlay-layers/
  publish:
    needs: [regression, quality, performance, profiles, history]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: gh-pages, path: site}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/download-artifact@v4
        with: {name: overlay-app, path: review-build}
      - uses: actions/download-artifact@v4
        with: {name: overlay-before-app, path: review-before}
      - uses: actions/download-artifact@v4
        with: {name: overlay-quality-webgl2, path: review-evidence/quality/webgl2}
      - uses: actions/download-artifact@v4
        with: {name: overlay-quality-webgpu, path: review-evidence/quality/webgpu}
      - uses: actions/download-artifact@v4
        with: {name: overlay-profiles, path: review-evidence/profiles}
      - uses: actions/download-artifact@v4
        with: {name: overlay-history, path: review-evidence/history}
      - uses: actions/download-artifact@v4
        with: {name: overlay-regression, path: review-evidence/regression}
      - uses: actions/download-artifact@v4
        with: {pattern: 'overlay-performance-*', path: review-performance}
      - name: Assemble exact-source measurements and block unproved improvement
        env: {EXPECTED_COMMIT_SHA: '${{ github.sha }}'}
        run: |
          mkdir -p review-evidence/performance
          for folder in review-performance/overlay-performance-*; do
            name=$(basename "$folder")
            cp -a "$folder" "review-evidence/performance/${name#overlay-performance-}"
          done
          node scripts/stroke-overlay-report.mjs review-evidence
      - run: |
          npm install --prefix /tmp/overlay-browser playwright@1.62.1 --no-audit --no-fund
          /tmp/overlay-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify actual comparison shell and evidence gallery before publishing
        env:
          RT_PLAYWRIGHT_PATH: /tmp/overlay-browser/node_modules/playwright
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          OVERLAY_APP_ROOT: review-build
          OVERLAY_BEFORE_APP_ROOT: review-before
          OVERLAY_EVIDENCE_ROOT: review-evidence
          INSTANT_BROWSER_OUTPUT: /tmp/overlay-local-qa/report.json
        run: node scripts/stroke-overlay-browser.mjs
      - name: Preserve every previous QA file and publish only this directory
        run: |
          (cd site && find qa -type f ! -path 'qa/perf-stroke-overlay/*' -print0 | sort -z | xargs -0 sha256sum) > /tmp/old-qa.before
          mkdir -p site/qa/perf-stroke-overlay/app site/qa/perf-stroke-overlay/before site/qa/perf-stroke-overlay/evidence
          cp qa/perf-stroke-overlay/*.html site/qa/perf-stroke-overlay/
          cp -a review-build/. site/qa/perf-stroke-overlay/app/
          cp -a review-before/. site/qa/perf-stroke-overlay/before/
          cp -a review-evidence/. site/qa/perf-stroke-overlay/evidence/
          cp -a /tmp/overlay-local-qa site/qa/perf-stroke-overlay/evidence/local-browser
          (cd site && find qa -type f ! -path 'qa/perf-stroke-overlay/*' -print0 | sort -z | xargs -0 sha256sum) > /tmp/old-qa.after
          diff -u /tmp/old-qa.before /tmp/old-qa.after
          cp /tmp/old-qa.before site/qa/perf-stroke-overlay/evidence/previous-qa.sha256
      - name: Publish isolated QA with source lease
        working-directory: site
        run: |
          current=$(git ls-remote origin refs/heads/perf/stroke-overlay-2026-10-16 | cut -f1)
          test "$current" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/perf-stroke-overlay
          git diff --cached --quiet || git commit -m 'qa: publish stroke-only preview and quality comparison'
          git push origin HEAD:gh-pages
      - name: Wait for exact source on public GitHub Pages
        env: {EXPECTED_COMMIT_SHA: '${{ github.sha }}'}
        run: |
          ready=0
          for i in $(seq 1 36); do
            curl -fsSL "https://totoro0419.github.io/illustro/qa/perf-stroke-overlay/evidence/qa-status.json?build=$GITHUB_SHA" -o /tmp/public-overlay.json || true
            if node -e "try{process.exit(JSON.parse(require('fs').readFileSync('/tmp/public-overlay.json')).sourceCommit===process.env.EXPECTED_COMMIT_SHA?0:1)}catch{process.exit(1)}"; then ready=1; break; fi
            sleep 5
          done
          test "$ready" = 1
      - name: Real published drawing, history, saved work, touch and comparison images
        env:
          RT_PLAYWRIGHT_PATH: /tmp/overlay-browser/node_modules/playwright
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          HANDOFF_PUBLIC_URL: https://totoro0419.github.io/illustro/qa/perf-stroke-overlay/app/
          MOBILE_PUBLIC_URL: https://totoro0419.github.io/illustro/qa/perf-stroke-overlay/app/
          HANDOFF_OPERATIONS_OUTPUT: /tmp/overlay-public/operations/report.json
          MOBILE_HOME: '1'
          MOBILE_INPUT_OUTPUT: /tmp/overlay-public/mobile/report.json
          INSTANT_PUBLIC_URL: https://totoro0419.github.io/illustro/qa/perf-stroke-overlay/
          INSTANT_BROWSER_OUTPUT: /tmp/overlay-public/qa-page/report.json
        run: |
          node scripts/stroke-handoff-operations.mjs
          node scripts/mobile-input-smoke.mjs
          node scripts/stroke-overlay-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-public-verification
          path: |
            /tmp/overlay-public/
            /tmp/overlay-local-qa/
            review-evidence/qa-status.json
            review-evidence/RESULTS.md
