name: Illustro Editor Preview (preserve P0 home)

on:
  push:
    branches:
      - preview/illustro-c03-c10-20261117
    paths:
      - .github/workflows/illustro-preview-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: illustro-preview-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview editor snapshot
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout existing P0 home from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: p0-source
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Build editor for separate preview path
        run: |
          npm ci --no-audit --no-fund
          npm --workspace @illustro/editor run build -- --base=/illustro/preview/
      - name: Build existing public home unchanged
        working-directory: p0-source/prototypes/p0-architecture
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build:pages
      - name: Combine both builds without overwriting home
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pages-output/preview
          cp -a p0-source/prototypes/p0-architecture/dist/. pages-output/
          cp -a apps/editor/dist/. pages-output/preview/
          test -f pages-output/index.html
          test -f pages-output/preview/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-output
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages with preview subpath
        id: deploy
        uses: actions/deploy-pages@v4
