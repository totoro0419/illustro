name: Illustro Editor Preview (preserve P0 home)

on:
  push:
    branches:
      - preview/illustro-c03-c10-20261117
    paths:
      - .github/workflows/illustro-preview-pages.yml

permissions:
  contents: read
  pages: write
  statuses: write
  id-token: write

concurrency:
  group: illustro-preview-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview editor snapshot
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout existing P0 home from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: p0-source
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Build editor for separate preview path
        run: |
          npm ci --no-audit --no-fund
          npm run brush:build > /tmp/illustro-brush-build.log 2>&1 || { tail -n 80 /tmp/illustro-brush-build.log; exit 1; }
          npm --workspace @illustro/editor run build -- --base=/illustro/preview/
      - name: Build existing public home in an isolated directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/illustro-p0"
          cp -a p0-source/prototypes/p0-architecture/. "$RUNNER_TEMP/illustro-p0/"
          cd "$RUNNER_TEMP/illustro-p0"
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build:pages
          cp -a dist "$GITHUB_WORKSPACE/p0-source/prototypes/p0-architecture/dist"
      - name: Combine both builds without overwriting home
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pages-output/preview
          cp -a p0-source/prototypes/p0-architecture/dist/. pages-output/
          cp -a apps/editor/dist/. pages-output/preview/
          test -f pages-output/index.html
          test -f pages-output/preview/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-output
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages with preview subpath
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify public editor preview and existing homepage
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors \
            --output /tmp/illustro-preview.html "https://totoro0419.github.io/illustro/preview/"
          curl --fail --location --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors \
            --output /tmp/illustro-home.html "https://totoro0419.github.io/illustro/"
          grep -qi '<html' /tmp/illustro-preview.html
          grep -qi '<html' /tmp/illustro-home.html

  report:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Record deployment result for independent inspection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_RESULT" == "success" ]]; then
            state=success
            message="Preview deployed; public preview and homepage checks passed"
          else
            state=failure
            message="Preview build, deployment, or public URL verification failed"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --method POST \
            -f state="$state" \
            -f context="illustro-preview/pages" \
            -f description="$message" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --silent
