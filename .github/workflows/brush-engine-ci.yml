name: Brush Engine CI
on:
  push:
    branches: ["brush/**"]
    paths: ["packages/brush/**", "packages/core/**", "prototypes/brush-lab/**", "package.json", "package-lock.json", ".github/workflows/brush-engine-ci.yml"]
  pull_request:
    paths: ["packages/brush/**", "packages/core/**", "prototypes/brush-lab/**", "package.json", "package-lock.json", ".github/workflows/brush-engine-ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run brush:check
      - run: npm exec -- tsc -p prototypes/brush-lab/tsconfig.json --noEmit
      - run: npm run brush:lab && npm run brush:atlas
      - run: npm --prefix prototypes/p0-architecture run test && npm --prefix prototypes/p0-architecture run build
      - run: npm run brush:benchmark
      - run: npx playwright-core install --with-deps chromium
      - run: npm run brush:latency
      - run: npm run brush:thick
      - run: npm run brush:throughput
      - run: npm run brush:overload
      - run: npm run brush:paced
      - run: npm run brush:browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: brush-evidence
          path: |
            docs/brush/evidence
            prototypes/brush-lab/illustro-brush-lab.html
