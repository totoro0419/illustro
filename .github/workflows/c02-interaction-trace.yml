name: C02 simultaneous interaction trace
on:
  push:
    branches: [implementation/stage4-c02-brush-engine]
    paths: ['.github/workflows/c02-interaction-trace.yml', 'c01/app/preview-worker.mjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c02-trace-${{ github.ref }}
  cancel-in-progress: true
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install test dependencies
        run: npm ci --no-audit --no-fund
        timeout-minutes: 2
        working-directory: c01
      - name: Install frozen Chromium (runner already supplies Chrome system libraries)
        run: npx playwright install chromium
        timeout-minutes: 3
        working-directory: c01
      - name: Verify snapshot preview and exact native handoff
        run: node test/async-preview-test.mjs
        working-directory: c01
        env:
          ILLUSTRO_TEST_CANVAS: snapshot
          ILLUSTRO_ASYNC_OUT: /tmp/c02-simultaneous-snapshot-accuracy.json
      - name: Trace live ink plus pinch and rotation
        run: node test/performance-compare.mjs
        working-directory: c01
        env:
          ILLUSTRO_BENCH_ROOTS: >-
            {"after":"${{ github.workspace }}/c01"}
          ILLUSTRO_BENCH_CASES: >-
            [{"name":"simultaneous","size":300,"brush":"gpen","width":2560,"height":1920,"strokes":5,"simultaneous":true}]
          ILLUSTRO_BENCH_OUT: /tmp/c02-simultaneous.json
          ILLUSTRO_TRACE: /tmp/c02-simultaneous-trace.json
          ILLUSTRO_TRACE_CATEGORIES: devtools.timeline,disabled-by-default-devtools.timeline,disabled-by-default-devtools.timeline.frame,cc,gpu,v8
      - name: Compare adaptive snapshot display on the same host
        working-directory: c01
        run: node test/performance-compare.mjs
        env:
          ILLUSTRO_BENCH_ROOTS: >-
            {"after":"${{ github.workspace }}/c01"}
          ILLUSTRO_BENCH_CASES: >-
            [{"name":"simultaneous","size":300,"brush":"gpen","width":2560,"height":1920,"strokes":5,"simultaneous":true}]
          ILLUSTRO_DISPLAY_CANVAS: snapshot
          ILLUSTRO_BENCH_OUT: /tmp/c02-simultaneous-snapshot.json
          ILLUSTRO_TRACE: /tmp/c02-simultaneous-snapshot-trace.json
          ILLUSTRO_TRACE_CATEGORIES: devtools.timeline,disabled-by-default-devtools.timeline,disabled-by-default-devtools.timeline.frame,cc,gpu,v8
      - name: Compare backing hints without tracing overhead
        working-directory: c01
        run: |
          ILLUSTRO_BENCH_OUT=/tmp/c02-simultaneous-untraced.json node test/performance-compare.mjs
          ILLUSTRO_DISPLAY_CANVAS=snapshot ILLUSTRO_BENCH_OUT=/tmp/c02-simultaneous-snapshot-untraced.json node test/performance-compare.mjs
        env:
          ILLUSTRO_BENCH_ROOTS: >-
            {"after":"${{ github.workspace }}/c01"}
          ILLUSTRO_BENCH_CASES: >-
            [{"name":"thin","size":10,"brush":"gpen","width":640,"height":480,"strokes":10},{"name":"simultaneous","size":300,"brush":"gpen","width":2560,"height":1920,"strokes":10,"simultaneous":true},{"name":"hundred","size":12,"brush":"gpen","width":640,"height":480,"strokes":100}]
      - run: gzip /tmp/c02-simultaneous*-trace.json
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c02-simultaneous-trace
          path: /tmp/c02-simultaneous*
