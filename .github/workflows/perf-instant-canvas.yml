name: Instant canvas
on:
  push:
    branches: ['perf/instant-canvas-2026-10-16']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: instant-canvas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run brush:build > /tmp/brush-build.log
      - run: VITE_COMMIT_SHA=${{ github.sha }} npm --workspace @illustro/editor exec -- vite build --base=./
      - run: |
          npm install --prefix /tmp/instant-browser playwright@1.62.1 --no-audit --no-fund
          /tmp/instant-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Preserve browser for reproducible local comparison
        run: tar -czf /tmp/instant-chromium.tgz -C "$HOME/.cache/ms-playwright" chromium-1234
      - uses: actions/upload-artifact@v4
        with: {name: instant-chromium, path: /tmp/instant-chromium.tgz, retention-days: 2}
      - name: Measure unchanged A baseline
        env:
          RT_PLAYWRIGHT_PATH: /tmp/instant-browser/node_modules/playwright
          THIN_BEFORE_ROOT: apps/editor/dist
          THIN_AFTER_ROOT: apps/editor/dist
          THIN_BEFORE_SHA: ${{ github.sha }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          THIN_ROUNDS: '1'
          THIN_BRUSHES: '1,64'
          THIN_OUTPUT: /tmp/instant-baseline/comparison.json
        run: node scripts/thin-stroke-benchmark.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: instant-baseline, path: /tmp/instant-baseline/}
