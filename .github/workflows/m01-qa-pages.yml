name: Publish M01 QA Preview

on:
  push:
    branches: ['milestone/M01-stroke-commit']
    paths:
      - 'apps/editor/**'
      - 'packages/core/**'
      - 'scripts/editor-m01-public-smoke.mjs'
      - '.github/workflows/m01-qa-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m01-qa-pages
  cancel-in-progress: true

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout M01 source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build frozen Brush runtime
        run: npm run brush:build > /tmp/m01-brush-build.log
      - name: Build M01 editor for fixed Pages path
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
        run: |
          npm --workspace @illustro/editor exec -- tsc --noEmit
          npm --workspace @illustro/editor exec -- vite build --base=./
      - name: Checkout current Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Preserve all existing Pages and replace only M01 QA
        run: |
          rm -rf site/qa/m01
          mkdir -p site/qa/m01
          cp -a apps/editor/dist/. site/qa/m01/
          touch site/.nojekyll
      - name: Publish M01 into gh-pages without touching older QA pages
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/m01 .nojekyll
          if git diff --cached --quiet; then
            echo "QA output already matches gh-pages."
          else
            git commit -m "qa: publish M01 fixed review page"
            git push origin HEAD:gh-pages
          fi
      - name: Wait for fixed public QA URL
        env:
          QA_URL: https://totoro0419.github.io/illustro/qa/m01/
        run: |
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -L -sS -o /tmp/m01.html -w "%{http_code}" "$QA_URL" || true)
            if [ "$code" = "200" ] && grep -q '<title>Illustro</title>' /tmp/m01.html; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "Fixed QA URL did not become reachable."
            exit 1
          fi
      - name: Install public browser verifier
        run: |
          npm install --prefix /tmp/m01-public-browser playwright@1.62.1 --no-audit --no-fund
          /tmp/m01-public-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify the actual public M01 page with WebGL2 and WebGPU
        env:
          RT_PLAYWRIGHT_PATH: /tmp/m01-public-browser/node_modules/playwright
          M01_PUBLIC_URL: https://totoro0419.github.io/illustro/qa/m01/
        run: node scripts/editor-m01-public-smoke.mjs
