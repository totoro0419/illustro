name: Publish Illustro C01 preview
on:
  push:
    branches: [implementation/stage4-c01-basic-paint]
    paths: ["c01/**", ".github/workflows/publish-c01-preview.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: illustro-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
        working-directory: c01
      - run: npm run check
        working-directory: c01
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble site without dropping Stage III references
        run: |
          mkdir -p _site/c01 _site/qa/ui-prototype _site/qa/performance-lab
          cp -R c01/dist/. _site/c01/
          cp qa/ui-prototype/index.html _site/qa/ui-prototype/index.html
          cp qa/performance-lab/index.html _site/qa/performance-lab/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
