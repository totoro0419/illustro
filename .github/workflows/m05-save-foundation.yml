name: M05 Save Foundation

on:
  push:
    branches: ['milestone/M05-save-foundation']
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: m05-save-foundation
  cancel-in-progress: true

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout M05 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Source lock and Core
        run: |
          npm run prep:check
          npm run core:check
          node --check scripts/editor-m05-smoke.mjs
      - name: M01-M05 editor unit tests
        run: npx vitest run apps/editor/src/strokeCommit.test.ts apps/editor/src/layerSelection.test.ts apps/editor/src/historyController.test.ts apps/editor/src/eraserIntegration.test.ts apps/editor/src/persistence/format.test.ts
      - name: Brush Foundation exact 93-test regression
        run: |
          npm run brush:build > /tmp/m05-brush-build.log
          node --test packages/brush-rt/test/*.test.mjs | tee /tmp/m05-brush-regression.log
          grep -Eq '(^|[^0-9])tests +93([^0-9]|$)' /tmp/m05-brush-regression.log
          grep -Eq '(^|[^0-9])pass +93([^0-9]|$)' /tmp/m05-brush-regression.log
          grep -Eq '(^|[^0-9])fail +0([^0-9]|$)' /tmp/m05-brush-regression.log
      - name: Build M05 editor
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
        run: |
          npm --workspace @illustro/editor exec -- tsc --noEmit
          npm --workspace @illustro/editor exec -- vite build --base=./
          test -f apps/editor/dist/sw.js
          test -f apps/editor/dist/manifest.webmanifest
          test -f apps/editor/dist/offline-assets.json
          node -e "const m=require('./apps/editor/dist/offline-assets.json'); if(!Array.isArray(m.assets)||!m.assets.some(x=>/worker/i.test(x))||!m.assets.some(x=>/\.js$/.test(x))) process.exit(1)"
      - name: Install browser verifier
        run: |
          npm install --prefix /tmp/m05-browser playwright@1.62.1 --no-audit --no-fund
          /tmp/m05-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: M05 local browser Save Recovery OPFS Offline
        env:
          RT_PLAYWRIGHT_PATH: /tmp/m05-browser/node_modules/playwright
          M05_EVIDENCE_DIRECTORY: /tmp/m05-evidence/local
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/editor-m05-smoke.mjs
      - name: Checkout current Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Preserve M01-M04 and replace only M05 QA
        run: |
          for n in 01 02 03 04; do test -d "site/qa/m$n"; (cd site && find "qa/m$n" -type f -print0 | sort -z | xargs -0 sha256sum) > "/tmp/m$n.before"; done
          rm -rf site/qa/m05
          mkdir -p site/qa/m05
          cp -a apps/editor/dist/. site/qa/m05/
          touch site/.nojekyll
          for n in 01 02 03 04; do (cd site && find "qa/m$n" -type f -print0 | sort -z | xargs -0 sha256sum) > "/tmp/m$n.after"; diff -u "/tmp/m$n.before" "/tmp/m$n.after"; done
      - name: Publish M05 without touching older QA pages
        working-directory: site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/m05 .nojekyll
          if git diff --cached --quiet; then
            echo 'M05 QA output already matches gh-pages.'
          else
            git commit -m 'qa: publish M05 fixed review page'
            git push origin HEAD:gh-pages
          fi
      - name: Wait for exact M05 build and older fixed QA
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          ok=0
          for i in $(seq 1 72); do
            m05=$(curl -L -sS -H 'Cache-Control: no-cache' -o /tmp/m05.html -w '%{http_code}' "https://totoro0419.github.io/illustro/qa/m05/?build=$EXPECTED_COMMIT_SHA" || true)
            good=1
            for n in 01 02 03 04; do
              code=$(curl -L -sS -H 'Cache-Control: no-cache' -o "/tmp/m$n.html" -w '%{http_code}' "https://totoro0419.github.io/illustro/qa/m$n/?m05-check=$EXPECTED_COMMIT_SHA" || true)
              [ "$code" = '200' ] || good=0
            done
            asset=$(sed -n 's#.*src="./\([^"]*\.js\)".*#\1#p' /tmp/m05.html | head -n 1)
            if [ "$m05" = '200' ] && [ "$good" = '1' ] && [ -n "$asset" ]; then
              code=$(curl -L -sS -H 'Cache-Control: no-cache' -o /tmp/m05.js -w '%{http_code}' "https://totoro0419.github.io/illustro/qa/m05/$asset?build=$EXPECTED_COMMIT_SHA" || true)
              sw=$(curl -L -sS -H 'Cache-Control: no-cache' -o /tmp/m05-sw.js -w '%{http_code}' "https://totoro0419.github.io/illustro/qa/m05/sw.js?build=$EXPECTED_COMMIT_SHA" || true)
              if [ "$code" = '200' ] && [ "$sw" = '200' ] && grep -q "$EXPECTED_COMMIT_SHA" /tmp/m05.js; then ok=1; break; fi
            fi
            sleep 5
          done
          test "$ok" = '1'
      - name: Verify actual public M05 with WebGL2 WebGPU Save Recovery Offline
        env:
          RT_PLAYWRIGHT_PATH: /tmp/m05-browser/node_modules/playwright
          M05_EVIDENCE_DIRECTORY: /tmp/m05-evidence/public
          M05_PUBLIC_URL: https://totoro0419.github.io/illustro/qa/m05/
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          ok=0
          for attempt in 1 2 3; do
            if node scripts/editor-m05-smoke.mjs; then ok=1; break; fi
            sleep 10
          done
          test "$ok" = '1'
      - name: Open M01-M04 fixed QA in Chromium
        env:
          RT_PLAYWRIGHT_PATH: /tmp/m05-browser/node_modules/playwright
        run: |
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          const require=createRequire(import.meta.url),{chromium}=require(process.env.RT_PLAYWRIGHT_PATH);
          const browser=await chromium.launch({headless:true});
          for(const url of ['https://totoro0419.github.io/illustro/qa/m01/','https://totoro0419.github.io/illustro/qa/m02/','https://totoro0419.github.io/illustro/qa/m03/','https://totoro0419.github.io/illustro/qa/m04/']){
            const page=await browser.newPage();await page.goto(url,{waitUntil:'networkidle',timeout:45000});
            if(await page.title()!=='Illustro')throw new Error('fixed QA failed to open: '+url);await page.close();
          }
          await browser.close();
          NODE
      - name: Upload M05 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m05-save-foundation-evidence
          path: /tmp/m05-evidence
      - name: Report M05 commit status
        if: always()
        uses: actions/github-script@v7
        env:
          M05_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.M05_JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'M05 Save Foundation',
              description: state === 'success' ? 'M05 save/recovery/offline and public QA passed' : 'M05 verification failed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
