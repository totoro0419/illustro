name: Publish Illustro C02 preview
on:
  push:
    branches: [implementation/stage4-c02-brush-engine]
    paths: ["c01/**", ".github/workflows/publish-c02-preview.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: illustro-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: implementation/stage4-c01-basic-paint
          path: c01-release
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund && npm run check
        working-directory: c01
      - run: node scripts/build.mjs
        working-directory: c01-release/c01
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble C01, C02 and Stage III previews
        run: |
          mkdir -p _site/c01 _site/c02 _site/qa/ui-prototype _site/qa/performance-lab
          cp -R c01-release/c01/dist/. _site/c01/
          cp -R c01/dist/. _site/c02/
          cp qa/ui-prototype/index.html _site/qa/ui-prototype/
          cp qa/performance-lab/index.html _site/qa/performance-lab/
          printf '%s\n' "$GITHUB_SHA" > _site/c02/revision.txt
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: c02-preview
      url: ${{ steps.deployment.outputs.page_url }}c02/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Confirm the public revision and C01 route
        run: |
          url=https://totoro0419.github.io/illustro
          for attempt in $(seq 1 15); do
            current=$(curl -fsSL "$url/c02/revision.txt?rev=$GITHUB_SHA" || true)
            if [ "$current" = "$GITHUB_SHA" ]; then break; fi
            sleep 5
          done
          test "$current" = "$GITHUB_SHA"
          curl -fsSL "$url/c01/" -o /tmp/illustro-c01.html
          grep -q 'Illustro · C01' /tmp/illustro-c01.html
      - run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
        working-directory: c01
      - run: node test/live-test.mjs
        working-directory: c01
