name: QA browser operability evidence
on:
  push:
    branches: ['qa/operability-2026-11-19']
    paths: ['.github/workflows/qa-browser-evidence.yml', 'docs/qa/operability-results/operability-browser.cjs']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix "$RUNNER_TEMP/illustro-qa" playwright@1.62.1 pngjs@7.0.0 --no-audit --no-fund
      - run: '"$RUNNER_TEMP/illustro-qa/node_modules/.bin/playwright" install --with-deps chromium'
      - run: NODE_PATH="$RUNNER_TEMP/illustro-qa/node_modules" node docs/qa/operability-results/operability-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: illustro-browser-operability
          path: artifacts/operability/
