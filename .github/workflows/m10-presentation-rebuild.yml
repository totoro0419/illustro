name: M10 presentation correctness rebuild
on:
  push:
    branches: ['rebuild/M10-presentation-correctness-2026-10-21']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: m10-presentation-rebuild
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      RT_PLAYWRIGHT_PATH: /tmp/rebuild-browser/node_modules/playwright
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          npm run brush:build > /tmp/rebuild-brush.log
          npm run prep:check
          node --test scripts/m10-composed-motion.test.mjs
          npm run core:check
          npm run brush:regression
          npm --workspace @illustro/editor exec -- vitest run
          npm --workspace @illustro/editor exec -- tsc --noEmit
          VITE_COMMIT_SHA=$GITHUB_SHA npm --workspace @illustro/editor exec -- vite build --base=./
      - run: |
          npm install --prefix /tmp/rebuild-browser playwright@1.56.1 pngjs@7.0.0 --no-audit --no-fund
          /tmp/rebuild-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Existing brush management, layers, Undo and portable save
        run: M10_EVIDENCE=/tmp/rebuild-regression/brush.json node scripts/m10-brush-review.mjs
      - name: M08 display sampling and M09 color
        run: |
          M08_SMOKE_QUICK=1 M08_PERF_REVIEW=1 M08_EVIDENCE_DIRECTORY=/tmp/rebuild-regression/m08 node scripts/editor-m08-smoke.mjs
          M09_EVIDENCE_DIRECTORY=/tmp/rebuild-regression/m09 node scripts/editor-m09-smoke.mjs
      - name: M05 autosave, recovery and offline; PR38 gallery/cache reopen
        run: |
          M05_EVIDENCE_DIRECTORY=/tmp/rebuild-regression/m05 M05_EXPECT_MILESTONE=M07 node scripts/editor-m05-smoke.mjs
          MY_WORKS_EVIDENCE=/tmp/rebuild-regression/my-works.json node scripts/my-works-open-review.mjs
      - name: Existing formal brush records/pixels/history compared with immutable start
        run: |
          git worktree add --detach /tmp/illustro-start 8fa3857b5ce8deb4dadacce45f06e121a16e8d85
          (cd /tmp/illustro-start && node prototypes/brush-rt/build.mjs > /tmp/rebuild-before-brush.log)
          FORMAL_BEFORE_ROOT=/tmp/illustro-start/packages/brush-rt/dist FORMAL_MATCH_CONTEXT=1 OVERLAY_BASELINE_SHA=8fa3857b5ce8deb4dadacce45f06e121a16e8d85 FORMAL_QUALITY_OUTPUT=/tmp/rebuild-regression/formal/report.json node scripts/stroke-overlay-formal.mjs
          FORMAL_BEFORE_ROOT=/tmp/illustro-start/packages/brush-rt/dist REBUILD_FORMAL_OUTPUT=/tmp/rebuild-regression/worker-formal/report.json node scripts/m10-rebuild-formal.mjs
      - uses: actions/upload-artifact@v4
        with: {name: rebuild-editor, path: apps/editor/dist/}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rebuild-regression, path: /tmp/rebuild-regression/}
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      RT_PLAYWRIGHT_PATH: /tmp/rebuild-browser/node_modules/playwright
      RT_PNG_PATH: /tmp/rebuild-browser/node_modules/pngjs
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run brush:build > /tmp/rebuild-brush.log
          VITE_COMMIT_SHA=$GITHUB_SHA npm --workspace @illustro/editor exec -- vite build --base=./
          npm install --prefix /tmp/rebuild-browser playwright@1.56.1 pngjs@7.0.0 --no-audit --no-fund
          /tmp/rebuild-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Build immutable start and broken Worker for the independent reveal comparison
        run: |
          git worktree add --detach /tmp/illustro-start 8fa3857b5ce8deb4dadacce45f06e121a16e8d85
          git worktree add --detach /tmp/illustro-broken 34a24724499c69b3867338e5a37fca36c9f117a8
          (cd /tmp/illustro-start && npm ci --ignore-scripts --no-audit --no-fund && npm run brush:build > /tmp/rebuild-before-brush.log && VITE_COMMIT_SHA=8fa3857b5ce8deb4dadacce45f06e121a16e8d85 npm --workspace @illustro/editor exec -- vite build --base=./)
          (cd /tmp/illustro-broken && npm ci --ignore-scripts --no-audit --no-fund && npm run brush:build > /tmp/rebuild-broken-brush.log && VITE_COMMIT_SHA=34a24724499c69b3867338e5a37fca36c9f117a8 npm --workspace @illustro/editor exec -- vite build --base=./)
      - name: All 64 million RGBA bytes, repeated transfers and partial edge tiles
        run: TRANSPORT_OUTPUT=/tmp/rebuild-correctness/transport/report.json node scripts/m10-presentation-transport.mjs
      - name: Rapid reveal during pending drawing and exact retained document on both GPUs/all routes
        run: REBUILD_VERSIONS=before,broken,after REBUILD_OUTPUT=/tmp/rebuild-correctness/reveal/report.json node scripts/m10-rebuild-correctness.mjs
      - name: Pending native Undo/Redo, gestures, file save/reopen
        run: WORKER_HISTORY_OUTPUT=/tmp/rebuild-correctness/history/report.json node scripts/m10-rebuild-history.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rebuild-correctness, path: /tmp/rebuild-correctness/}
  response:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      RT_PLAYWRIGHT_PATH: /tmp/rebuild-browser/node_modules/playwright
      RT_PNG_PATH: /tmp/rebuild-browser/node_modules/pngjs
      RT_JPEG_PATH: /tmp/rebuild-browser/node_modules/jpeg-js
      WORKER_ROUTES: auto
      WORKER_DEVICE_MEMORY: '4'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run brush:build > /tmp/rebuild-brush.log
          VITE_COMMIT_SHA=$GITHUB_SHA npm --workspace @illustro/editor exec -- vite build --base=./
          git worktree add --detach /tmp/illustro-start 14e2d5eb6db49994c8b724bb0202967031e393cc
          (cd /tmp/illustro-start && npm ci --ignore-scripts --no-audit --no-fund && npm run brush:build > /tmp/rebuild-before-brush.log && VITE_COMMIT_SHA=14e2d5eb6db49994c8b724bb0202967031e393cc npm --workspace @illustro/editor exec -- vite build --base=./)
          npm install --prefix /tmp/rebuild-browser playwright@1.56.1 pngjs@7.0.0 jpeg-js@0.4.4 --no-audit --no-fund
          /tmp/rebuild-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Matched last-published PR40/current, 4000px, six intervals, three widths and two brushes
        run: WORKER_POINTS=40 WORKER_OUTPUT=/tmp/rebuild-response/matrix/report.json node scripts/m10-rebuild-response.mjs
      - name: Twelve consecutive 512px strokes, limited history budget
        run: WORKER_VERSIONS=after WORKER_WIDTHS=512 WORKER_DELAYS=0 WORKER_STROKES=12 WORKER_POINTS=60 WORKER_OUTPUT=/tmp/rebuild-response/sustained/report.json node scripts/m10-rebuild-response.mjs
      - name: Slow CPU and completion throughout one uninterrupted native gesture
        run: WORKER_VERSIONS=after WORKER_WIDTHS=512 WORKER_DELAYS=0 WORKER_CPU_RATE=4 WORKER_GESTURE_STEPS=100 WORKER_EXPECT_COMPLETED=1 WORKER_POINTS=80 WORKER_OUTPUT=/tmp/rebuild-response/slow/report.json node scripts/m10-rebuild-response.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rebuild-response, path: /tmp/rebuild-response/}
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [regression, correctness, response]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: gh-pages, path: site, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/download-artifact@v4
        with: {name: rebuild-editor, path: site/qa/m10-rebuild/app}
      - uses: actions/download-artifact@v4
        with: {name: rebuild-regression, path: site/qa/m10-rebuild/evidence/regression}
      - uses: actions/download-artifact@v4
        with: {name: rebuild-correctness, path: site/qa/m10-rebuild/evidence/correctness}
      - uses: actions/download-artifact@v4
        with: {name: rebuild-response, path: site/qa/m10-rebuild/evidence/response}
      - name: Validate the expected case counts and build review summary
        env: {REBUILD_EVIDENCE: site/qa/m10-rebuild/evidence, EXPECTED_COMMIT_SHA: '${{ github.sha }}'}
        run: node scripts/m10-rebuild-summary.mjs
      - name: Publish only the isolated rebuild QA; preserve PR39 and older QA
        run: |
          sed "s/__COMMIT__/$GITHUB_SHA/g" qa/m10-rebuild/index.html > site/qa/m10-rebuild/index.html
          cd site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/m10-rebuild
          test -z "$(git diff --cached --name-only | sed '/^qa\/m10-rebuild\//d')"
          git diff --cached --quiet || git commit -m "qa: isolated M10 presentation rebuild $GITHUB_SHA"
          git push origin HEAD:gh-pages
