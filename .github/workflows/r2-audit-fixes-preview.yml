name: Publish isolated R2 audit fixes preview
on:
  push:
    branches:
      - fix/r2-audit-round1-2026-11-23
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'prototypes/brush-rt/**'
      - 'scripts/prepare-r2-audit-fix-preview.mjs'
      - 'scripts/r2-audit-fixes-browser-smoke.mjs'
      - 'scripts/r2-audit-fixes-fill-browser-smoke.mjs'
      - 'scripts/prepare-r2-preview.mjs'
      - '.github/workflows/r2-audit-fixes-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: illustro-r2-audit-fixes-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run brush:build
      - name: Isolate Round 1 fixes from R2 and main storage
        run: node scripts/prepare-r2-audit-fix-preview.mjs
      - name: Typecheck and compile independent app
        run: |
          npm --workspace @illustro/editor exec -- tsc --noEmit
          VITE_COMMIT_SHA="$GITHUB_SHA" npm --workspace @illustro/editor exec -- vite build --base=/illustro/r2-audit-fixes/
          test -f apps/editor/dist/index.html
          grep -q '/illustro/r2-audit-fixes/assets/' apps/editor/dist/index.html
          grep -q 'illustro-r2-audit-fixes-' apps/editor/dist/sw.js
          printf '{"sourceCommit":"%s","branch":"fix/r2-audit-round1-2026-11-23","isolatedStorage":true,"isolation":"localStorage/sessionStorage/IndexedDB/OPFS/Cache/SW"}\n' "$GITHUB_SHA" > apps/editor/dist/release.json
      - uses: actions/upload-artifact@v4
        with:
          name: illustro-r2-audit-fixes-preview
          path: apps/editor/dist/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out site without touching existing folders
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 0
      - run: |
          rm -rf site/r2-audit-fixes
          mkdir -p site/r2-audit-fixes
      - uses: actions/download-artifact@v4
        with:
          name: illustro-r2-audit-fixes-preview
          path: site/r2-audit-fixes
      - name: Commit only new isolated directory
        shell: bash
        run: |
          set -euo pipefail
          test -f site/r2-audit-fixes/index.html
          test -f site/r2-audit-fixes/release.json
          git -C site config user.name 'github-actions[bot]'
          git -C site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C site add --all r2-audit-fixes
          unexpected="$(git -C site diff --cached --name-only | grep -Ev '^r2-audit-fixes/' || true)"
          test -z "$unexpected"
          if git -C site diff --cached --quiet; then exit 0; fi
          git -C site commit -m "preview: isolated R2 audit fixes $GITHUB_SHA"
          git -C site pull --rebase origin gh-pages
          git -C site push origin HEAD:gh-pages
      - name: Verify actual served commit
        shell: bash
        run: |
          set -euo pipefail
          URL=https://totoro0419.github.io/illustro/r2-audit-fixes/
          for attempt in $(seq 1 24); do
            if curl --fail --location --silent "$URL/release.json" -o /tmp/audit-fix-release.json &&
              grep -q "$GITHUB_SHA" /tmp/audit-fix-release.json &&
              curl --fail --location --silent "$URL" -o /tmp/audit-fix-index.html &&
              grep -q 'r2-audit-fixes/assets/' /tmp/audit-fix-index.html; then
              echo "Verified isolated preview at $URL commit $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "Fix preview content did not match source commit"; exit 1

  browser-smoke:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Use Ubuntu runner's preinstalled Google Chrome
        run: |
          npm install --prefix /tmp/r2-audit-browser playwright@1.62.1 pngjs@7.0.0 --no-audit --no-fund
          command -v google-chrome
      - name: Actually operate public fixes preview in Chromium
        env:
          R2_CHROME_CHANNEL: chrome
          RT_PLAYWRIGHT_PATH: /tmp/r2-audit-browser/node_modules/playwright
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          R2_AUDIT_FIX_URL: https://totoro0419.github.io/illustro/r2-audit-fixes/
        run: node scripts/r2-audit-fixes-browser-smoke.mjs
      - name: Paint three closed regions and test Undo/Redo on public app
        env:
          R2_CHROME_CHANNEL: chrome
          RT_PLAYWRIGHT_PATH: /tmp/r2-audit-browser/node_modules/playwright
          PREP_PNG_PATH: /tmp/r2-audit-browser/node_modules/pngjs
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          R2_AUDIT_FIX_URL: https://totoro0419.github.io/illustro/r2-audit-fixes/
        run: node scripts/r2-audit-fixes-fill-browser-smoke.mjs
