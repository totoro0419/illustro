name: Verify deployed Illustro PR 105 with Chromium

on:
  push:
    branches: ['qa/verify-published-pr105-20261121']

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser automation only (no application changes)
        run: |
          npm install --prefix /tmp/illustro-smoke --no-save --no-package-lock --no-audit --no-fund playwright pngjs
          which google-chrome
          google-chrome --version
      - name: Exercise the deployed URL in Chromium
        run: node qa/browser-smoke-pr105.cjs
      - name: Upload failure screenshot for diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: illustro-live-smoke-failure
          path: smoke-failure.png
          if-no-files-found: ignore
