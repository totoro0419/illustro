name: Temporary synchronize generated brush artifact
on:
  push:
    branches: ['fix/undo-repeat-2026-10-17']
    paths: ['.github/workflows/refresh-undo-overlay-artifact.yml']
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild exact generated HTML and update its locked hash
        run: |
          npm run brush:build
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const path='prototypes/brush-rt/dist/illustro-brush-rt.html',lockPath='docs/production-prep/source-lock.json';
          const hash=createHash('sha256').update(fs.readFileSync(path)).digest('hex');
          const old=fs.readFileSync(lockPath,'utf8'),json=JSON.parse(old),artifact=json.artifacts.find(a=>a.path===path);
          if(!artifact||old.split('"'+artifact.sha256+'"').length!==2)throw Error('Missing unique frozen artifact hash');
          fs.writeFileSync(lockPath,old.replace('"'+artifact.sha256+'"','"'+hash+'"'));
          console.log('Generated HTML SHA-256:',hash);
          JS
          npm run prep:check
          node --test packages/brush-rt/test/stroke-overlay.test.mjs packages/brush-rt/test/history-navigation.test.mjs packages/brush-rt/test/presentation.test.mjs
          npm --workspace @illustro/editor exec -- tsc --noEmit
      - name: Commit generated artifact only if source still matches
        run: |
          test "$(git rev-parse HEAD)" = "87e60778383f60839728b6180a35e2ed3d894bce"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prototypes/brush-rt/dist/illustro-brush-rt.html docs/production-prep/source-lock.json
          if git diff --cached --quiet; then echo 'No generated changes'; exit 0; fi
          git commit -m "build: synchronize canvas ghost fix into locked brush artifact"
          git push origin HEAD:fix/undo-repeat-2026-10-17
