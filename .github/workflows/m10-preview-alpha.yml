name: M10 preview transparency regression
on:
  push:
    branches: ['fix/M10-preview-black-rectangle-2026-10-24']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      RT_PLAYWRIGHT_PATH: /tmp/m10-preview-test/node_modules/playwright
      RT_PNG_PATH: /tmp/m10-preview-test/node_modules/pngjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Core and brush build, original editor regressions
        run: |
          npm run brush:build
          npm run prep:check
          npm run core:check
          npm run brush:regression
          npm --workspace @illustro/editor exec -- vitest run
          npm --workspace @illustro/editor exec -- tsc --noEmit
          VITE_COMMIT_SHA="$GITHUB_SHA" npm --workspace @illustro/editor exec -- vite build --base=./
      - name: Install Chromium
        run: |
          npm install --prefix /tmp/m10-preview-test playwright@1.56.1 pngjs@7.0.0 --no-audit --no-fund
          /tmp/m10-preview-test/node_modules/.bin/playwright install --with-deps chromium
      - name: Test black rectangles before formal stroke completion on both GPUs
        run: PREVIEW_ALPHA_EVIDENCE=/tmp/m10-preview-evidence/report.json node scripts/m10-preview-alpha-regression.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m10-preview-alpha-evidence
          path: /tmp/m10-preview-evidence/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: m10-preview-alpha-app
          path: apps/editor/dist/
