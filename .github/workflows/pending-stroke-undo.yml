name: Verify and publish pending-stroke Undo
on:
  push:
    branches: ['fix/pending-stroke-undo-2026-10-18']
    paths: ['apps/**', 'packages/**', 'prototypes/**', 'scripts/tile-history-*.mjs', 'scripts/pending-stroke-undo-review.mjs', 'scripts/stroke-handoff-operations.mjs', '.github/workflows/pending-stroke-undo.yml', 'docs/production-prep/source-lock.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pending-stroke-undo-preview
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      RT_PLAYWRIGHT_PATH: /tmp/history-browser/node_modules/playwright
      HISTORY_OUTPUT: /tmp/tile-history/settled/report.json
      PENDING_OUTPUT: /tmp/tile-history/report.json
      PENDING_BEFORE: /tmp/pending-before
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check history ownership, errors and all existing unit regressions
        run: |
          npm run brush:build > /tmp/history-brush-build.log
          npm run prep:check
          npm run core:check
          npm run brush:regression
          npm --workspace @illustro/editor exec -- vitest run
          npm --workspace @illustro/editor exec -- tsc --noEmit
      - name: Build exact current and immutable PR34 applications
        env: {VITE_COMMIT_SHA: '${{ github.sha }}'}
        run: |
          npm --workspace @illustro/editor exec -- vite build --base=./
          git worktree add --detach /tmp/history-base 24993dff35835ec4bd6da12763b0fa328e20b5ca
          cd /tmp/history-base
          npm ci --ignore-scripts --no-audit --no-fund
          npm run brush:build > /tmp/history-base-build.log
          VITE_COMMIT_SHA=24993dff35835ec4bd6da12763b0fa328e20b5ca npm --workspace @illustro/editor exec -- vite build --base=./
          cp -a apps/editor/dist /tmp/illustro-history-before
      - name: Build immutable PR35 comparison application
        run: |
          git worktree add --detach /tmp/pending-base bcbf255eefe2a21d83f6342893b97a1d4bf874fd
          cd /tmp/pending-base
          npm ci --ignore-scripts --no-audit --no-fund
          npm run brush:build > /tmp/pending-base-build.log
          VITE_COMMIT_SHA=bcbf255eefe2a21d83f6342893b97a1d4bf874fd npm --workspace @illustro/editor exec -- vite build --base=./
          cp -a apps/editor/dist /tmp/pending-before
      - name: Install verification browser
        run: |
          npm install --prefix /tmp/history-browser playwright@1.62.1 --no-audit --no-fund
          /tmp/history-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Precompletion gates, immediate touch Undo and exact Redo on both GPUs
        run: node scripts/pending-stroke-undo-review.mjs
      - name: Repeated completed-stroke PR35 controls
        run: PENDING_STAGES=complete PENDING_REPEATS=3 PENDING_OUTPUT=/tmp/tile-history/completed-control/report.json node scripts/pending-stroke-undo-review.mjs
      - name: Matched 512, 2000 and 4000px tests on WebGL2 and WebGPU
        run: node scripts/tile-history-review.mjs
      - name: Normal 32MiB capacity and trusted resident history controls
        run: |
          HISTORY_SIZES=4000 HISTORY_GPU_MIB=32 HISTORY_OUTPUT=/tmp/tile-history-capacity/normal/report.json node scripts/tile-history-review.mjs
          HISTORY_RESIDENT_OUTPUT=/tmp/tile-history-capacity/resident/report.json node scripts/tile-history-resident.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: pending-undo-normal-capacity, path: /tmp/tile-history-capacity/}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: pending-undo-comparison, path: /tmp/tile-history/}
      - uses: actions/upload-artifact@v4
        with: {name: pending-undo-application, path: apps/editor/dist/}
      - uses: actions/upload-artifact@v4
        with: {name: pending-undo-baseline, path: /tmp/pending-before/}
  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      RT_PLAYWRIGHT_PATH: /tmp/history-browser/node_modules/playwright
      HANDOFF_OPERATIONS_OUTPUT: /tmp/pending-undo-regression/operations/report.json
      HANDOFF_OPERATIONS_CANVAS: '4000'
      M05_EVIDENCE_DIRECTORY: /tmp/pending-undo-regression/recovery
      M05_EXPECT_MILESTONE: M07
      M08_EVIDENCE_DIRECTORY: /tmp/pending-undo-regression/canvas
      M09_EVIDENCE_DIRECTORY: /tmp/pending-undo-regression/color
      HOME_EVIDENCE_DIRECTORY: /tmp/pending-undo-regression/works
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build exact regression application
        env: {VITE_COMMIT_SHA: '${{ github.sha }}'}
        run: |
          npm run brush:build > /tmp/history-brush-build.log
          npm --workspace @illustro/editor exec -- vite build --base=./
          npm install --prefix /tmp/history-browser playwright@1.62.1 --no-audit --no-fund
          /tmp/history-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Immediate Undo, saved-head ordering and portable reload
        run: node scripts/stroke-handoff-operations.mjs
      - name: Journal protection, crash recovery and offline
        run: node scripts/editor-m05-smoke.mjs
      - name: Canvas navigation and color interactions
        run: |
          node scripts/editor-m08-smoke.mjs
          node scripts/editor-m09-smoke.mjs
      - name: Reopen works and preserve home save safety
        run: node scripts/editor-works-safety-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: pending-undo-regression, path: /tmp/pending-undo-regression/}
  publish:
    needs: [compare, persistence]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      RT_PLAYWRIGHT_PATH: /tmp/history-browser/node_modules/playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: gh-pages, path: site}
      - uses: actions/download-artifact@v4
        with: {name: pending-undo-application, path: site/qa/undo-pending-stroke/after}
      - uses: actions/download-artifact@v4
        with: {name: pending-undo-baseline, path: site/qa/undo-pending-stroke/before}
      - uses: actions/download-artifact@v4
        with: {name: pending-undo-comparison, path: site/qa/undo-pending-stroke/evidence}
      - uses: actions/download-artifact@v4
        with: {name: pending-undo-regression, path: site/qa/undo-pending-stroke/evidence/regression}
      - uses: actions/download-artifact@v4
        with: {name: pending-undo-normal-capacity, path: site/qa/undo-pending-stroke/evidence/normal-capacity}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Require both-backend comparison and publish only the new directory
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync('site/qa/undo-pending-stroke/evidence/report.json'));
          assert.equal(r.sourceCommit,process.env.EXPECTED_COMMIT_SHA);assert.equal(r.cases.length,20);assert.deepEqual(r.errors,[]);
          fs.writeFileSync('site/qa/undo-pending-stroke/evidence/qa-status.json',JSON.stringify({sourceCommit:r.sourceCommit,baselineCommit:r.baselineCommit,workflowRun:process.env.GITHUB_RUN_ID,checks:'Precompletion interruption at 10 scenarios on both backends; exact base/Redo pixels, ordered history, GPU/memory/OPFS, navigation, save and recovery verified in Chromium software GPU',unverified:['Physical Android latency/FPS/temperature','Actual RSS/VRAM','User acceptance']},null,2));
          JS
          cp qa/undo-pending-stroke/index.html site/qa/undo-pending-stroke/
          cd site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/undo-pending-stroke
          test -z "$(git diff --cached --name-only | sed '/^qa\/undo-pending-stroke\//d')"
          git diff --cached --quiet || git commit -m "qa: publish verified pending-stroke Undo $GITHUB_SHA"
          git push origin HEAD:gh-pages
      - name: Wait for the exact isolated public source
        run: |
          for i in $(seq 1 48); do
            curl -fsSL "https://totoro0419.github.io/illustro/qa/undo-pending-stroke/evidence/qa-status.json?source=$GITHUB_SHA" -o /tmp/history-public.json || true
            if node -e "try{process.exit(JSON.parse(require('fs').readFileSync('/tmp/history-public.json')).sourceCommit===process.env.EXPECTED_COMMIT_SHA?0:1)}catch{process.exit(1)}"; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Verify isolated public immediate and partial Undo on both GPUs
        env:
          PENDING_PUBLIC_ORIGIN: https://totoro0419.github.io/illustro/qa/undo-pending-stroke
          PENDING_STAGES: none,partial,inflight,natural
          PENDING_MODES: after
          PENDING_OUTPUT: /tmp/history-public/report.json
        run: |
          npm install --prefix /tmp/history-browser playwright@1.62.1 --no-audit --no-fund
          /tmp/history-browser/node_modules/.bin/playwright install --with-deps chromium
          node scripts/pending-stroke-undo-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: pending-undo-public-verification, path: /tmp/history-public/}
