name: M10 isolated zero-wait experimental QA preview
on:
  push:
    branches: ['qa/M10-zero-wait-preview-2026-10-23']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify runtime and build
        run: |
          npm run brush:build
          npm run brush:regression
          npm --workspace @illustro/editor exec -- vitest run
          npm --workspace @illustro/editor exec -- tsc --noEmit
          VITE_COMMIT_SHA=$GITHUB_SHA npm --workspace @illustro/editor exec -- vite build --base=./
      - uses: actions/checkout@v4
        with: {ref: gh-pages, path: site, fetch-depth: 0}
      - name: Publish experimental build without altering stable sites
        run: |
          mkdir -p site/qa/m10-zero-wait/app
          cp -a apps/editor/dist/. site/qa/m10-zero-wait/app/
          cat > site/qa/m10-zero-wait/index.html <<'HTML'
          <!doctype html><html lang="ja"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Illustro M10 操作独立性 実験版QA</title>
          <style>body{font-family:system-ui,sans-serif;max-width:720px;padding:24px;margin:0 auto;line-height:1.75;background:#f7f9fd;color:#17233b}
          a{display:inline-block;padding:10px 15px;margin:5px;border-radius:10px;background:#263f81;color:#fff;text-decoration:none}
          section{background:#fff;padding:18px;border-radius:14px;border:1px solid #dce3ed}
          small{color:#4a5871}</style></head><body>
          <h1>Illustro キャンバス操作の実験版</h1>
          <section><strong>⚠️ この版は未合格の実験用です。</strong>
          <p>正式描画中でも移動・拡大・回転・連続描画できるかを確認するためのページです。本番版・PR #44とは別に公開しています。</p>
          <p><a href="./app/">実験版アプリを開く</a><a href="./app/?m09=1&perf=1&backend=webgl2">WebGL2で検査</a><a href="./app/?m09=1&perf=1&backend=webgpu">WebGPUで検査</a></p>
          <small>解像度4000×4000、Gペン・鉛筆512pxで、線の直後や正式確定前に2本指操作、連続描画、Undo、保存を確認してください。ブラウザーの自動検査だけで実機合格にはなりません。</small>
          </section></body></html>
          HTML
          cd site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/m10-zero-wait
          test -z "$(git diff --cached --name-only | sed '/^qa\/m10-zero-wait\//d')"
          git diff --cached --quiet || git commit -m "qa: publish independent M10 zero-wait experiment ${GITHUB_SHA}"
          git push origin HEAD:gh-pages
