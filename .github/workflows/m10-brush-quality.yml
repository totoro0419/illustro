name: M10 Brush Quality (partial implementation)
on:
  push:
    branches: ['milestone/M10-brush-quality']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: m10-brush-quality
  cancel-in-progress: true
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build frozen Brush artifact and check canonical/source-lock
        run: |
          npm run brush:build
          npm run prep:check
      - name: Core and Brush regression
        run: |
          npm run core:check
          npm run brush:regression
      - name: M10 and older editor tests and TypeScript
        run: |
          npm --workspace @illustro/editor exec -- vitest run
          npm --workspace @illustro/editor exec -- tsc --noEmit
      - name: Build production editor for QA
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
        run: |
          npm --workspace @illustro/editor exec -- vite build --base=./
          test -f apps/editor/dist/index.html
          test -f apps/editor/dist/sw.js
      - name: Chromium and software WebGL2/WebGPU checks
        run: |
          npm install --prefix /tmp/m10-browser playwright@1.62.1 --no-audit --no-fund
          /tmp/m10-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: M10 brush management, stroke/Undo and save-reload review
        env:
          RT_PLAYWRIGHT_PATH: /tmp/m10-browser/node_modules/playwright
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          M10_EVIDENCE: /tmp/m10-evidence/brush.json
        run: node scripts/m10-brush-review.mjs
      - name: WebGL2/WebGPU M08 presentation regression
        env:
          RT_PLAYWRIGHT_PATH: /tmp/m10-browser/node_modules/playwright
          M08_EVIDENCE_DIRECTORY: /tmp/m10-evidence/m08
          M08_SMOKE_QUICK: '1'
          M08_PERF_REVIEW: '1'
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/editor-m08-smoke.mjs
      - name: M09 Color picker and palette regression
        env:
          RT_PLAYWRIGHT_PATH: /tmp/m10-browser/node_modules/playwright
          M09_EVIDENCE_DIRECTORY: /tmp/m10-evidence/m09
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/editor-m09-smoke.mjs
      - name: M05 save/recovery regression
        env:
          RT_PLAYWRIGHT_PATH: /tmp/m10-browser/node_modules/playwright
          M05_EVIDENCE_DIRECTORY: /tmp/m10-evidence/m05
          M05_EXPECT_MILESTONE: M07
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/editor-m05-smoke.mjs
      - name: My Works open/recovery regression
        env:
          RT_PLAYWRIGHT_PATH: /tmp/m10-browser/node_modules/playwright
          MY_WORKS_EVIDENCE: /tmp/m10-evidence/my-works.json
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/my-works-open-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m10-evidence
          path: /tmp/m10-evidence
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: m10-verified-editor
          path: apps/editor/dist/
  preview-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      RT_PLAYWRIGHT_PATH: /tmp/m10-preview-browser/node_modules/playwright
      M10_BEFORE_ROOT: /tmp/m10-baseline/dist
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build current and immutable M10 baseline from the same source graph
        run: |
          npm run brush:build > /tmp/m10-current-build.log
          npm run prep:check
          git worktree add --detach /tmp/m10-baseline-source 4708ffe5136ad1fa47be5909c129bb5f8fcb7869
          cd /tmp/m10-baseline-source
          node prototypes/brush-rt/build.mjs > /tmp/m10-baseline-build.log
          mkdir -p /tmp/m10-baseline
          cp -a packages/brush-rt/dist /tmp/m10-baseline/dist
      - name: Matched CPU work, slices and memory comparison
        run: |
          mkdir -p /tmp/m10-preview-evidence
          M10_CPU_ROOT=/tmp/m10-baseline/dist M10_CPU_SOURCE_SHA=4708ffe5136ad1fa47be5909c129bb5f8fcb7869 M10_CPU_OUTPUT=/tmp/m10-preview-evidence/cpu-before.json node scripts/m10-preview-cpu-benchmark.mjs
          M10_CPU_OUTPUT=/tmp/m10-preview-evidence/cpu-after.json node scripts/m10-preview-cpu-benchmark.mjs
      - name: Install matched Chromium and image decoder
        run: |
          npm install --prefix /tmp/m10-preview-browser playwright@1.56.1 pngjs@7.0.0 --no-audit --no-fund
          /tmp/m10-preview-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: All sizes, zooms, seven brushes and four routes on both GPU backends
        env:
          M10_STROKES: '1'
          M10_POINTS: '5'
          M10_PREVIEW_OUTPUT: /tmp/m10-preview-evidence/report.json
        run: node scripts/m10-preview-review.mjs
      - name: Sustained 4000px, twelve strokes with all seven brushes on both backends
        env:
          M10_SIZES: '4000'
          M10_ZOOMS: '1,64'
          M10_MODES: 'B,C,D'
          M10_STROKES: '12'
          M10_POINTS: '17'
          M10_PREVIEW_OUTPUT: /tmp/m10-preview-evidence/sustained/report.json
        run: node scripts/m10-preview-review.mjs
      - name: Selection follows actual CPU work and GPU queue delay
        env:
          M10_SIZES: '512x384'
          M10_ZOOMS: '1'
          M10_MODES: 'D'
          M10_BRUSHES: 'thin'
          M10_BACKENDS: 'webgl2'
          M10_STROKES: '12'
          M10_POINTS: '9'
        run: |
          M10_CPU_EXTRA_WORK_MS=30 M10_EXPECT_LAST_ROUTE=gpu M10_PREVIEW_OUTPUT=/tmp/m10-preview-evidence/adapt-gpu/report.json node scripts/m10-preview-review.mjs
          M10_GPU_EXTRA_QUEUE_MS=50 M10_EXPECT_LAST_ROUTE=cpu M10_PREVIEW_OUTPUT=/tmp/m10-preview-evidence/adapt-cpu/report.json node scripts/m10-preview-review.mjs
      - name: Unavailable CPU and destroyed GPU preserve complete semantic records
        env:
          M10_AVAILABILITY_OUTPUT: /tmp/m10-preview-evidence/availability/report.json
        run: node scripts/m10-preview-availability.mjs
      - name: Baseline and current live-final compositor images
        env:
          OVERLAY_BEFORE_ROOT: /tmp/m10-baseline/dist
          OVERLAY_BEFORE_STROKE_ONLY: '1'
          OVERLAY_BASELINE_SHA: '4708ffe5136ad1fa47be5909c129bb5f8fcb7869'
          OVERLAY_MODES: 'A,B,C'
          OVERLAY_BRUSHES: 'thin,broad,pencil,marker,soft,erase,lower,fade'
        run: |
          OVERLAY_SIZES=512,2000,3000,4000 OVERLAY_QUALITY_OUTPUT=/tmp/m10-preview-evidence/quality-fit/report.json node scripts/stroke-overlay-quality.mjs
          OVERLAY_ZOOM=64 OVERLAY_DOCUMENT_SIZE=1 OVERLAY_BRUSHES=thin,pencil OVERLAY_QUALITY_OUTPUT=/tmp/m10-preview-evidence/quality-zoom/report.json node scripts/stroke-overlay-quality.mjs
          OVERLAY_ZOOM=16 OVERLAY_ANGLE=0.4 OVERLAY_FLIP_X=-1 OVERLAY_FLIP_Y=-1 OVERLAY_NEAREST=1 OVERLAY_DOCUMENT_SIZE=1 OVERLAY_BRUSHES=thin,pencil OVERLAY_QUALITY_OUTPUT=/tmp/m10-preview-evidence/quality-rotated/report.json node scripts/stroke-overlay-quality.mjs
      - name: Exact formal records, layer pixels, history and replay on both backends
        env:
          FORMAL_BEFORE_ROOT: /tmp/m10-baseline/dist
          FORMAL_MATCH_CONTEXT: '1'
          OVERLAY_BASELINE_SHA: '4708ffe5136ad1fa47be5909c129bb5f8fcb7869'
          FORMAL_QUALITY_OUTPUT: /tmp/m10-preview-evidence/formal/report.json
        run: node scripts/stroke-overlay-formal.mjs
      - name: Native touch Undo preserves PR37 while record or GPU completion is held
        env:
          IMMEDIATE_MODES: 'after'
          IMMEDIATE_FAST_TAP: '1'
          IMMEDIATE_POINTS: '120'
        run: |
          VITE_COMMIT_SHA=$GITHUB_SHA npm --workspace @illustro/editor exec -- vite build --base=./
          IMMEDIATE_STAGES=record,multiple,presentation IMMEDIATE_OUTPUT=/tmp/m10-preview-evidence/undo-4000/report.json node scripts/immediate-pending-undo-review.mjs
          IMMEDIATE_SIZE=512 IMMEDIATE_STAGES=record,multiple IMMEDIATE_OUTPUT=/tmp/m10-preview-evidence/undo-512/report.json node scripts/immediate-pending-undo-review.mjs
          IMMEDIATE_SIZE=2000 IMMEDIATE_STAGES=record,multiple IMMEDIATE_OUTPUT=/tmp/m10-preview-evidence/undo-2000/report.json node scripts/immediate-pending-undo-review.mjs
          IMMEDIATE_BRUSH=foundation-pencil IMMEDIATE_STAGES=record,multiple IMMEDIATE_OUTPUT=/tmp/m10-preview-evidence/undo-pencil/report.json node scripts/immediate-pending-undo-review.mjs
      - name: Portable save and reopen after interrupted Undo
        env:
          PENDING_MODES: 'after'
          PENDING_SAVE_OUTPUT: /tmp/m10-preview-evidence/interrupted-save/report.json
        run: node scripts/pending-stroke-save-review.mjs
      - name: Validate measured work, first feedback, quality and route decisions
        env:
          M10_PREVIEW_EVIDENCE: /tmp/m10-preview-evidence
          RT_PNG_PATH: /tmp/m10-preview-browser/node_modules/pngjs
        run: node scripts/m10-preview-validation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m10-preview-evidence
          path: /tmp/m10-preview-evidence/
  navigation-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      RT_PLAYWRIGHT_PATH: /tmp/m10-navigation-browser/node_modules/playwright
      RT_PNG_PATH: /tmp/m10-navigation-browser/node_modules/pngjs
      NAV_BEFORE_ROOT: /tmp/m10-navigation-source/apps/editor/dist
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build current and immutable post-preview M10 editor
        run: |
          npm run brush:build > /tmp/navigation-build.log
          VITE_COMMIT_SHA=$GITHUB_SHA npm --workspace @illustro/editor exec -- vite build --base=./
          git worktree add --detach /tmp/m10-navigation-source 4617cdaef94a135752c0fa122741f11c2d7aff55
          cd /tmp/m10-navigation-source
          npm ci --ignore-scripts --no-audit --no-fund
          npm run brush:build > /tmp/navigation-before-build.log
          VITE_COMMIT_SHA=4617cdaef94a135752c0fa122741f11c2d7aff55 npm --workspace @illustro/editor exec -- vite build --base=./
      - name: Install matched Chromium and image decoder
        run: |
          npm install --prefix /tmp/m10-navigation-browser playwright@1.56.1 pngjs@7.0.0 --no-audit --no-fund
          /tmp/m10-navigation-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Actual gestures with held canonical, formal and GPU view acknowledgements
        env:
          NAV_OUTPUT: /tmp/m10-navigation-evidence/controlled/report.json
        run: node scripts/m10-navigation-review.mjs
      - name: CPU preview work and transition capture cannot gate navigation
        env:
          NAV_ROUTES: cpu,auto
          NAV_STAGES: cpu-work
          NAV_OUTPUT: /tmp/m10-navigation-evidence/tasks/report.json
        run: node scripts/m10-navigation-review.mjs
      - name: A visible CPU image and delayed transition capture
        env:
          NAV_ROUTES: cpu
          NAV_STAGES: snapshot
          NAV_OUTPUT: /tmp/m10-navigation-evidence/capture/report.json
        run: node scripts/m10-navigation-review.mjs
      - name: Three sizes, all five zooms and four brushes through actual gestures
        env:
          NAV_ROUTES: auto
          NAV_STAGES: normal
          NAV_SIZES: '512,2000,4000'
          NAV_ZOOMS: fit,1,4,16,64
          NAV_BRUSHES: gpen,pencil,broad,eraser
          NAV_POINTS: '6'
          NAV_OUTPUT: /tmp/m10-navigation-evidence/matrix/report.json
        run: node scripts/m10-navigation-review.mjs
      - name: All seven post-release intervals and all routes
        env:
          NAV_STAGES: normal
          NAV_ZOOMS: '64'
          NAV_DELAYS: '0,16,50,100,250,500,1000'
          NAV_POINTS: '6'
          NAV_OUTPUT: /tmp/m10-navigation-evidence/intervals/report.json
        run: node scripts/m10-navigation-review.mjs
      - name: Space drag, wheel and tablet-size touch with 4x CPU slowdown
        env:
          NAV_VERSIONS: after
          NAV_STAGES: record,inflight
          NAV_ROUTES: auto
          NAV_INPUTS: space,wheel,touch
          NAV_WIDTH: '1024'
          NAV_CPU_RATE: '4'
          NAV_OUTPUT: /tmp/m10-navigation-evidence/inputs/report.json
        run: node scripts/m10-navigation-review.mjs
      - name: Long and twelve-stroke queues followed immediately by navigation
        env:
          NAV_STAGES: normal
          NAV_ROUTES: auto
          NAV_POINTS: '80'
          NAV_STROKES: '12'
          NAV_OUTPUT: /tmp/m10-navigation-evidence/sustained/report.json
        run: node scripts/m10-navigation-review.mjs
      - name: Existing ink transforms in screenshots before the gate opens
        env:
          NAV_VERSIONS: after
          NAV_STAGES: record,view-ack
          NAV_ROUTES: cpu,gpu
          NAV_VISUAL: '1'
          NAV_OUTPUT: /tmp/m10-navigation-evidence/visual/report.json
        run: node scripts/m10-navigation-review.mjs
      - name: Navigation then next stroke, native Undo/Redo and portable save/reopen
        env:
          NAV_VERSIONS: after
          NAV_STAGES: record,inflight
          NAV_ROUTES: auto
          NAV_SEQUENCE: '1'
          NAV_HISTORY_DELAY_MS: '100'
          NAV_OUTPUT: /tmp/m10-navigation-evidence/sequence/report.json
        run: node scripts/m10-navigation-review.mjs
      - name: Navigation while pending canonical/formal work is being saved
        env:
          NAV_VERSIONS: after
          NAV_STAGES: record,inflight
          NAV_ROUTES: auto
          NAV_SAVE_PENDING: '1'
          NAV_OUTPUT: /tmp/m10-navigation-evidence/pending-save/report.json
        run: node scripts/m10-navigation-review.mjs
      - name: Next stroke admission while the previous formal acknowledgement is held
        env:
          NAV_VERSIONS: after
          NAV_STAGES: inflight
          NAV_ROUTES: auto
          NAV_NEXT_PENDING: '1'
          NAV_OUTPUT: /tmp/m10-navigation-evidence/next-pending/report.json
        run: node scripts/m10-navigation-review.mjs
      - name: Viewport resize during pending save retains visible pixels and navigation
        env:
          NAV_VERSIONS: after
          NAV_STAGES: inflight
          NAV_ROUTES: auto
          NAV_SAVE_PENDING: '1'
          NAV_RESIZE_PENDING: '1'
          NAV_VISUAL: '1'
          NAV_OUTPUT: /tmp/m10-navigation-evidence/resize-pending/report.json
        run: node scripts/m10-navigation-review.mjs
      - name: Validate navigation response and censored baseline waits
        env:
          NAV_EVIDENCE: /tmp/m10-navigation-evidence
        run: node scripts/m10-navigation-validation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m10-navigation-evidence
          path: /tmp/m10-navigation-evidence/
  publish-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [verification, preview-verification, navigation-verification]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: gh-pages, path: site, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: m10-verified-editor, path: site/qa/m10/app}
      - uses: actions/download-artifact@v4
        with: {name: m10-evidence, path: site/qa/m10/evidence}
      - uses: actions/download-artifact@v4
        with: {name: m10-preview-evidence, path: site/qa/m10/evidence/preview}
      - uses: actions/download-artifact@v4
        with: {name: m10-navigation-evidence, path: site/qa/m10/evidence/navigation}
      - name: Preserve prior milestones and publish only M10
        run: |
          cp qa/m10/index.html site/qa/m10/index.html
          touch site/.nojekyll
          cd site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for m in 01 02 03 04 05 06 07 08 09; do test -f "qa/m$m/index.html"; done
          git add qa/m10
          test -z "$(git diff --cached --name-only | sed '/^qa\/m10\//d')"
          git diff --cached --quiet || git commit -m "qa: publish M10 brush review $GITHUB_SHA"
          git push origin HEAD:gh-pages
      - name: Public deployment HTTP smoke
        run: |
          for i in $(seq 1 20); do
            status=$(curl -L -sS -o /tmp/m10-public.html -w '%{http_code}' "https://totoro0419.github.io/illustro/qa/m10/?source=$GITHUB_SHA" || true)
            app=$(curl -L -sS -o /tmp/m10-app.html -w '%{http_code}' "https://totoro0419.github.io/illustro/qa/m10/app/?source=$GITHUB_SHA" || true)
            if [ "$status" = 200 ] && [ "$app" = 200 ] && grep -q 'ブラシの描き心地' /tmp/m10-public.html; then break; fi
            sleep 6
          done
          test "$status" = 200
          test "$app" = 200
          for m in 01 02 03 04 05 06 07 08 09; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' "https://totoro0419.github.io/illustro/qa/m$m/")
            test "$code" = 200
          done
