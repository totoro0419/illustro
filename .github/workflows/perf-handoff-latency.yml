name: Stroke transition latency
on:
  push:
    branches: ['perf/stroke-handoff-latency-2026-10-17']
    # QA/docs-only changes reuse immutable evidence and run the QA publication
    # browser checks. Dispatch this workflow for test/config-only changes.
    paths: ['apps/**', 'packages/**', 'prototypes/**', 'scripts/handoff-latency-benchmark.mjs', 'scripts/handoff-latency-visibility.mjs', 'scripts/stroke-overlay-quality.mjs', 'scripts/stroke-overlay-formal.mjs']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: handoff-latency-${{ github.ref }}
  cancel-in-progress: true
jobs:
  transition:
    strategy:
      fail-fast: false
      matrix:
        backend: [webgl2, webgpu]
        brush: [thin, broad, pencil, eraser]
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run brush:build > /tmp/brush-build.log
          VITE_COMMIT_SHA=${{ github.sha }} npm --workspace @illustro/editor exec -- vite build --base=./
          git worktree add --detach /tmp/latency-before 1828947625dea1a16ec7532fd5275c4e0ccaec53
          cd /tmp/latency-before
          npm ci --ignore-scripts --no-audit --no-fund
          npm run brush:build > /tmp/before-build.log
          VITE_COMMIT_SHA=1828947625dea1a16ec7532fd5275c4e0ccaec53 npm --workspace @illustro/editor exec -- vite build --base=./
      - run: |
          npm install --prefix /tmp/latency-browser playwright@1.62.1 --no-audit --no-fund
          /tmp/latency-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Measure immutable PR31 immediate transitions
        env:
          RT_PLAYWRIGHT_PATH: /tmp/latency-browser/node_modules/playwright
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          LATENCY_BACKENDS: ${{ matrix.backend }}
          LATENCY_BRUSHES: ${{ matrix.brush }}
          LATENCY_VIEWS: fit,100
          LATENCY_FADE: off,on
          LATENCY_SCENARIOS: short-next,long-next,long-wait,long-drained,long-chain
          LATENCY_ROUNDS: 3
          LATENCY_MODES: A,C
        run: node scripts/handoff-latency-benchmark.mjs
      - uses: actions/upload-artifact@v4
        if: matrix.backend == 'webgl2' && matrix.brush == 'thin'
        with: {name: latency-before-app, path: /tmp/latency-before/apps/editor/dist/}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'handoff-latency-${{ matrix.backend }}-${{ matrix.brush }}', path: /tmp/handoff-latency/}
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Canonical preservation, discovered tests and editor build
        run: |
          git diff --exit-code 1828947625dea1a16ec7532fd5275c4e0ccaec53 -- apps/editor/src/color packages/brush-rt/src/foundation.mjs packages/brush-rt/src/model.mjs packages/brush-rt/src/shaders.mjs packages/brush-rt/src/canonical.worker.mjs packages/core
          npm run prep:check
          npm run core:check
          npm run brush:build > /tmp/brush-build.log
          git diff --exit-code -- prototypes/brush-rt/dist/illustro-brush-rt.html
          npx vitest run apps/editor/src
          node --test packages/brush-rt/test/*.test.mjs > /tmp/brush-tests.log
          node scripts/check-test-summary.mjs /tmp/brush-tests.log
          npm --workspace @illustro/editor exec -- tsc --noEmit
          VITE_COMMIT_SHA=${{ github.sha }} npm --workspace @illustro/editor exec -- vite build --base=./
      - run: |
          npm install --prefix /tmp/overlay-browser playwright@1.62.1 --no-audit --no-fund
          /tmp/overlay-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Brushes, views, history, save, Recovery, export, color and home
        env:
          RT_PLAYWRIGHT_PATH: /tmp/overlay-browser/node_modules/playwright
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          M08_PERF_REVIEW: '1'
          M05_EXPECT_MILESTONE: M07
          M06_EXPECT_MILESTONE: M07
          M08_CORRUPT_ALL_RENDER_CACHES: '1'
          MOBILE_HOME: '1'
          MOBILE_INPUT_OUTPUT: /tmp/latency-regression/mobile/report.json
          LATENCY_VISIBILITY_OUTPUT: /tmp/latency-regression/visibility/report.json
          UNDO_QUALITY_CANVAS_SIZE: '4000'
          UNDO_QUALITY_OUTPUT: /tmp/latency-regression/navigation/report.json
        run: |
          node scripts/handoff-latency-visibility.mjs
          node scripts/stroke-handoff-operations.mjs
          node scripts/editor-m09-smoke.mjs
          node scripts/editor-orbit-smoke.mjs
          node scripts/editor-color-hit-smoke.mjs
          node scripts/editor-gesture-cancel-smoke.mjs
          node scripts/editor-m05-smoke.mjs
          node scripts/editor-m06-smoke.mjs
          node scripts/editor-m08-smoke.mjs
          node scripts/editor-home-smoke.mjs
          node scripts/editor-works-smoke.mjs
          node scripts/editor-works-safety-smoke.mjs
          node scripts/mobile-input-smoke.mjs
          node scripts/undo-navigation-quality.mjs
      - uses: actions/upload-artifact@v4
        with: {name: latency-app, path: apps/editor/dist/}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latency-regression
          path: |
            /tmp/latency-regression/
            /tmp/*-evidence/
            /tmp/illustro-m05/
            /tmp/brush-tests.log
  quality:
    strategy:
      fail-fast: false
      matrix:
        backend: [webgl2, webgpu]
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          npm run brush:build > /tmp/brush-build.log
          git worktree add --detach /tmp/latency-before 1828947625dea1a16ec7532fd5275c4e0ccaec53
          cd /tmp/latency-before
          npm ci --ignore-scripts --no-audit --no-fund
          npm run brush:build > /tmp/latency-before-build.log
          VITE_COMMIT_SHA=1828947625dea1a16ec7532fd5275c4e0ccaec53 npm --workspace @illustro/editor exec -- vite build --base=./
      - uses: actions/upload-artifact@v4
        if: matrix.backend == 'webgl2'
        with: {name: latency-before-quality-app, path: /tmp/latency-before/apps/editor/dist/}
      - run: |
          npm install --prefix /tmp/overlay-browser playwright@1.62.1 --no-audit --no-fund
          /tmp/overlay-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Exact strict pixels and fit-view visual comparison
        env:
          RT_PLAYWRIGHT_PATH: /tmp/overlay-browser/node_modules/playwright
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          FORMAL_BEFORE_ROOT: /tmp/latency-before/packages/brush-rt/dist
          FORMAL_QUALITY_OUTPUT: /tmp/latency-quality/formal/report.json
          OVERLAY_BEFORE_ROOT: /tmp/latency-before/packages/brush-rt/dist
          OVERLAY_QUALITY_OUTPUT: /tmp/latency-quality/report.json
          OVERLAY_BEFORE_STROKE_ONLY: '1'
          OVERLAY_BASELINE_SHA: 1828947625dea1a16ec7532fd5275c4e0ccaec53
          OVERLAY_BACKENDS: ${{ matrix.backend }}
          OVERLAY_SIZES: '2000,4000,8000'
          OVERLAY_LAYOUTS: 'phone,tablet'
          OVERLAY_MODES: 'A,C'
          OVERLAY_BRUSHES: 'thin,broad,pencil,erase,lower,fade,fine,marker,technical,soft'
        run: |
          node scripts/stroke-overlay-formal.mjs
          node scripts/stroke-overlay-quality.mjs
      - name: Existing strict pressure and presentation cache quality
        env:
          RT_PLAYWRIGHT_PATH: /tmp/overlay-browser/node_modules/playwright
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          HANDOFF_QUALITY_OUTPUT: /tmp/latency-quality/strict/report.json
          VIEWPORT_QUALITY_OUTPUT: /tmp/latency-quality/viewport/report.json
          PRESSURE_QUALITY_OUTPUT: /tmp/latency-quality/pressure/report.json
        run: |
          node scripts/stroke-handoff-quality.mjs
          node scripts/viewport-cache-quality.mjs
          node scripts/preview-pressure-quality.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'latency-quality-${{ matrix.backend }}', path: /tmp/latency-quality/}
