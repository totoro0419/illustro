name: M10 independent paper - verify and isolated QA
on:
  push:
    branches: ['rebuild/M10-independent-canvas-2026-10-24']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      PAPER_EVIDENCE: /tmp/independent-paper-evidence
      PAPER_BOUNDS: 1
      PAPER_TRACE_EVIDENCE: /tmp/independent-paper-evidence/trace
      RT_JPEG_PATH: /tmp/paper-browser/node_modules/jpeg-js
      RT_PLAYWRIGHT_PATH: /tmp/paper-browser/node_modules/playwright
      RT_PNG_PATH: /tmp/paper-browser/node_modules/pngjs
      PAPER_CHROME: /usr/bin/google-chrome
      CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      HOME_EVIDENCE_DIRECTORY: /tmp/independent-paper-evidence/works
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and preserved-source regression
        run: |
          npm run brush:build > /tmp/brush-build.log
          npm run prep:check
          npm run core:check
          npm run brush:regression
          npm --workspace @illustro/editor exec -- vitest run
          npm --workspace @illustro/editor exec -- tsc --noEmit
      - name: Build exact review app
        env: {VITE_COMMIT_SHA: '${{ github.sha }}'}
        run: npm --workspace @illustro/editor exec -- vite build --base=./
      - name: Browser dependencies
        run: npm install --prefix /tmp/paper-browser playwright@1.56.1 pngjs@7.0.0 jpeg-js@0.4.4 --no-audit --no-fund
      - name: Real formal pixels, touch, history, save/reload, and captured screen motion
        run: node scripts/m10-paper-browser.mjs
      - name: Existing work library, auto-save, recovery, and offline regression
        run: |
          node scripts/editor-works-smoke.mjs
          HOME_EVIDENCE_DIRECTORY=/tmp/independent-paper-evidence/works-safety node scripts/editor-works-safety-smoke.mjs
      - name: Independent compositor trace while real formal drawing advances
        run: node scripts/m10-paper-motion-trace.mjs
      - name: Extended repeated drawing, memory and document lifetimes (10 minutes per backend)
        run: node scripts/m10-paper-soak.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: independent-paper-evidence, path: /tmp/independent-paper-evidence/}
      - uses: actions/upload-artifact@v4
        if: success()
        with: {name: independent-paper-app, path: apps/editor/dist/}
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: gh-pages, path: site, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: independent-paper-app, path: site/qa/m10-independent-canvas/app/}
      - uses: actions/download-artifact@v4
        with: {name: independent-paper-evidence, path: site/qa/m10-independent-canvas/evidence/}
      - name: Publish only the new QA directory
        run: |
          sed "s/__COMMIT__/$GITHUB_SHA/g" qa/m10-independent-canvas/index.html > site/qa/m10-independent-canvas/index.html
          find site/qa/m10-independent-canvas/evidence -name '*-trace.json' -delete
          cd site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/m10-independent-canvas
          test -z "$(git diff --cached --name-only | sed '/^qa\/m10-independent-canvas\//d')"
          git diff --cached --quiet || git commit -m "qa: independent canvas $GITHUB_SHA"
          git push origin HEAD:gh-pages

  public-check:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {contents: write}
    env:
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      PAPER_PUBLIC_URL: https://totoro0419.github.io/illustro/qa/m10-independent-canvas/app/
      HOME_PUBLIC_URL: https://totoro0419.github.io/illustro/qa/m10-independent-canvas/app/
      PUBLIC_PAPER_EVIDENCE: /tmp/public-paper-evidence
      HOME_EVIDENCE_DIRECTORY: /tmp/public-paper-evidence/works
      RT_PLAYWRIGHT_PATH: /tmp/paper-browser/node_modules/playwright
      PAPER_CHROME: /usr/bin/google-chrome
      CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Browser dependencies
        run: npm install --prefix /tmp/paper-browser playwright@1.56.1 --no-audit --no-fund
      - name: Wait for the exact public source
        run: |
          python - <<'PY'
          import os,time,urllib.request
          expected=os.environ['EXPECTED_COMMIT_SHA']
          url='https://totoro0419.github.io/illustro/qa/m10-independent-canvas/?build='+expected
          for attempt in range(60):
              try:
                  with urllib.request.urlopen(url,timeout=15) as response:
                      body=response.read().decode()
                  if expected in body:
                      print('Public source matches',expected)
                      break
              except Exception as error:
                  print(type(error).__name__)
              time.sleep(5)
          else:
              raise RuntimeError('The exact source did not become publicly reachable')
          PY
      - name: Real public canvas, pixels, touch, persistence and work library
        run: |
          node scripts/m10-paper-public.mjs
          node scripts/editor-works-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: independent-paper-public-evidence, path: /tmp/public-paper-evidence/}
      - uses: actions/checkout@v4
        if: success()
        with: {ref: gh-pages, path: site, fetch-depth: 0}
      - name: Publish public verification evidence only
        if: success()
        run: |
          mkdir -p site/qa/m10-independent-canvas/public-evidence
          cp -R /tmp/public-paper-evidence/. site/qa/m10-independent-canvas/public-evidence/
          cd site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/m10-independent-canvas/public-evidence
          test -z "$(git diff --cached --name-only | sed '/^qa\/m10-independent-canvas\/public-evidence\//d')"
          git diff --cached --quiet || git commit -m "qa: public canvas verification $GITHUB_SHA"
          git push origin HEAD:gh-pages
