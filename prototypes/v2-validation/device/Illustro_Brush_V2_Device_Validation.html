<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Illustro Brush V2 実機検証</title>
  <style>
:root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; background: Canvas; color: CanvasText; }
main { min-height: 100dvh; display: grid; grid-template-rows: auto auto minmax(320px, 1fr) auto 180px; gap: 10px; padding: 12px; }
header { display: flex; gap: 16px; align-items: start; justify-content: space-between; }
h1 { margin: 0; font-size: clamp(20px, 4vw, 30px); }
.eyebrow { margin: 0 0 4px; font-size: 11px; letter-spacing: .12em; opacity: .65; }
#status { margin: 0; font: 12px/1.35 ui-monospace, monospace; text-align: right; white-space: pre-wrap; }
.protocol { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 13px; padding: 8px 10px; border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 10px; }
#canvas { width: 100%; height: 100%; min-height: 320px; border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); border-radius: 12px; background: white; touch-action: none; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
button { min-height: 42px; padding: 0 14px; border-radius: 9px; border: 1px solid color-mix(in srgb, CanvasText 22%, transparent); background: ButtonFace; color: ButtonText; font-weight: 650; }
textarea { width: 100%; resize: none; border-radius: 10px; padding: 10px; font: 11px/1.35 ui-monospace, monospace; }
@media (max-width: 720px) { header { display: grid; } #status { text-align: left; } main { grid-template-rows: auto auto minmax(360px, 1fr) auto 150px; } }

</style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">NON-PRODUCTION VALIDATION</p>
        <h1>Brush V2 実機検証</h1>
      </div>
      <pre id="status"></pre>
    </header>
    <section class="protocol">
      <strong>実機プロトコル</strong>
      <span>①速い曲線 → ②ゆっくり筆圧変化 → ③長い連続線。合計3 Stroke / Pen 500 samples以上。</span>
    </section>
    <canvas id="canvas" aria-label="ペン入力検証キャンバス"></canvas>
    <section class="actions">
      <button id="synthetic">100k synthetic</button>
      <button id="save">JSONを保存</button>
      <button id="copy">JSONをコピー</button>
      <button id="reset">リセット</button>
    </section>
    <textarea id="result" spellcheck="false" aria-label="検証結果JSON"></textarea>
  </main>
  
<script type="module">
const BRUSH_PROFILE = Object.freeze({ kind: 'one-euro', minCutoff: 4, beta: 4, dCutoff: 1 });
const PAGE_SAMPLES = 256;
const MUTABLE_TAIL_SAMPLES = 16;
const MAX_PENDING_PAGES = 8;
const SPACING = 1.75;

function alphaForCutoff(cutoff, dt) {
  const tau = 1 / (2 * Math.PI * cutoff);
  return 1 / (1 + tau / dt);
}

class LowPass {
  constructor() { this.ready = false; this.y = 0; }
  next(x, a) {
    if (!this.ready) { this.ready = true; this.y = x; return x; }
    this.y = a * x + (1 - a) * this.y;
    return this.y;
  }
}

class OneEuro1D {
  constructor({ minCutoff, beta, dCutoff }) {
    this.minCutoff = minCutoff;
    this.beta = beta;
    this.dCutoff = dCutoff;
    this.xFilter = new LowPass();
    this.dxFilter = new LowPass();
    this.prevX = null;
  }
  next(x, dt) {
    const dx = this.prevX === null ? 0 : (x - this.prevX) / dt;
    this.prevX = x;
    const edx = this.dxFilter.next(dx, alphaForCutoff(this.dCutoff, dt));
    const cutoff = this.minCutoff + this.beta * Math.abs(edx);
    return this.xFilter.next(x, alphaForCutoff(cutoff, dt));
  }
}

function mulHiLo(a, b) {
  const mask = 0xffffffffn;
  const p = BigInt(a >>> 0) * BigInt(b >>> 0);
  return [Number((p >> 32n) & mask) >>> 0, Number(p & mask) >>> 0];
}

function philox4x32_10(counter, key) {
  const M0 = 0xD2511F53n, M1 = 0xCD9E8D57n;
  const W0 = 0x9E3779B9, W1 = 0xBB67AE85;
  let [x0, x1, x2, x3] = counter.map(v => v >>> 0);
  let [k0, k1] = key.map(v => v >>> 0);
  for (let round = 0; round < 10; round++) {
    const [hi0, lo0] = mulHiLo(Number(M0), x0);
    const [hi1, lo1] = mulHiLo(Number(M1), x2);
    [x0, x1, x2, x3] = [(hi1 ^ x1 ^ k0) >>> 0, lo1, (hi0 ^ x3 ^ k1) >>> 0, lo0];
    if (round !== 9) { k0 = (k0 + W0) >>> 0; k1 = (k1 + W1) >>> 0; }
  }
  return [x0, x1, x2, x3];
}

function uniform01(seedLo, seedHi, index, stream) {
  const lo = Number(BigInt(index) & 0xffffffffn) >>> 0;
  const hi = Number((BigInt(index) >> 32n) & 0xffffffffn) >>> 0;
  return philox4x32_10([lo, hi, stream >>> 0, 0], [seedLo >>> 0, seedHi >>> 0])[0] / 0x100000000;
}

class StreamingBrushPipeline {
  constructor({ profile = BRUSH_PROFILE, spacing = SPACING, seedLo = 0x12345678, seedHi = 0x9abcdef0 } = {}) {
    this.profile = profile;
    this.spacing = spacing;
    this.seedLo = seedLo >>> 0;
    this.seedHi = seedHi >>> 0;
    this.resetStroke();
    this.totalAccepted = 0;
    this.totalPredicted = 0;
    this.totalDabs = 0;
    this.sealedPages = 0;
    this.pendingPages = 0;
    this.maxPendingObserved = 0;
    this.backpressureEvents = 0;
  }

  resetStroke() {
    this.fx = new OneEuro1D(this.profile);
    this.fy = new OneEuro1D(this.profile);
    this.prevT = null;
    this.prevPoint = null;
    this.spacingCarry = 0;
    this.dabIndex = 0;
    this.pageSamples = 0;
    this.tailSamples = 0;
    this.strokeAccepted = 0;
    this.strokeDabs = [];
  }

  beginStroke() { this.resetStroke(); }
  notePredicted(count) { this.totalPredicted += count; }

  processActual(sample) {
    const dt = this.prevT === null ? 1 / 120 : Math.max(1e-6, (sample.t - this.prevT) / 1000);
    this.prevT = sample.t;
    const p = { ...sample, x: this.fx.next(sample.x, dt), y: this.fy.next(sample.y, dt) };
    this.totalAccepted += 1;
    this.strokeAccepted += 1;
    this.tailSamples += 1;
    if (this.tailSamples > MUTABLE_TAIL_SAMPLES) {
      this.tailSamples -= 1;
      this.pageSamples += 1;
      if (this.pageSamples >= PAGE_SAMPLES) {
        if (this.pendingPages >= MAX_PENDING_PAGES) { this.backpressureEvents += 1; this.pendingPages -= 1; }
        this.pageSamples = 0;
        this.sealedPages += 1;
        this.pendingPages += 1;
        this.maxPendingObserved = Math.max(this.maxPendingObserved, this.pendingPages);
      }
    }
    const dabs = this.#emitBetween(this.prevPoint, p);
    this.prevPoint = p;
    this.totalDabs += dabs.length;
    this.strokeDabs.push(...dabs);
    return { point: p, dabs };
  }

  drainOnePage() { if (this.pendingPages > 0) this.pendingPages -= 1; }

  endStroke() {
    const releaseWork = this.pageSamples + this.tailSamples;
    if (releaseWork > 0) {
      if (this.pendingPages >= MAX_PENDING_PAGES) { this.backpressureEvents += 1; this.pendingPages -= 1; }
      this.sealedPages += 1;
      this.pendingPages += 1;
      this.maxPendingObserved = Math.max(this.maxPendingObserved, this.pendingPages);
    }
    return { releaseWork, accepted: this.strokeAccepted, dabs: this.strokeDabs.length };
  }

  #emit(x, y, pressure, t) {
    const i = this.dabIndex++;
    const jitterX = (uniform01(this.seedLo, this.seedHi, i, 1) - 0.5) * 0.2;
    const jitterY = (uniform01(this.seedLo, this.seedHi, i, 2) - 0.5) * 0.2;
    return { index: i, x: x + jitterX, y: y + jitterY, pressure, t };
  }

  #emitBetween(prev, cur) {
    if (!prev) return [this.#emit(cur.x, cur.y, cur.pressure, cur.t)];
    const dx = cur.x - prev.x, dy = cur.y - prev.y, dist = Math.hypot(dx, dy);
    if (dist <= 0) return [];
    const out = [];
    let at = this.spacing - this.spacingCarry;
    while (at <= dist + 1e-12) {
      const u = at / dist;
      out.push(this.#emit(prev.x + dx * u, prev.y + dy * u, prev.pressure + (cur.pressure - prev.pressure) * u, prev.t + (cur.t - prev.t) * u));
      at += this.spacing;
    }
    this.spacingCarry = (this.spacingCarry + dist) % this.spacing;
    return out;
  }
}

function syntheticSamples(count, hz = 240) {
  const out = [];
  for (let i = 0; i < count; i += 1) {
    const u = count <= 1 ? 0 : i / (count - 1);
    out.push({ x: 24 + 720 * u, y: 220 + 130 * Math.sin(u * Math.PI * 8), pressure: 0.1 + 0.85 * (0.5 + 0.5 * Math.sin(u * Math.PI * 3)), t: i * 1000 / hz, tiltX: 20 * Math.sin(u * Math.PI * 2), tiltY: 15 * Math.cos(u * Math.PI * 2) });
  }
  return out;
}

function percentile(values, p) {
  if (!values.length) return 0;
  const a = [...values].sort((x, y) => x - y);
  return a[Math.min(a.length - 1, Math.floor((a.length - 1) * p))];
}

function runSyntheticBrowserBenchmark({ samples = 100000, batch = 32 } = {}) {
  const source = syntheticSamples(samples);
  const pipeline = new StreamingBrushPipeline();
  pipeline.beginStroke();
  const batchTimes = [];
  for (let i = 0; i < source.length; i += batch) {
    const t0 = performance.now();
    const end = Math.min(source.length, i + batch);
    for (let j = i; j < end; j += 1) pipeline.processActual(source[j]);
    if ((i / batch) % 32 === 31) pipeline.drainOnePage();
    batchTimes.push(performance.now() - t0);
  }
  const release = pipeline.endStroke();
  return { accepted: pipeline.totalAccepted, dabs: pipeline.totalDabs, releaseWork: release.releaseWork, sealedPages: pipeline.sealedPages, maxPendingObserved: pipeline.maxPendingObserved, backpressureEvents: pipeline.backpressureEvents, batch, p50Ms: percentile(batchTimes, 0.50), p95Ms: percentile(batchTimes, 0.95), p99Ms: percentile(batchTimes, 0.99), maxMs: Math.max(...batchTimes) };
}



const canvas = document.querySelector('#canvas');
const ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });
const status = document.querySelector('#status');
const result = document.querySelector('#result');
const resetButton = document.querySelector('#reset');
const copyButton = document.querySelector('#copy');
const saveButton = document.querySelector('#save');
const syntheticButton = document.querySelector('#synthetic');

const pipeline = new StreamingBrushPipeline();
let activePointer = null;
let strokeCount = 0;
const cpuTimes = [];
const rafTimes = [];
const frameIntervals = [];
const releaseWorks = [];
let penSamples = 0;
let touchSamples = 0;
let mouseSamples = 0;
let coalescedSamples = 0;
let predictedSamples = 0;
let pressureMin = 1, pressureMax = 0;
let tiltSeen = false;
let lastRaf = null;
let sessionStartedAt = performance.now();

function resize() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const w = Math.max(1, Math.round(rect.width * dpr));
  const h = Math.max(1, Math.round(rect.height * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w; canvas.height = h;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  }
}

function rafLoop(ts) {
  if (lastRaf !== null) frameIntervals.push(ts - lastRaf);
  lastRaf = ts;
  requestAnimationFrame(rafLoop);
}
requestAnimationFrame(rafLoop);
window.addEventListener('resize', resize, { passive: true });
resize();

function normalize(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: e.clientX - rect.left,
    y: e.clientY - rect.top,
    pressure: Number.isFinite(e.pressure) ? e.pressure : 0.5,
    tiltX: Number.isFinite(e.tiltX) ? e.tiltX : 0,
    tiltY: Number.isFinite(e.tiltY) ? e.tiltY : 0,
    t: Number.isFinite(e.timeStamp) ? e.timeStamp : performance.now(),
    pointerType: e.pointerType || 'unknown',
  };
}

function noteSensor(s) {
  if (s.pointerType === 'pen') penSamples += 1;
  else if (s.pointerType === 'touch') touchSamples += 1;
  else if (s.pointerType === 'mouse') mouseSamples += 1;
  pressureMin = Math.min(pressureMin, s.pressure);
  pressureMax = Math.max(pressureMax, s.pressure);
  tiltSeen ||= Math.abs(s.tiltX) > 0 || Math.abs(s.tiltY) > 0;
}

function drawDabs(dabs) {
  for (const d of dabs) {
    const radius = 1.4 + d.pressure * 3.0;
    ctx.beginPath();
    ctx.arc(d.x, d.y, radius, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(20, 20, 24, ${0.18 + 0.55 * d.pressure})`;
    ctx.fill();
  }
}

function processPointerEvent(event) {
  const received = performance.now();
  const actualEvents = typeof event.getCoalescedEvents === 'function' ? event.getCoalescedEvents() : [];
  const actual = actualEvents.length ? actualEvents : [event];
  coalescedSamples += Math.max(0, actual.length - 1);
  const predictions = typeof event.getPredictedEvents === 'function' ? event.getPredictedEvents() : [];
  predictedSamples += predictions.length;
  pipeline.notePredicted(predictions.length);
  for (const raw of actual) {
    const s = normalize(raw);
    noteSensor(s);
    const out = pipeline.processActual(s);
    drawDabs(out.dabs);
  }
  cpuTimes.push(performance.now() - received);
  requestAnimationFrame(() => rafTimes.push(performance.now() - received));
  renderStatus();
}

canvas.addEventListener('pointerdown', event => {
  if (activePointer !== null) return;
  activePointer = event.pointerId;
  pipeline.beginStroke();
  strokeCount += 1;
  canvas.setPointerCapture(event.pointerId);
  processPointerEvent(event);
});
canvas.addEventListener('pointermove', event => {
  if (event.pointerId !== activePointer) return;
  processPointerEvent(event);
});
function endStroke(event) {
  if (event.pointerId !== activePointer) return;
  processPointerEvent(event);
  releaseWorks.push(pipeline.endStroke().releaseWork);
  activePointer = null;
  renderStatus();
}
canvas.addEventListener('pointerup', endStroke);
canvas.addEventListener('pointercancel', endStroke);
canvas.addEventListener('lostpointercapture', event => {
  if (event.pointerId === activePointer) {
    releaseWorks.push(pipeline.endStroke().releaseWork);
    activePointer = null;
    renderStatus();
  }
});

function summary() {
  const frameMissThreshold = 25;
  const memory = performance.memory ? {
    usedJSHeapSize: performance.memory.usedJSHeapSize,
    totalJSHeapSize: performance.memory.totalJSHeapSize,
    jsHeapSizeLimit: performance.memory.jsHeapSizeLimit,
  } : null;
  const deviceGate = penSamples >= 500 && strokeCount >= 3 && pressureMax - pressureMin >= 0.15;
  return {
    schema: 'illustro.brush-device-benchmark.v1',
    generatedAt: new Date().toISOString(),
    profile: BRUSH_PROFILE,
    environment: { userAgent: navigator.userAgent, platform: navigator.platform, hardwareConcurrency: navigator.hardwareConcurrency ?? null, deviceMemory: navigator.deviceMemory ?? null, dpr: window.devicePixelRatio, viewport: [window.innerWidth, window.innerHeight] },
    session: { durationMs: performance.now() - sessionStartedAt, strokeCount, acceptedActualSamples: pipeline.totalAccepted, penSamples, touchSamples, mouseSamples, coalescedSamples, predictedSamples, pressureMin: Number.isFinite(pressureMin) ? pressureMin : null, pressureMax, tiltSeen, totalDabs: pipeline.totalDabs, sealedPages: pipeline.sealedPages, maxPendingObserved: pipeline.maxPendingObserved, backpressureEvents: pipeline.backpressureEvents, maxReleaseWork: releaseWorks.length ? Math.max(...releaseWorks) : 0 },
    timing: { pipelineP50Ms: percentile(cpuTimes, .50), pipelineP95Ms: percentile(cpuTimes, .95), pipelineP99Ms: percentile(cpuTimes, .99), pipelineMaxMs: cpuTimes.length ? Math.max(...cpuTimes) : 0, receiveToNextRafP50Ms: percentile(rafTimes, .50), receiveToNextRafP95Ms: percentile(rafTimes, .95), receiveToNextRafP99Ms: percentile(rafTimes, .99), frameIntervalP95Ms: percentile(frameIntervals, .95), frameIntervalsOver25ms: frameIntervals.filter(x => x > frameMissThreshold).length },
    memory,
    gateEvidence: { actualSampleLossObservable: 0, penProtocolComplete: deviceGate, requiredPenSamples: 500, requiredStrokes: 3, requiredPressureRange: 0.15 },
  };
}

function renderStatus() {
  const s = summary();
  const pass = s.gateEvidence.penProtocolComplete;
  status.textContent = [
    `実機プロトコル: ${pass ? 'COMPLETE' : 'INCOMPLETE'}`,
    `strokes ${strokeCount}/3 | pen samples ${penSamples}/500`,
    `pressure range ${(pressureMax - pressureMin).toFixed(3)} / 0.150`,
    `pipeline p95 ${s.timing.pipelineP95Ms.toFixed(3)} ms`,
    `receive→RAF p95 ${s.timing.receiveToNextRafP95Ms.toFixed(3)} ms`,
    `max release work ${s.session.maxReleaseWork} samples`,
  ].join('\n');
  result.value = JSON.stringify(s, null, 2);
}

resetButton.addEventListener('click', () => { ctx.clearRect(0, 0, canvas.width, canvas.height); location.reload(); });
saveButton.addEventListener('click', () => {
  const payload = result.value || JSON.stringify(summary(), null, 2);
  const blob = new Blob([payload + '\n'], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'illustro-brush-device-' + new Date().toISOString().replace(/[:.]/g, '-') + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  saveButton.textContent = '保存済み';
  setTimeout(() => saveButton.textContent = 'JSONを保存', 1200);
});
copyButton.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(result.value);
    copyButton.textContent = 'コピー済み';
  } catch {
    result.focus();
    result.select();
    copyButton.textContent = '選択しました';
  }
  setTimeout(() => copyButton.textContent = 'JSONをコピー', 1200);
});
syntheticButton.addEventListener('click', () => { const b = runSyntheticBrowserBenchmark({ samples: 100000, batch: 32 }); result.value = JSON.stringify({ manual: summary(), synthetic100k: b }, null, 2); });
window.illustroBrushDevice = { summary, runSyntheticBrowserBenchmark };
renderStatus();

</script>
</body>
</html>
