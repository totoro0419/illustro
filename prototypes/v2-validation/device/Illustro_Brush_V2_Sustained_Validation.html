<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Illustro Brush V2 Sustained Validation</title>
  <style>
:root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; background: Canvas; color: CanvasText; }
main { min-height: 100dvh; display: grid; grid-template-rows: auto auto minmax(320px, 1fr) auto 180px; gap: 10px; padding: 12px; }
header { display: flex; gap: 16px; align-items: start; justify-content: space-between; }
h1 { margin: 0; font-size: clamp(20px, 4vw, 30px); }
.eyebrow { margin: 0 0 4px; font-size: 11px; letter-spacing: .12em; opacity: .65; }
#status { margin: 0; font: 12px/1.35 ui-monospace, monospace; text-align: right; white-space: pre-wrap; }
.protocol { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 13px; padding: 8px 10px; border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 10px; }
#canvas { width: 100%; height: 100%; min-height: 320px; border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); border-radius: 12px; background: white; touch-action: none; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
button { min-height: 42px; padding: 0 14px; border-radius: 9px; border: 1px solid color-mix(in srgb, CanvasText 22%, transparent); background: ButtonFace; color: ButtonText; font-weight: 650; }
textarea { width: 100%; resize: none; border-radius: 10px; padding: 10px; font: 11px/1.35 ui-monospace, monospace; }
@media (max-width: 720px) { header { display: grid; } #status { text-align: left; } main { grid-template-rows: auto auto minmax(360px, 1fr) auto 150px; } }

</style>
  <style>
    .phase { font-size: clamp(18px, 3vw, 26px); font-weight: 800; }
    .meter { width: 100%; height: 10px; border-radius: 999px; overflow: hidden; background: color-mix(in srgb, CanvasText 12%, transparent); }
    .meter > div { height: 100%; width: 0%; background: currentColor; transition: width .25s linear; }
    .note { font-size: 12px; opacity: .72; }
    .heat { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    select { min-height:42px; border-radius:9px; padding:0 10px; }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">NON-PRODUCTION VALIDATION</p>
        <h1>Brush V2 Sustained / Thermal Proxy</h1>
      </div>
      <pre id="status"></pre>
    </header>

    <section class="protocol">
      <div class="phase" id="phase">開始前</div>
      <div id="instruction">開始すると自動負荷が走ります。途中はPen操作不要です。</div>
      <div class="meter" aria-label="進捗"><div id="progress"></div></div>
      <div class="note">固定10分ではありません。最短3分、最大6分。30秒bucketの安定性を見て早期終了します。</div>
    </section>

    <canvas id="canvas" aria-label="Sustained validation canvas"></canvas>

    <section class="actions">
      <button id="start">自動負荷を開始</button>
      <button id="stop" disabled>中止</button>
      <button id="copy">JSONをコピー</button>
      <button id="select-json">JSONを全選択</button>
    </section>

    <section class="heat">
      <label for="heat">終了時の端末の熱さ:</label>
      <select id="heat">
        <option value="">未選択</option>
        <option value="normal">特に気にならない</option>
        <option value="warm">少し温かいが問題ない</option>
        <option value="hot">明確に熱い / 不快</option>
      </select>
    </section>

    <textarea id="result" spellcheck="false" aria-label="検証結果JSON"></textarea>
  </main>
  
<script type="module">
const BRUSH_PROFILE = Object.freeze({ kind: 'one-euro', minCutoff: 4, beta: 4, dCutoff: 1 });
const PAGE_SAMPLES = 256;
const MUTABLE_TAIL_SAMPLES = 16;
const MAX_PENDING_PAGES = 8;
const SPACING = 1.75;

function alphaForCutoff(cutoff, dt) {
  const tau = 1 / (2 * Math.PI * cutoff);
  return 1 / (1 + tau / dt);
}

class LowPass {
  constructor() { this.ready = false; this.y = 0; }
  next(x, a) {
    if (!this.ready) { this.ready = true; this.y = x; return x; }
    this.y = a * x + (1 - a) * this.y;
    return this.y;
  }
}

class OneEuro1D {
  constructor({ minCutoff, beta, dCutoff }) {
    this.minCutoff = minCutoff;
    this.beta = beta;
    this.dCutoff = dCutoff;
    this.xFilter = new LowPass();
    this.dxFilter = new LowPass();
    this.prevX = null;
  }
  next(x, dt) {
    const dx = this.prevX === null ? 0 : (x - this.prevX) / dt;
    this.prevX = x;
    const edx = this.dxFilter.next(dx, alphaForCutoff(this.dCutoff, dt));
    const cutoff = this.minCutoff + this.beta * Math.abs(edx);
    return this.xFilter.next(x, alphaForCutoff(cutoff, dt));
  }
}

function mulHiLo(a, b) {
  const mask = 0xffffffffn;
  const p = BigInt(a >>> 0) * BigInt(b >>> 0);
  return [Number((p >> 32n) & mask) >>> 0, Number(p & mask) >>> 0];
}

function philox4x32_10(counter, key) {
  const M0 = 0xD2511F53n, M1 = 0xCD9E8D57n;
  const W0 = 0x9E3779B9, W1 = 0xBB67AE85;
  let [x0, x1, x2, x3] = counter.map(v => v >>> 0);
  let [k0, k1] = key.map(v => v >>> 0);
  for (let round = 0; round < 10; round++) {
    const [hi0, lo0] = mulHiLo(Number(M0), x0);
    const [hi1, lo1] = mulHiLo(Number(M1), x2);
    [x0, x1, x2, x3] = [(hi1 ^ x1 ^ k0) >>> 0, lo1, (hi0 ^ x3 ^ k1) >>> 0, lo0];
    if (round !== 9) { k0 = (k0 + W0) >>> 0; k1 = (k1 + W1) >>> 0; }
  }
  return [x0, x1, x2, x3];
}

function uniform01(seedLo, seedHi, index, stream) {
  const lo = Number(BigInt(index) & 0xffffffffn) >>> 0;
  const hi = Number((BigInt(index) >> 32n) & 0xffffffffn) >>> 0;
  return philox4x32_10([lo, hi, stream >>> 0, 0], [seedLo >>> 0, seedHi >>> 0])[0] / 0x100000000;
}

class StreamingBrushPipeline {
  constructor({ profile = BRUSH_PROFILE, spacing = SPACING, seedLo = 0x12345678, seedHi = 0x9abcdef0 } = {}) {
    this.profile = profile;
    this.spacing = spacing;
    this.seedLo = seedLo >>> 0;
    this.seedHi = seedHi >>> 0;
    this.resetStroke();
    this.totalAccepted = 0;
    this.totalPredicted = 0;
    this.totalDabs = 0;
    this.sealedPages = 0;
    this.pendingPages = 0;
    this.maxPendingObserved = 0;
    this.backpressureEvents = 0;
  }

  resetStroke() {
    this.fx = new OneEuro1D(this.profile);
    this.fy = new OneEuro1D(this.profile);
    this.prevT = null;
    this.prevPoint = null;
    this.spacingCarry = 0;
    this.dabIndex = 0;
    this.pageSamples = 0;
    this.tailSamples = 0;
    this.strokeAccepted = 0;
    this.strokeDabs = [];
  }

  beginStroke() { this.resetStroke(); }
  notePredicted(count) { this.totalPredicted += count; }

  processActual(sample) {
    const dt = this.prevT === null ? 1 / 120 : Math.max(1e-6, (sample.t - this.prevT) / 1000);
    this.prevT = sample.t;
    const p = { ...sample, x: this.fx.next(sample.x, dt), y: this.fy.next(sample.y, dt) };
    this.totalAccepted += 1;
    this.strokeAccepted += 1;
    this.tailSamples += 1;
    if (this.tailSamples > MUTABLE_TAIL_SAMPLES) {
      this.tailSamples -= 1;
      this.pageSamples += 1;
      if (this.pageSamples >= PAGE_SAMPLES) {
        if (this.pendingPages >= MAX_PENDING_PAGES) { this.backpressureEvents += 1; this.pendingPages -= 1; }
        this.pageSamples = 0;
        this.sealedPages += 1;
        this.pendingPages += 1;
        this.maxPendingObserved = Math.max(this.maxPendingObserved, this.pendingPages);
      }
    }
    const dabs = this.#emitBetween(this.prevPoint, p);
    this.prevPoint = p;
    this.totalDabs += dabs.length;
    this.strokeDabs.push(...dabs);
    return { point: p, dabs };
  }

  drainOnePage() { if (this.pendingPages > 0) this.pendingPages -= 1; }

  endStroke() {
    const releaseWork = this.pageSamples + this.tailSamples;
    if (releaseWork > 0) {
      if (this.pendingPages >= MAX_PENDING_PAGES) { this.backpressureEvents += 1; this.pendingPages -= 1; }
      this.sealedPages += 1;
      this.pendingPages += 1;
      this.maxPendingObserved = Math.max(this.maxPendingObserved, this.pendingPages);
    }
    return { releaseWork, accepted: this.strokeAccepted, dabs: this.strokeDabs.length };
  }

  #emit(x, y, pressure, t) {
    const i = this.dabIndex++;
    const jitterX = (uniform01(this.seedLo, this.seedHi, i, 1) - 0.5) * 0.2;
    const jitterY = (uniform01(this.seedLo, this.seedHi, i, 2) - 0.5) * 0.2;
    return { index: i, x: x + jitterX, y: y + jitterY, pressure, t };
  }

  #emitBetween(prev, cur) {
    if (!prev) return [this.#emit(cur.x, cur.y, cur.pressure, cur.t)];
    const dx = cur.x - prev.x, dy = cur.y - prev.y, dist = Math.hypot(dx, dy);
    if (dist <= 0) return [];
    const out = [];
    let at = this.spacing - this.spacingCarry;
    while (at <= dist + 1e-12) {
      const u = at / dist;
      out.push(this.#emit(prev.x + dx * u, prev.y + dy * u, prev.pressure + (cur.pressure - prev.pressure) * u, prev.t + (cur.t - prev.t) * u));
      at += this.spacing;
    }
    this.spacingCarry = (this.spacingCarry + dist) % this.spacing;
    return out;
  }
}

function syntheticSamples(count, hz = 240) {
  const out = [];
  for (let i = 0; i < count; i += 1) {
    const u = count <= 1 ? 0 : i / (count - 1);
    out.push({ x: 24 + 720 * u, y: 220 + 130 * Math.sin(u * Math.PI * 8), pressure: 0.1 + 0.85 * (0.5 + 0.5 * Math.sin(u * Math.PI * 3)), t: i * 1000 / hz, tiltX: 20 * Math.sin(u * Math.PI * 2), tiltY: 15 * Math.cos(u * Math.PI * 2) });
  }
  return out;
}

function percentile(values, p) {
  if (!values.length) return 0;
  const a = [...values].sort((x, y) => x - y);
  return a[Math.min(a.length - 1, Math.floor((a.length - 1) * p))];
}

function runSyntheticBrowserBenchmark({ samples = 100000, batch = 32 } = {}) {
  const source = syntheticSamples(samples);
  const pipeline = new StreamingBrushPipeline();
  pipeline.beginStroke();
  const batchTimes = [];
  for (let i = 0; i < source.length; i += batch) {
    const t0 = performance.now();
    const end = Math.min(source.length, i + batch);
    for (let j = i; j < end; j += 1) pipeline.processActual(source[j]);
    if ((i / batch) % 32 === 31) pipeline.drainOnePage();
    batchTimes.push(performance.now() - t0);
  }
  const release = pipeline.endStroke();
  return { accepted: pipeline.totalAccepted, dabs: pipeline.totalDabs, releaseWork: release.releaseWork, sealedPages: pipeline.sealedPages, maxPendingObserved: pipeline.maxPendingObserved, backpressureEvents: pipeline.backpressureEvents, batch, p50Ms: percentile(batchTimes, 0.50), p95Ms: percentile(batchTimes, 0.95), p99Ms: percentile(batchTimes, 0.99), maxMs: Math.max(...batchTimes) };
}



const params = new URLSearchParams(location.search);
const ciMode = params.get('ci') === '1';
const CONFIG = ciMode
  ? { bucketMs: 1000, baselineMs: 2000, minMs: 6000, maxMs: 10000, strokeMs: 500, realisticRate: 240, stressDuty: 0.50 }
  : { bucketMs: 30000, baselineMs: 60000, minMs: 180000, maxMs: 360000, strokeMs: 5000, realisticRate: 240, stressDuty: 0.50 };

const canvas = document.querySelector('#canvas');
const ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });
const status = document.querySelector('#status');
const result = document.querySelector('#result');
const phaseEl = document.querySelector('#phase');
const instruction = document.querySelector('#instruction');
const progress = document.querySelector('#progress');
const startButton = document.querySelector('#start');
const stopButton = document.querySelector('#stop');
const copyButton = document.querySelector('#copy');
const selectJsonButton = document.querySelector('#select-json');
const heatSelect = document.querySelector('#heat');

let pipeline = new StreamingBrushPipeline();
let phase = 'idle';
let runStart = 0;
let autoEnd = 0;
let stopReason = null;
let generatedSamples = 0;
let acceptedAtStart = 0;
let wakeLock = null;
let wakeLockState = 'not-requested';
let visibilityInterruptions = 0;
let invalidatedReason = null;
let lastRaf = null;
let nextBucketAt = 0;
let bucketStartAt = 0;
let bucketGeneratedStart = 0;
let bucketAcceptedStart = 0;
let bucketBackpressureStart = 0;
let bucketFrameIntervals = [];
let bucketWorkTimes = [];
let bucketMaxPending = 0;
let buckets = [];
let lastStrokeIndex = -1;
let lastDrainAt = 0;
let realisticProcessed = 0;
let framePeriodEstimate = 16.67;
let postPen = {
  startedAt: null, strokes: 0, trustedPenSamples: 0, cpuTimes: [], rafTimes: [], pressureMin: 1, pressureMax: 0, tiltSeen: false,
};
let activePointer = null;
let lastResultJson = '';

function resize() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(devicePixelRatio || 1, 3);
  const w = Math.max(1, Math.round(rect.width * dpr));
  const h = Math.max(1, Math.round(rect.height * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w; canvas.height = h;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
}
resize();
window.addEventListener('resize', resize, { passive: true });

function median(values) { return percentile(values, 0.5); }
function mad(values) {
  if (!values.length) return 0;
  const m = median(values);
  return median(values.map(v => Math.abs(v - m)));
}

function drawDabs(dabs) {
  for (const d of dabs) {
    const r = 1.4 + d.pressure * 3.0;
    ctx.beginPath();
    ctx.arc(d.x, d.y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(20,20,24,${0.18 + 0.55 * d.pressure})`;
    ctx.fill();
  }
}

function syntheticSample(index, t) {
  const rect = canvas.getBoundingClientRect();
  const width = Math.max(320, rect.width), height = Math.max(240, rect.height);
  const u = (index % 2400) / 2399;
  const cycle = Math.floor(index / 2400) % 4;
  const x = 18 + u * (width - 36);
  const y0 = height * (0.25 + cycle * 0.16);
  return {
    x,
    y: y0 + Math.sin(u * Math.PI * 10) * Math.min(70, height * 0.12),
    pressure: 0.15 + 0.75 * (0.5 + 0.5 * Math.sin(u * Math.PI * 3)),
    tiltX: 25 * Math.sin(u * Math.PI * 2),
    tiltY: 18 * Math.cos(u * Math.PI * 2),
    t,
  };
}

function processSyntheticOne(t) {
  const s = syntheticSample(generatedSamples, t);
  generatedSamples += 1;
  const out = pipeline.processActual(s);
  drawDabs(out.dabs);
}

function maybeRotateStroke(elapsed) {
  const strokeIndex = Math.floor(elapsed / CONFIG.strokeMs);
  if (strokeIndex === lastStrokeIndex) return;
  if (lastStrokeIndex >= 0) pipeline.endStroke();
  pipeline.beginStroke();
  lastStrokeIndex = strokeIndex;
  if (strokeIndex % 2 === 0) ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function closeBucket(now) {
  const elapsed = now - runStart;
  const accepted = pipeline.totalAccepted - acceptedAtStart;
  const generatedDelta = generatedSamples - bucketGeneratedStart;
  const acceptedDelta = accepted - bucketAcceptedStart;
  const heap = performance.memory ? {
    usedJSHeapSize: performance.memory.usedJSHeapSize,
    totalJSHeapSize: performance.memory.totalJSHeapSize,
    jsHeapSizeLimit: performance.memory.jsHeapSizeLimit,
  } : null;
  const duration = Math.max(1, now - bucketStartAt);
  const bucket = {
    index: buckets.length,
    startMs: bucketStartAt - runStart,
    endMs: elapsed,
    mode: bucketStartAt - runStart < CONFIG.baselineMs ? 'realistic-baseline' : 'stress',
    generatedSamples: generatedDelta,
    acceptedSamples: acceptedDelta,
    samplesPerSecond: generatedDelta * 1000 / duration,
    workP50Ms: percentile(bucketWorkTimes, .50),
    workP95Ms: percentile(bucketWorkTimes, .95),
    workP99Ms: percentile(bucketWorkTimes, .99),
    frameIntervalP50Ms: percentile(bucketFrameIntervals, .50),
    frameIntervalP95Ms: percentile(bucketFrameIntervals, .95),
    frameIntervalsOver25ms: bucketFrameIntervals.filter(v => v > 25).length,
    frameCount: bucketFrameIntervals.length,
    maxPendingPages: bucketMaxPending,
    backpressureEvents: pipeline.backpressureEvents - bucketBackpressureStart,
    heap,
  };
  buckets.push(bucket);
  bucketStartAt = now;
  bucketGeneratedStart = generatedSamples;
  bucketAcceptedStart = accepted;
  bucketBackpressureStart = pipeline.backpressureEvents;
  bucketFrameIntervals = [];
  bucketWorkTimes = [];
  bucketMaxPending = pipeline.pendingPages;
  return bucket;
}

function stabilityScreen() {
  const stress = buckets.filter(b => b.mode === 'stress');
  if (stress.length < 4) return { ready: false, stable: false };
  const first = stress.slice(0, 2);
  const recent = stress.slice(-2);
  const initialThroughput = median(first.map(b => b.samplesPerSecond));
  const recentThroughput = median(recent.map(b => b.samplesPerSecond));
  const initialFrame = median(first.map(b => b.frameIntervalP95Ms));
  const recentFrame = median(recent.map(b => b.frameIntervalP95Ms));
  const throughputs = stress.map(b => b.samplesPerSecond);
  const frames = stress.map(b => b.frameIntervalP95Ms);
  const throughputNoiseFrac = initialThroughput > 0 ? 3 * mad(throughputs) / initialThroughput : 1;
  const frameNoiseFrac = initialFrame > 0 ? 3 * mad(frames) / initialFrame : 1;
  const allowedThroughputDrop = Math.max(0.15, throughputNoiseFrac);
  const allowedFrameRise = Math.max(0.15, frameNoiseFrac);
  const throughputDrop = initialThroughput > 0 ? (initialThroughput - recentThroughput) / initialThroughput : 0;
  const frameRise = initialFrame > 0 ? (recentFrame - initialFrame) / initialFrame : 0;
  const bounded = pipeline.maxPendingObserved <= 8;
  const stable = bounded && throughputDrop <= allowedThroughputDrop && frameRise <= allowedFrameRise;
  return {
    ready: true, stable, bounded,
    initialThroughput, recentThroughput, throughputDrop, allowedThroughputDrop,
    initialFrameP95Ms: initialFrame, recentFrameP95Ms: recentFrame, frameRise, allowedFrameRise,
  };
}

async function requestWakeLock() {
  if (!('wakeLock' in navigator)) { wakeLockState = 'unavailable'; return; }
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLockState = 'active';
    wakeLock.addEventListener('release', () => { wakeLockState = 'released'; });
  } catch {
    wakeLockState = 'denied-or-unavailable';
  }
}

function startRun() {
  if (!(phase === 'idle' || (phase === 'done' && invalidatedReason))) return;
  pipeline = new StreamingBrushPipeline();
  pipeline.beginStroke();
  phase = 'auto';
  startButton.disabled = true;
  stopButton.disabled = false;
  heatSelect.value = '';
  runStart = performance.now();
  acceptedAtStart = pipeline.totalAccepted;
  nextBucketAt = runStart + CONFIG.bucketMs;
  bucketStartAt = runStart;
  bucketGeneratedStart = 0;
  bucketAcceptedStart = 0;
  bucketBackpressureStart = 0;
  buckets = [];
  generatedSamples = 0;
  lastStrokeIndex = -1;
  lastDrainAt = runStart;
  realisticProcessed = 0;
  stopReason = null;
  visibilityInterruptions = 0;
  invalidatedReason = null;
  postPen = { startedAt:null, strokes:0, trustedPenSamples:0, cpuTimes:[], rafTimes:[], pressureMin:1, pressureMax:0, tiltSeen:false };
  requestWakeLock();
  render();
}

function finishAuto(reason) {
  if (phase !== 'auto') return;
  const now = performance.now();
  if (now - bucketStartAt > CONFIG.bucketMs * 0.5) closeBucket(now);
  pipeline.endStroke();
  autoEnd = now;
  stopReason = reason;
  phase = 'post-pen';
  stopButton.disabled = true;
  phaseEl.textContent = '最終Penチェック';
  instruction.textContent = '10〜20秒ほど普通に描いてください。500 Pen samples以上になれば十分です。';
  render();
}

function invalidateRun(reason) {
  if (phase !== 'auto') return;
  const now = performance.now();
  if (now - bucketStartAt > CONFIG.bucketMs * 0.5) closeBucket(now);
  pipeline.endStroke();
  autoEnd = now;
  stopReason = reason;
  invalidatedReason = reason;
  phase = 'done';
  stopButton.disabled = true;
  if (wakeLock && !wakeLock.released) wakeLock.release();
  startButton.disabled = false;
  startButton.textContent = '再測定を開始';
  render();
}

function finalize() {
  if (phase !== 'post-pen') return;
  phase = 'done';
  if (wakeLock && !wakeLock.released) wakeLock.release();
  if (invalidatedReason) {
    startButton.disabled = false;
    startButton.textContent = '再測定を開始';
  }
  render();
}

function autoWork(now) {
  const elapsed = now - runStart;
  maybeRotateStroke(elapsed);
  const t0 = performance.now();
  if (elapsed < CONFIG.baselineMs) {
    const shouldHave = Math.floor(elapsed * CONFIG.realisticRate / 1000);
    let due = Math.min(32, shouldHave - realisticProcessed);
    while (due-- > 0) {
      processSyntheticOne(elapsed);
      realisticProcessed += 1;
    }
  } else {
    const frameBudget = Math.min(8, Math.max(2, framePeriodEstimate * CONFIG.stressDuty));
    let guard = 0;
    while (performance.now() - t0 < frameBudget && guard < 10000) {
      processSyntheticOne(elapsed + guard / CONFIG.realisticRate * 1000);
      guard += 1;
    }
  }
  bucketWorkTimes.push(performance.now() - t0);
  bucketMaxPending = Math.max(bucketMaxPending, pipeline.pendingPages);
  if (now - lastDrainAt >= 250) {
    pipeline.drainOnePage();
    lastDrainAt = now;
  }
  if (now >= nextBucketAt) {
    closeBucket(now);
    nextBucketAt = now + CONFIG.bucketMs;
  }
  const screen = stabilityScreen();
  if (invalidatedReason !== null) return;
  if (elapsed >= CONFIG.minMs && screen.ready && screen.stable) {
    finishAuto('stable-screening-criterion');
  } else if (elapsed >= CONFIG.maxMs) {
    finishAuto('max-duration');
  }
}

function loop(now) {
  if (lastRaf !== null) {
    const dt = now - lastRaf;
    if (phase === 'auto') {
      bucketFrameIntervals.push(dt);
      if (buckets.length < 2 && dt > 4 && dt < 50) {
        framePeriodEstimate = framePeriodEstimate * 0.9 + dt * 0.1;
      }
    }
  }
  lastRaf = now;
  if (phase === 'auto') autoWork(now);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

document.addEventListener('visibilitychange', () => {
  if (phase === 'auto' && document.visibilityState !== 'visible') {
    visibilityInterruptions += 1;
    invalidateRun('visibility-interruption');
  }
});

function normalize(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: e.clientX - rect.left, y: e.clientY - rect.top,
    pressure: Number.isFinite(e.pressure) ? e.pressure : 0.5,
    tiltX: Number.isFinite(e.tiltX) ? e.tiltX : 0,
    tiltY: Number.isFinite(e.tiltY) ? e.tiltY : 0,
    t: Number.isFinite(e.timeStamp) ? e.timeStamp : performance.now(),
    pointerType: e.pointerType || 'unknown', trusted: e.isTrusted === true,
  };
}

function processPostPenEvent(event) {
  if (phase !== 'post-pen') return;
  const received = performance.now();
  const events = typeof event.getCoalescedEvents === 'function' ? event.getCoalescedEvents() : [];
  const actual = events.length ? events : [event];
  for (const raw of actual) {
    const s = normalize(raw);
    if (!s.trusted || s.pointerType !== 'pen') continue;
    postPen.trustedPenSamples += 1;
    postPen.pressureMin = Math.min(postPen.pressureMin, s.pressure);
    postPen.pressureMax = Math.max(postPen.pressureMax, s.pressure);
    postPen.tiltSeen ||= Math.abs(s.tiltX) > 0 || Math.abs(s.tiltY) > 0;
    const out = pipeline.processActual(s);
    drawDabs(out.dabs);
  }
  postPen.cpuTimes.push(performance.now() - received);
  requestAnimationFrame(() => postPen.rafTimes.push(performance.now() - received));
  if (postPen.trustedPenSamples >= 500) finalize();
}

canvas.addEventListener('pointerdown', event => {
  if (phase !== 'post-pen' || activePointer !== null) return;
  activePointer = event.pointerId;
  postPen.strokes += 1;
  if (postPen.startedAt === null) postPen.startedAt = performance.now();
  pipeline.beginStroke();
  canvas.setPointerCapture(event.pointerId);
  processPostPenEvent(event);
});
canvas.addEventListener('pointermove', event => {
  if (event.pointerId === activePointer) processPostPenEvent(event);
});
function endPointer(event) {
  if (event.pointerId !== activePointer) return;
  processPostPenEvent(event);
  pipeline.endStroke();
  activePointer = null;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

function report() {
  const elapsedAuto = runStart ? (autoEnd || performance.now()) - runStart : 0;
  const stable = stabilityScreen();
  return {
    schema: 'illustro.brush-sustained-benchmark.v1',
    generatedAt: new Date().toISOString(),
    ciMode,
    profile: BRUSH_PROFILE,
    config: CONFIG,
    environment: {
      userAgent: navigator.userAgent,
      platform: navigator.platform,
      hardwareConcurrency: navigator.hardwareConcurrency ?? null,
      deviceMemory: navigator.deviceMemory ?? null,
      dpr: devicePixelRatio,
      viewport: [innerWidth, innerHeight],
    },
    auto: {
      phase, elapsedMs: elapsedAuto, stopReason,
      generatedSamples, acceptedSamples: pipeline.totalAccepted - acceptedAtStart,
      maxPendingObserved: pipeline.maxPendingObserved,
      backpressureEvents: pipeline.backpressureEvents,
      visibilityInterruptions, invalidatedReason, wakeLockState,
      framePeriodEstimateMs: framePeriodEstimate,
      stabilityScreen: stable,
      buckets,
    },
    postPen: {
      strokes: postPen.strokes,
      trustedPenSamples: postPen.trustedPenSamples,
      pressureMin: Number.isFinite(postPen.pressureMin) ? postPen.pressureMin : null,
      pressureMax: postPen.pressureMax,
      pressureRange: Number.isFinite(postPen.pressureMin) ? postPen.pressureMax - postPen.pressureMin : null,
      tiltSeen: postPen.tiltSeen,
      pipelineP50Ms: percentile(postPen.cpuTimes, .50),
      pipelineP95Ms: percentile(postPen.cpuTimes, .95),
      pipelineP99Ms: percentile(postPen.cpuTimes, .99),
      receiveToNextRafP50Ms: percentile(postPen.rafTimes, .50),
      receiveToNextRafP95Ms: percentile(postPen.rafTimes, .95),
      receiveToNextRafP99Ms: percentile(postPen.rafTimes, .99),
    },
    userObservation: { heat: heatSelect.value || null },
    reviewEligibility: {
      autoCompleted: phase === 'post-pen' || phase === 'done',
      minimumElapsedReached: elapsedAuto >= CONFIG.minMs,
      foregroundContinuous: visibilityInterruptions === 0,
      notInvalidated: invalidatedReason === null,
      acceptedEqualsGenerated: (pipeline.totalAccepted - acceptedAtStart) >= generatedSamples,
      pendingBounded: pipeline.maxPendingObserved <= 8,
      postPenComplete: postPen.trustedPenSamples >= 500,
    },
  };
}

function render() {
  const r = report();
  if (phase === 'idle') {
    phaseEl.textContent = '開始前';
    instruction.textContent = '開始すると自動負荷が走ります。途中はPen操作不要です。';
  } else if (phase === 'auto') {
    const sec = r.auto.elapsedMs / 1000;
    phaseEl.textContent = '自動負荷';
    instruction.textContent = `${sec.toFixed(0)}秒 / 最短${(CONFIG.minMs/60000).toFixed(0)}分・最大${(CONFIG.maxMs/60000).toFixed(0)}分。画面は開いたままにしてください。`;
  } else if (phase === 'done') {
    phaseEl.textContent = invalidatedReason ? '測定無効' : '測定完了';
    instruction.textContent = invalidatedReason
      ? '自動負荷中に画面が非表示になったため、このrunは耐久判定には使えません。JSONは診断用に回収できます。'
      : '端末の熱さを選び、JSONをコピーしてチャットへ貼ってください。';
  }
  const pct = phase === 'auto' ? Math.min(100, r.auto.elapsedMs / CONFIG.maxMs * 100) : phase === 'idle' ? 0 : 100;
  progress.style.width = pct + '%';
  status.textContent = [
    `phase: ${phase}`,
    `elapsed: ${(r.auto.elapsedMs/1000).toFixed(0)}s`,
    `buckets: ${buckets.length}`,
    `generated: ${generatedSamples}`,
    `pending max: ${pipeline.maxPendingObserved}`,
    `post Pen: ${postPen.trustedPenSamples}/500`,
  ].join('\n');
  const json = JSON.stringify(r, null, 2);
  if (json !== lastResultJson && document.activeElement !== result) {
    result.value = json;
    lastResultJson = json;
  }
}

startButton.addEventListener('click', startRun);
stopButton.addEventListener('click', () => finishAuto('user-stop'));
function freezeCurrentJson() {
  const json = JSON.stringify(report(), null, 2);
  if (result.value !== json) result.value = json;
  lastResultJson = json;
  return json;
}

function selectJson() {
  freezeCurrentJson();
  result.focus();
  result.select();
  result.setSelectionRange(0, result.value.length);
}

copyButton.addEventListener('click', async () => {
  const json = freezeCurrentJson();
  let copied = false;
  if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
    try {
      await navigator.clipboard.writeText(json);
      copied = true;
    } catch {}
  }
  if (!copied) {
    selectJson();
    try { copied = document.execCommand('copy'); } catch {}
  }
  copyButton.textContent = copied ? 'コピー済み' : '全選択しました';
  if (!copied) instruction.textContent = 'JSONを全選択しました。端末の「コピー」を実行して、このチャットへ貼ってください。';
  setTimeout(() => copyButton.textContent = 'JSONをコピー', 1600);
});

selectJsonButton.addEventListener('click', () => {
  selectJson();
  selectJsonButton.textContent = '全選択済み';
  instruction.textContent = 'JSONを全選択しました。端末の「コピー」を実行して、このチャットへ貼ってください。';
  setTimeout(() => selectJsonButton.textContent = 'JSONを全選択', 1600);
});
heatSelect.addEventListener('change', render);

window.illustroSustained = { report, startRun, finishAuto, invalidateRun, stabilityScreen };
render();

</script>
</body>
</html>
