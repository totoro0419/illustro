<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#111318" />
  <title>Illustro Region / Fill 実使用評価 — Standalone</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0f13;
      color: #f3f5f7;
      --panel: #171a20;
      --panel-2: #20242c;
      --line: #343a45;
      --muted: #a8b0bd;
      --accent: #77a7ff;
      --ok: #58d68d;
      --warn: #f5c451;
      --danger: #ff6b76;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0d0f13; }
    body { overscroll-behavior: none; }
    button, input { font: inherit; }
    button { color: inherit; }
    .app {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto auto minmax(280px, 1fr) auto;
      gap: 10px;
      padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    }
    .topbar, .toolbar, .panel, .footerbar {
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgb(0 0 0 / .18);
    }
    .topbar { padding: 12px; display: grid; gap: 10px; }
    .title-row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
    h1 { font-size: 16px; margin: 0; letter-spacing: .01em; }
    .status-pill {
      min-width: 94px;
      text-align: center;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 700;
      background: var(--panel-2);
      border: 1px solid var(--line);
    }
    .status-pill.closed { background: rgb(88 214 141 / .16); border-color: rgb(88 214 141 / .46); color: #8cf0b2; }
    .status-pill.open { background: rgb(255 107 118 / .14); border-color: rgb(255 107 118 / .46); color: #ff9aa2; }
    .status-pill.ambiguous { background: rgb(245 196 81 / .16); border-color: rgb(245 196 81 / .48); color: #f8d77d; }
    .file-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
    .file-label, .button {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 12px;
      border-radius: 11px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    .file-label { justify-content: flex-start; overflow: hidden; }
    .file-label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-label input { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }
    .button:disabled { opacity: .42; cursor: default; }
    .button.active { background: rgb(119 167 255 / .18); border-color: rgb(119 167 255 / .62); color: #c6d9ff; }
    .toolbar { padding: 8px; display: grid; gap: 8px; }
    .tool-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .tool-grid .button { min-width: 0; font-size: 14px; padding-inline: 7px; }
    .adjust-row { display: grid; grid-template-columns: auto minmax(80px, 1fr) auto auto; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    .canvas-shell {
      position: relative;
      min-height: 280px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid var(--line);
      background:
        linear-gradient(45deg, #16191f 25%, transparent 25%) 0 0 / 18px 18px,
        linear-gradient(-45deg, #16191f 25%, transparent 25%) 0 9px / 18px 18px,
        linear-gradient(45deg, transparent 75%, #16191f 75%) 9px -9px / 18px 18px,
        linear-gradient(-45deg, transparent 75%, #16191f 75%) -9px 0 / 18px 18px,
        #101217;
      touch-action: none;
    }
    .canvas-stage { position: relative; width: 100%; height: 100%; min-height: 280px; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #overlayCanvas { touch-action: none; cursor: crosshair; }
    .empty-hint {
      position: absolute; inset: 0; display: grid; place-items: center; padding: 28px;
      text-align: center; color: var(--muted); line-height: 1.65; pointer-events: none;
    }
    .empty-hint.hidden { display: none; }
    .bottom-grid { display: grid; gap: 10px; }
    .panel { padding: 11px; display: grid; gap: 10px; }
    .panel h2 { margin: 0; font-size: 14px; }
    .metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .metric { min-width: 0; padding: 8px; border-radius: 10px; background: #11141a; border: 1px solid #292e37; }
    .metric b { display: block; font-size: 15px; margin-top: 3px; font-variant-numeric: tabular-nums; }
    .metric small { display: block; color: var(--muted); line-height: 1.35; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 12px; color: var(--muted); font-size: 12px; }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; }
    .swatch { width: 10px; height: 10px; border-radius: 3px; }
    .swatch.strong { background: #48e090; }
    .swatch.weak { background: #ffd15c; }
    .swatch.low { background: #ff6677; }
    .swatch.join { background: #53d6ff; }
    .swatch.cut { background: #e373ff; }
    .checks { display: flex; flex-wrap: wrap; gap: 8px 14px; color: var(--muted); font-size: 13px; }
    .checks label { display: inline-flex; align-items: center; gap: 5px; }
    .footerbar { padding: 8px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
    .footerbar .button { font-size: 13px; padding-inline: 5px; }
    .rating-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .rating-row .button { min-height: 40px; font-size: 13px; }
    .rating-row [data-rating="good"] { border-color: rgb(88 214 141 / .48); }
    .rating-row [data-rating="acceptable"] { border-color: rgb(245 196 81 / .48); }
    .rating-row [data-rating="bad"] { border-color: rgb(255 107 118 / .48); }
    .note { color: var(--muted); font-size: 12px; line-height: 1.55; }
    .session-line { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    @media (min-width: 860px) {
      .app { grid-template-columns: minmax(560px, 1fr) 320px; grid-template-rows: auto auto minmax(520px, 1fr) auto; }
      .topbar, .toolbar, .canvas-shell, .footerbar { grid-column: 1; }
      .bottom-grid { grid-column: 2; grid-row: 1 / 5; align-content: start; }
      .canvas-shell { min-height: 520px; }
      .canvas-stage { min-height: 520px; }
      .metric-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- Self-contained Gate C evaluation artifact generated from branch region/v3-evidence-redesign-2026-09-29. -->
  <main class="app">
    <section class="topbar" aria-label="画像と判定状態">
      <div class="title-row">
        <h1>Region / Fill 実使用評価</h1>
        <div id="statusPill" class="status-pill">未判定</div>
      </div>
      <div class="file-row">
        <label class="file-label">
          <input id="imageInput" type="file" accept="image/*" />
          <span id="fileName">画像を選ぶ</span>
        </label>
        <button id="resetAll" class="button" type="button" disabled>最初に戻す</button>
      </div>
    </section>

    <section class="toolbar" aria-label="指操作ツール">
      <div class="tool-grid">
        <button class="button active" data-mode="inspect" type="button">判定位置</button>
        <button class="button" data-mode="join" type="button">つなぐ</button>
        <button class="button" data-mode="cut" type="button">切る</button>
      </div>
      <div class="adjust-row">
        <span>太さ</span>
        <input id="brushSize" type="range" min="1" max="12" value="4" step="1" />
        <span id="brushValue">4</span>
        <button id="recheck" class="button" type="button" disabled>再判定</button>
      </div>
    </section>

    <section class="canvas-shell" id="canvasShell" aria-label="画像評価キャンバス">
      <div class="canvas-stage" id="canvasStage">
        <canvas id="imageCanvas"></canvas>
        <canvas id="overlayCanvas"></canvas>
        <div id="emptyHint" class="empty-hint">画像を選んでください。<br />「判定位置」で塗りたい場所をタップし、必要なら「つなぐ」「切る」を指で描きます。</div>
      </div>
    </section>

    <section class="bottom-grid" aria-label="判定の詳細">
      <div class="panel">
        <h2 id="statusText">画像を選択してください</h2>
        <div class="metric-grid">
          <div class="metric"><small>囲まれている確信</small><b id="closureMetric">—</b></div>
          <div class="metric"><small>同じ領域としての安定度</small><b id="reliabilityMetric">—</b></div>
          <div class="metric"><small>複雑さによる誤判定リスク</small><b id="riskMetric">—</b></div>
        </div>
        <div id="sessionLine" class="session-line">補正: つなぐ 0回 / 切る 0回</div>
        <div class="legend" aria-label="境界表示の凡例">
          <span class="legend-item"><i class="swatch strong"></i>強い境界</span>
          <span class="legend-item"><i class="swatch weak"></i>弱い境界</span>
          <span class="legend-item"><i class="swatch low"></i>不足候補</span>
          <span class="legend-item"><i class="swatch join"></i>手動で接続</span>
          <span class="legend-item"><i class="swatch cut"></i>手動で切断</span>
        </div>
        <div class="checks">
          <label><input id="showFill" type="checkbox" checked />塗られる範囲</label>
          <label><input id="showBoundary" type="checkbox" checked />境界の強さ</label>
          <label><input id="showEdits" type="checkbox" checked />手動補正</label>
        </div>
        <p class="note">赤い表示は「開いている」と断定するものではなく、境界として弱い場所の候補です。数値は開発用の内部指標で、最終的な使いやすさは実際の操作感で評価します。</p>
      </div>

      <div class="panel">
        <h2>この結果を記録</h2>
        <div class="rating-row">
          <button class="button" data-rating="good" type="button" disabled>そのまま使える</button>
          <button class="button" data-rating="acceptable" type="button" disabled>補正すれば使える</button>
          <button class="button" data-rating="bad" type="button" disabled>使いにくい</button>
        </div>
        <button id="exportLog" class="button" type="button">評価記録を書き出す</button>
        <div id="recordState" class="note">この端末内に評価記録を保存します。</div>
      </div>
    </section>

    <section class="footerbar" aria-label="履歴操作">
      <button id="undo" class="button" type="button" disabled>戻す</button>
      <button id="redo" class="button" type="button" disabled>やり直す</button>
      <button id="clearEdits" class="button" type="button" disabled>補正を消す</button>
      <button id="clearSeed" class="button" type="button" disabled>位置を消す</button>
    </section>
  </main>

  <script type="module">
const sources = {
  region: "export class EvidenceGrid {\n  constructor(width,height){this.width=width;this.height=height;this.data=new Float32Array(width*height);this.userPinned=new Uint8Array(width*height);}\n  index(x,y){return y*this.width+x;}\n  inBounds(x,y){return x>=0&&y>=0&&x\u003cthis.width&&y\u003cthis.height;}\n  set(x,y,v=1){if(this.inBounds(x,y))this.data[this.index(x,y)]=v;return this;}\n  pin(x,y,on=true){if(this.inBounds(x,y))this.userPinned[this.index(x,y)]=on?1:0;return this;}\n  get(x,y){return this.inBounds(x,y)?this.data[this.index(x,y)]:0;}\n  clone(){const g=new EvidenceGrid(this.width,this.height);g.data.set(this.data);g.userPinned.set(this.userPinned);return g;}\n  combine(other){if(other.width!==this.width||other.height!==this.height)throw new Error('grid size mismatch');for(let i=0;i\u003cthis.data.length;i++){this.data[i]=Math.max(this.data[i],other.data[i]);this.userPinned[i]=this.userPinned[i]||other.userPinned[i];}return this;}\n}\n\nexport function line(g,x0,y0,x1,y1,v=1,width=1){\n  const dx=Math.abs(x1-x0),sx=x0\u003cx1?1:-1,dy=-Math.abs(y1-y0),sy=y0\u003cy1?1:-1;let err=dx+dy,x=x0,y=y0;\n  while(true){for(let oy=-Math.floor((width-1)/2);oy\u003c=Math.ceil((width-1)/2);oy++)for(let ox=-Math.floor((width-1)/2);ox\u003c=Math.ceil((width-1)/2);ox++)g.set(x+ox,y+oy,v);if(x===x1&&y===y1)break;const e2=2*err;if(e2>=dy){err+=dy;x+=sx;}if(e2\u003c=dx){err+=dx;y+=sy;}}\n  return g;\n}\nexport function rect(g,x0,y0,x1,y1,v=1,width=1){line(g,x0,y0,x1,y0,v,width);line(g,x1,y0,x1,y1,v,width);line(g,x1,y1,x0,y1,v,width);line(g,x0,y1,x0,y0,v,width);return g;}\n\nfunction buildBaseMask(grid,threshold){\n  const mask=new Uint8Array(grid.data.length);for(let i=0;i\u003cmask.length;i++)mask[i]=(grid.data[i]>=threshold||grid.userPinned[i])?1:0;return mask;\n}\nfunction degree(mask,w,h,x,y){let n=0;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx\u003cw&&ny\u003ch&&mask[ny*w+nx])n++;}return n;}\n\nfunction bridgeCandidates(base,w,h,gapMax,scanRect=null){\n  const cellCandidates=new Map();const add=(cells,orientation,endpoints)=>{const id=`${orientation}:${endpoints.join(',')}`;for(const idx of cells){let a=cellCandidates.get(idx);if(!a){a=[];cellCandidates.set(idx,a);}a.push({id,cells,orientation,endpoints});}};\n  const minY=scanRect?Math.max(0,scanRect.y0):0,maxY=scanRect?Math.min(h-1,scanRect.y1):h-1;\n  const minX=scanRect?Math.max(0,scanRect.x0):0,maxX=scanRect?Math.min(w-1,scanRect.x1):w-1;\n  for(let y=minY;y\u003c=maxY;y++){\n    let x=0;while(x\u003cw){if(!base[y*w+x]){x++;continue;}let e=x+1;while(e\u003cw&&!base[y*w+e]&&e-x-1\u003c=gapMax)e++;const gap=e-x-1;if(e\u003cw&&gap>0&&gap\u003c=gapMax&&base[y*w+e]){const cells=[];for(let gx=x+1;gx\u003ce;gx++)cells.push(y*w+gx);add(cells,'h',[y*w+x,y*w+e]);}x=Math.max(x+1,e);}\n  }\n  for(let x=minX;x\u003c=maxX;x++){\n    let y=0;while(y\u003ch){if(!base[y*w+x]){y++;continue;}let e=y+1;while(e\u003ch&&!base[e*w+x]&&e-y-1\u003c=gapMax)e++;const gap=e-y-1;if(e\u003ch&&gap>0&&gap\u003c=gapMax&&base[e*w+x]){const cells=[];for(let gy=y+1;gy\u003ce;gy++)cells.push(gy*w+x);add(cells,'v',[y*w+x,e*w+x]);}y=Math.max(y+1,e);}\n  }\n  return cellCandidates;\n}\n\nfunction applyBridges(base,w,h,gapMax,scanRect=null){\n  const bridge=new Uint8Array(base.length);const candidates=bridgeCandidates(base,w,h,gapMax,scanRect);const ambiguousCells=[];const seen=new Set();\n  for(const [idx,arr] of candidates){\n    const unique=[...new Map(arr.map(a=>[a.id,a])).values()];\n    const valid=[];\n    for(const c of unique){\n      const [a,b]=c.endpoints;const ax=a%w,ay=Math.floor(a/w),bx=b%w,by=Math.floor(b/w);\n      const directional = c.orientation==='h'\n        ? (ax-1>=0 && bx+1\u003cw && base[ay*w+(ax-1)] && base[by*w+(bx+1)])\n        : (ay-1>=0 && by+1\u003ch && base[(ay-1)*w+ax] && base[(by+1)*w+bx]);\n      if(!directional) continue;\n      valid.push({c,branchy:degree(base,w,h,ax,ay)>2||degree(base,w,h,bx,by)>2});\n    }\n    if(valid.length>1| orkRisk: state.result.textureNetworkRisk,\n    },\n    elapsedMs: state.sessionStartedAt ? Math.round(now - state.sessionStartedAt) : null,\n  };\n  records.push(record);\n  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));\n  els.recordState.textContent = `記録しました（この端末: ${records.length}件）`;\n}\n\nfunction exportRecords() {\n  const records = loadRecords();\n  const payload = {\n    schema: 'illustro.region-user-evaluation-export.v1',\n    exportedAt: new Date().toISOString(),\n    records,\n  };\n  const blob = new Blob([`${JSON.stringify(payload, null, 2)}\\n`], { type: 'application/json' });\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a');\n  a.href = url;\n  a.download = `illustro-region-evaluation-${new Date().toISOString().slice(0, 10)}.json`;\n  a.click();\n  setTimeout(() => URL.revokeObjectURL(url), 0);\n  els.recordState.textContent = records.length ? `${records.length}件を書き出しました。` : '記録はまだありません。空の記録を書き出しました。';\n}\n\nels.imageInput.addEventListener('change', event => loadImageFile(event.target.files?.[0]).catch(error => {\n  console.error(error);\n  els.statusText.textContent = `画像を読み込めませんでした: ${error.message}`;\n}));\nfor (const button of modeButtons) button.addEventListener('click', () => setMode(button.dataset.mode));\nels.brushSize.addEventListener('input', () => { els.brushValue.textContent = els.brushSize.value; });\nels.recheck.addEventListener('click', evaluate);\nels.resetAll.addEventListener('click', resetAll);\nels.undo.addEventListener('click', () => {\n  const edit = state.edits.pop();\n  if (!edit) return;\n  state.redoEdits.push(edit);\n  rebuildWorkingBundle();\n  evaluate();\n});\nels.redo.addEventListener('click', () => {\n  const edit = state.redoEdits.pop();\n  if (!edit) return;\n  state.edits.push(edit);\n  rebuildWorkingBundle();\n  evaluate();\n});\nels.clearEdits.addEventListener('click', () => {\n  if (!state.edits.length) return;\n  state.redoEdits.push(...state.edits.splice(0));\n  rebuildWorkingBundle();\n  evaluate();\n});\nels.clearSeed.addEventListener('click', () => {\n  state.seed = null;\n  state.result = null;\n  state.topologyResult = null;\n  state.selectedComponent = null;\n  updateStatus();\n  render();\n});\nfor (const checkbox of [els.showFill, els.showBoundary, els.showEdits]) checkbox.addEventListener('change', render);\nfor (const button of ratingButtons) button.addEventListener('click', () => saveRating(button.dataset.rating));\nels.exportLog.addEventListener('click', exportRecords);\n\nels.overlayCanvas.addEventListener('pointerdown', event => {\n  if (!state.originalBundle || event.button > 0 || !event.isPrimary) return;\n  event.preventDefault();\n  beginStroke(event);\n});\nels.overlayCanvas.addEventListener('pointermove', event => {\n  if (!state.activeStroke) return;\n  event.preventDefault();\n  continueStroke(event);\n});\nels.overlayCanvas.addEventListener('pointerup', event => {\n  if (!state.activeStroke) return;\n  event.preventDefault();\n  endStroke(event);\n});\nels.overlayCanvas.addEventListener('pointercancel', event => {\n  if (!state.activeStroke) return;\n  event.preventDefault();\n  endStroke(event);\n});\n\nconst resizeObserver = new ResizeObserver(resizeCanvases);\nresizeObserver.observe(els.canvasStage);\nwindow.addEventListener('orientationchange', () => requestAnimationFrame(resizeCanvases));\nwindow.addEventListener('resize', resizeCanvases);\n\nsetMode('inspect');\nupdateStatus();\nresizeCanvases();\n"
};
const makeUrl = source => URL.createObjectURL(new Blob([source], { type: 'text/javascript' }));
const regionUrl = makeUrl(sources.region);
