<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5"><meta name="theme-color" content="#f5f8fc"><title>Illustro · C02</title><link rel="stylesheet" href="./app/style.css"><link rel="stylesheet" href="./app/aurora-frost.css"><link rel="stylesheet" href="./app/c02.css"></head><body>
<div id="app">
<header class="topbar"><div class="brand"><span class="brandmark">✳</span>Illustro <small> C02</small></div><span id="doc-title">無題</span><div class="top-actions"><button data-action="new" title="新規作品">新規</button><button data-action="open" title="作品を開く">開く</button><button data-action="save" class="accent">保存</button><button data-action="saveas" title="別名保存">別名保存</button><button data-action="undo" title="作品を戻す Ctrl+Z">↶</button><button data-action="redo" title="作品を進める Ctrl+Shift+Z">↷</button><button id="panel-toggle" title="作業パネル切替">☷</button></div></header>
<div class="content"><nav class="rail" aria-label="ツール"><button data-tool="gpen" class="active" title="Gペン">✒<span>Gペン</span></button><button data-tool="round" title="丸ブラシ">●<span>丸筆</span></button><button data-tool="pencil" title="鉛筆">✎<span>鉛筆</span></button><button data-tool="marker" title="マーカー">▰<span>マーカー</span></button><button data-tool="air" title="エアブラシ">◌<span>エア</span></button><button data-tool="hardEraser" title="硬い消しゴム">◇<span>消しゴム</span></button><button data-tool="softEraser" title="柔らかい消しゴム">◯<span>柔消し</span></button><button data-action="fit" title="全体表示">⛶<span>Fit</span></button></nav>
<main class="canvas-area"><div class="canvas-hud"><span id="zoom-readout">100%</span><span id="doc-dimensions"></span><span id="save-status" role="status">未保存</span></div><div id="stage" tabindex="0" aria-label="描画キャンバス。ペンまたはマウスで描く、指で移動"><svg id="paper-shadow" aria-hidden="true"><g transform="translate(0 7)" fill="none" stroke="#23365a" stroke-linejoin="round"><polygon stroke-width="28" opacity=".025"></polygon><polygon stroke-width="18" opacity=".035"></polygon><polygon stroke-width="10" opacity=".05"></polygon></g><polygon id="paper-shadow-polygon"></polygon></svg><div id="paper"><div id="checker"></div><canvas id="art"></canvas><canvas id="preview"></canvas><canvas id="grid"></canvas></div><canvas id="repeat-view" hidden aria-hidden="true"></canvas><div id="brush-cursor" hidden aria-hidden="true"></div></div>
<div class="quick"><button data-action="undo" title="Undo">↶</button><button data-action="redo" title="Redo">↷</button><button id="quick-tool" title="ブラシと消しゴム切替">✒</button><button id="quick-color" title="色の設定"><span id="color-swatch"></span></button><label>太さ <input id="quick-size" type="range" min="1" max="200" value="12"><output id="quick-size-value">12</output></label><button data-action="fit" title="全体表示">Fit</button></div></main>
<aside class="workspace" id="workspace"><div class="workspace-head"><strong>Workspace</strong><button id="close-panel" title="パネルを閉じる">×</button></div><div class="workspace-scroll">
<section><h3>ブラシ <small id="tool-name">Gペン</small></h3><div class="brush-browser"><label>ブラシ検索<input id="brush-search" type="search" placeholder="名前・用途・タグ"></label><label>表示<select id="brush-filter"><option value="all">すべて</option><option value="favorite">お気に入り</option><option value="recent">最近使用</option></select></label><div class="brush-choice"><select id="brush-list" aria-label="ブラシを選ぶ"></select><button id="brush-star" aria-label="お気に入り" aria-pressed="false">☆</button></div><button id="brush-edit">ブラシ編集・試し描き</button></div><label class="field">サイズ <input id="size" type="range" min="1" max="300" value="12"><input id="size-n" type="number" min="1" max="300" value="12"></label><label class="field">不透明度 <input id="opacity" type="range" min="0" max="100" value="100"><input id="opacity-n" type="number" min="0" max="100" value="100">%</label><label class="field">流量 <input id="flow" type="range" min="0" max="100" value="100"><input id="flow-n" type="number" min="0" max="100" value="100">%</label><label class="field">筆圧カーブ <input id="pressure-curve" type="range" min="40" max="250" value="100"><output id="pressure-curve-value">1.00</output></label><div id="brush-correction"></div><small id="sensor-readout">入力：未計測</small></section>
<section id="color-section"><h3>カラー</h3>
<label class="legacy-mode-row">色選択 <select id="color-picker-mode" aria-label="旧Illustroのカラーサークルを切り替え"><option value="classic">クラシック</option><option value="orbit">オービット</option></select></label>
<div id="classic-picker" class="legacy-classic">
  <div id="classic-ring" role="slider" tabindex="0" aria-label="クラシック色相環" aria-valuemin="0" aria-valuemax="359" aria-valuenow="0"></div>
  <svg id="classic-ring-hit" viewBox="0 0 252 252" preserveAspectRatio="none" aria-hidden="true"><path data-classic-hue="1" fill="transparent" fill-rule="evenodd" d="M 252 126 A 126 126 0 1 0 0 126 A 126 126 0 1 0 252 126 Z M 229 126 A 103 103 0 1 1 23 126 A 103 103 0 1 1 229 126 Z"/></svg>
  <i id="classic-hue-marker" aria-hidden="true"></i>
  <div id="classic-plane" role="group" aria-label="クラシック彩度・明度"><i class="legacy-white"></i><i class="legacy-black"></i><i id="classic-sv-marker" class="legacy-sv-marker"></i></div>
</div>
<div id="orbit-picker" class="legacy-orbit" hidden>
 <div id="orbit-plane" aria-label="オービット彩度・明度"><i class="legacy-white"></i><i class="legacy-black"></i><i id="orbit-sv-marker" class="legacy-sv-marker"></i></div>
 <canvas id="orbit-wheel" width="640" height="320" role="slider" tabindex="0" aria-label="オービット色相環" aria-valuemin="0" aria-valuemax="359" aria-valuenow="0"></canvas>
 <svg class="legacy-orbit-hit legacy-orbit-back" viewBox="0 0 320 160" preserveAspectRatio="none" aria-hidden="true"><path data-orbit-hue="rotate" d="M 14 73 A 146 51 0 0 1 306 73 L 257 73 A 97 31 0 0 0 63 73 Z" fill="transparent"/></svg>
 <canvas id="orbit-wheel-front" width="640" height="320" aria-hidden="true"></canvas>
 <svg class="legacy-orbit-hit legacy-orbit-front" viewBox="0 0 320 160" preserveAspectRatio="none" aria-hidden="true"><path data-orbit-hue="slide" d="M 306 73 L 306 86 A 146 51 0 0 1 14 86 L 14 73 L 63 73 A 97 31 0 0 0 257 73 Z" fill="transparent"/></svg>
 <small class="legacy-orbit-help">リングをタップして色選択／なぞって回転／手前は左右ドラッグ</small>
</div>
<div class="color-chips"><span id="current-color"></span><span id="previous-color"></span></div><div class="color-row"><label>HEX<input id="hex" value="#222733" maxlength="7"></label><label>α<input id="color-alpha" type="number" min="0" max="100" value="100"></label></div><div class="color-row" id="rgb-row"><label>R<input type="number" id="r" min="0" max="255"></label><label>G<input type="number" id="g" min="0" max="255"></label><label>B<input type="number" id="b" min="0" max="255"></label></div><div class="color-row"><label>H<input type="number" id="h" min="0" max="360"></label><label>S HSV<input type="number" id="hs" min="0" max="100"></label><label>V<input type="number" id="v" min="0" max="100"></label></div><div class="color-row"><label>H HSL<input type="number" id="lh" min="0" max="360"></label><label>S<input type="number" id="ls" min="0" max="100"></label><label>L<input type="number" id="l" min="0" max="100"></label></div></section>
<section><h3>表示</h3><div class="button-grid"><button data-action="fit">Fit</button><button data-action="actual">100%</button><button data-action="resetrotation">回転0°</button><button data-action="resetflip">反転解除</button><button data-action="flipx">左右反転</button><button data-action="flipy">上下反転</button><button data-action="grid">ピクセルグリッド</button></div><label class="check"><input type="checkbox" id="repeat-draw">シームレス反復描画</label><label class="field">倍率 %<input id="zoom-n" type="number" min="5" max="6400" value="100"></label></section>
<section><h3>入力とジェスチャー</h3><label class="check"><input type="checkbox" id="finger-draw">指描きモード</label><label class="check"><input type="checkbox" id="tap-gesture" checked>二指タップでUndo・三指タップでRedo</label><small>標準はペンで描画、指で移動。Eを押す間は消去、Iは採色、Spaceは移動。</small><div id="input-assignments"></div><small id="button-capability" role="status">ペンボタン・後端消しゴムは入力未検出</small><button id="hold-eraser" aria-pressed="false">一時消しゴム（保持）</button><label class="check"><input type="checkbox" id="show-cursor" checked>ブラシ輪郭と中心</label><small>輪郭は基準径です。硬さ、変調、散布で実際の作用範囲が変わります。</small><label class="check"><input type="checkbox" id="wave-enable">入力波形を表示</label><canvas id="input-wave" width="200" height="56" hidden aria-label="筆圧波形"></canvas></section>
<section><details><summary>ガイド・選択制約</summary><p>中央ガイドと矩形マスクでブラシの作用範囲を確認できます。</p><label>中央ガイド<select id="brush-guide"><option value="">なし</option><option value="x">縦</option><option value="y">横</option></select></label><label>吸着強度<input id="guide-strength" type="range" min="0" max="1" step=".05" value="1"></label><small>Altを押しながら開始すると吸着を解除します。</small><label class="check"><input type="checkbox" id="mask-enable">中央50%の選択マスク</label><label>マスク濃度<input id="mask-alpha" type="range" min="0" max="1" step=".05" value="1"></label></details></section><section><h3>作品</h3><label>作品名<input id="meta-name" value="無題"></label><label>作者<input id="meta-author" value=""></label><label>説明<textarea id="meta-description" rows="2"></textarea></label><small id="meta-summary"></small><div class="button-grid"><button data-action="applymeta">作品情報を反映</button><button data-action="template">テンプレート保存</button></div></section>
</div><div class="resize-handle" id="resize-handle" title="パネルの幅を調整"></div></aside>
</div>
<div class="mobilebar"><button id="mobile-tools">道具</button><button id="mobile-eraser">消しゴム</button><button id="mobile-color">色</button><button id="mobile-size">太さ</button><button data-action="undo">↶</button><button data-action="redo">↷</button><button data-action="save">保存</button></div>
<div id="dialog-backdrop" hidden><form id="new-dialog" class="dialog"><header><h2>新しい作品</h2><button type="button" id="dialog-close">×</button></header><label>作品名<input id="new-name" value="無題"></label><div class="dialog-row"><label>幅<input id="new-width" type="number" min="1" value="1600" required></label><label>高さ<input id="new-height" type="number" min="1" value="1200" required></label></div><div class="dialog-row"><label>単位<select id="new-unit"><option value="px">px</option><option value="mm">mm</option></select></label><label>DPI<input id="new-dpi" type="number" min="1" max="2400" value="300" required></label></div><label>背景<select id="new-bg"><option value="white">白</option><option value="transparent">透明</option></select></label><label>色プロファイル<input value="sRGB / 8bit" disabled></label><label>テンプレート<select id="new-template"><option value="">選択しない</option></select></label><small id="new-error"></small><footer><button type="button" id="new-cancel">キャンセル</button><button type="submit" class="accent">作成</button></footer></form></div>
<button id="export-recovery" hidden>確定画像と未確定の筆を救出</button><div id="interrupted-stroke" hidden role="group" aria-label="中断した筆"><span>筆が中断しました。</span><button id="recover-stroke">受理済み部分を残す</button><button id="discard-stroke">筆を取り消す</button></div>
<dialog class="dialog brush-editor" id="brush-editor" aria-labelledby="brush-editor-title"><header><h2 id="brush-editor-title">ブラシ編集</h2><button id="brush-cancel">取消</button></header><div class="brush-pads"><figure><figcaption>編集前</figcaption><canvas id="pad-before" width="240" height="104"></canvas></figure><figure><figcaption>編集中の試し描き</figcaption><canvas id="pad-after" width="240" height="104" tabindex="0" aria-label="作品に影響しない試し描き"></canvas></figure></div><div id="brush-fields"></div><p id="brush-error" role="status"></p><footer><button id="brush-reset">初期値に戻す</button><button id="brush-copy">別名保存</button><button id="brush-apply" class="accent">設定を保存</button></footer></dialog>
<input id="open-file" type="file" accept=".illustro,application/json" hidden><div id="toast" role="status" aria-live="polite"></div><script type="module" src="./app/ui-icons.mjs"></script><script type="module" src="./app/main.mjs"></script></div>
</body></html>
