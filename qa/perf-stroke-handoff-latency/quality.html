<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Illustro — 全体表示の画質比較</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#243147;font:14px/1.55 system-ui,sans-serif}header,main{max-width:1500px;margin:auto;padding:20px}h1{font-size:22px;margin:0 0 8px}p{margin:6px 0;color:#536078}a{color:#254c8b}label{display:grid;gap:4px;font-size:12px}.controls{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}select{min-height:44px;background:white;border:1px solid #bec9d8;border-radius:8px;padding:8px;font:inherit;color:inherit}select:focus-visible,a:focus-visible{outline:3px solid #a16b10;outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}figure{margin:0;background:white;border:1px solid #d6dce5;border-radius:10px;overflow:hidden}figcaption{padding:12px;font-weight:600}figure a{display:block;overflow:auto;background:#ecf0f6}img{display:block;width:100%;height:auto}output{display:block;white-space:pre-wrap;font-variant-numeric:tabular-nums}#status{min-height:24px;color:#6e4710}details{margin-top:16px}pre{padding:14px;background:white;border:1px solid #d6dce5;white-space:pre-wrap;overflow-wrap:anywhere}small{font-weight:400;color:#536078}@media(max-width:650px){header,main{padding:14px}.controls{gap:8px}label{flex:1;min-width:120px}h1{font-size:19px}.grid{grid-template-columns:1fr}}
</style>
<header><a href="./">← 実際に描いて比較する</a><h1>キャンバス全体表示の画質比較</h1><p>同じ入力を流したブラウザの実表示画像です。両方式とも完成済み画像を保ち、現在の線だけを仮表示します。今回の変更で全体表示の品質を落としていないか確認できます。画像を開くと元の画素数で確認できます。</p><div class="controls">
<label>処理<select id="backend"><option value="webgl2">WebGL2</option><option value="webgpu">WebGPU</option></select></label><label>作品<select id="size"><option>4000</option><option>2000</option><option>8000</option></select></label><label>画面条件<select id="layout"><option value="phone">スマホ相当・DPR 3</option><option value="tablet">タブレット相当・DPR 2</option></select></label><label>ブラシ<select id="brush"><option value="thin">細いGペン</option><option value="broad">太いGペン</option><option value="fine">原寸1pxの極細線</option><option value="pencil">鉛筆</option><option value="erase">消しゴム</option><option value="lower">下位レイヤー</option><option value="fade">強制入り抜き</option></select></label><label>画像<select id="detail"><option value="-detail">線の周辺</option><option value="">画面全体</option></select></label></div><output id="status" aria-live="polite">比較画像を読み込んでいます。</output><output id="metrics"></output><p><small>Chromium・ソフトウェアGPUで取得しました。スマホ実機の画質・FPS・追従性やユーザー合格を示すものではありません。差分画像は仮線と正式線の色差を4倍にして表示します。強制入り抜きは離した後に形が決まるため、描画中の差があります。</small></p></header>
<main><div class="grid" id="images"></div><details><summary>測定値・ソースコミット</summary><pre id="raw"></pre></details><p><a href="./evidence/qa-status.json">総合検査記録・未確認事項</a></p></main>
<script>
const $=id=>document.getElementById(id),cache=new Map;let generation=0;const fmt=n=>Number.isFinite(n)?n.toFixed(2):'未測定';
async function update(){const g=++generation,backend=$('backend').value,size=Number($('size').value),layout=$('layout').value,brush=$('brush').value,detail=$('detail').value;$('status').textContent='比較画像を読み込んでいます。';try{let report=cache.get(backend);if(!report){const r=await fetch('./evidence/quality/'+backend+'/report.json');if(!r.ok)throw Error('検査記録を取得できませんでした。');report=await r.json();cache.set(backend,report);}if(g!==generation)return;const get=mode=>report.cases.find(c=>c.backend===backend&&c.size===size&&c.layout===layout&&c.brush===brush&&c.mode===mode&&c.ratio==='auto'),a=get('A'),c=get('C');if(!a||!c)throw Error('この条件の比較画像はまだありません。');const base='./evidence/quality/'+backend+'/'+backend+'-'+size+'-'+layout+'-'+brush+'-';$('images').replaceChildren();for(const [mode,kind,title]of [['A','live','PR #31：描画中'],['C','live','修正後：描画中'],['C','final','正式に確定した画像'],['C','diff','新方式の仮線と正式線の差']]){const figure=document.createElement('figure'),caption=document.createElement('figcaption'),link=document.createElement('a'),img=document.createElement('img');caption.textContent=title;img.alt=title+'、'+size+'px作品・'+layout;img.src=base+mode+'-auto-'+kind+detail+'.png';link.href=base+mode+'-auto-'+kind+'.png';link.target='_blank';link.rel='noopener';link.append(img);figure.append(caption,link);$('images').append(figure);}const sum=v=>v.quality.totalAbsMaxChannelError??v.quality.meanAbsMaxChannel*v.quality.roiPixels;$('metrics').textContent='正式線との差分量：PR #31 '+Math.round(sum(a)).toLocaleString()+' → 修正後 '+Math.round(sum(c)).toLocaleString()+' ／ 切り替え保護画像の最大差：'+fmt(c.guardMax)+' / 255';$('raw').textContent=JSON.stringify({sourceCommit:report.sourceCommit,baselineCommit:report.baselineCommit,scope:report.scope,before:a.quality,after:c.quality,guardMax:c.guardMax},null,2);$('status').textContent='同じ条件の比較画像です。';}catch(e){if(g===generation)$('status').textContent=e.message;}}
for(const id of ['backend','size','layout','brush','detail'])$(id).onchange=update;update();
</script></html>
