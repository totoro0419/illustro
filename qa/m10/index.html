<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f9fc"><title>Illustro M10｜ブラシの描き心地を確認</title><style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#253044;background:#f5f7ff}*{box-sizing:border-box}body{margin:0;padding:clamp(16px,4vw,36px);line-height:1.7}.wrap{max-width:850px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:clamp(24px,4vw,34px);letter-spacing:-.025em;margin:12px 0 6px}p{color:#526179;margin:0 0 16px}a.primary{display:inline-block;padding:12px 19px;background:#405ed8;color:white;text-decoration:none;border-radius:12px;font-weight:700}.summary{margin:20px 0;color:#46516b}fieldset{background:white;border:1px solid #dce4f6;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 4px 16px #25315b0b}legend{font-weight:750;padding:0 8px;color:#333f5c}.item{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid #eef0f7;cursor:pointer}.item:last-child{border-bottom:0}.item input{width:20px;height:20px;margin-top:4px;accent-color:#5471e4;flex-shrink:0}.small{font-size:13px;color:#6a778e}.badge{font-size:12px;background:#e9eeff;border-radius:99px;padding:6px 10px;font-weight:700;color:#4159ae}footer{font-size:13px;color:#65738c;margin:24px 0}
</style></head><body><div class="wrap"><div class="top"><span class="badge">M10 · BRUSH QUALITY</span><a class="primary" href="./app/">描画画面を開く →</a></div><h1>線の描き心地を確認する</h1><p>描画画面を開き、下の項目を実際に試してください。各項目を確認したらチェックを付けられます。合格判定はユーザー自身の確認後に行います。</p><div class="summary"><strong id="progress">0 / 12 項目を確認</strong><div class="small">チェックはこのブラウザーに保存されます。線の品質だけでなく、以前使えていた機能も確かめてください。</div></div><fieldset><legend>線の形・描き心地</legend>
<label class="item"><input type="checkbox"><span>細い線をゆっくり描き、ギザギザや太さの揺れが目立たないか</span></label>
<label class="item"><input type="checkbox"><span>素早く曲線を描き、角ばらず自然についてくるか</span></label>
<label class="item"><input type="checkbox"><span>ペンで弱く押した線から強く押した線へ、自然に太くなるか</span></label>
<label class="item"><input type="checkbox"><span>「強制入り抜き」をONにし、線の始まりと終わりが自然に細くなるか</span></label>
<label class="item"><input type="checkbox"><span>スマートフォンでは指でも同じ線の確認ができるか</span></label>
<label class="item"><input type="checkbox"><span>手ブレ補正を弱・中・強で変え、重すぎず自然に効くか</span></label>
<label class="item"><input type="checkbox"><span>鉛筆を重ねて描き、模様や濃さが不自然でないか</span></label>
</fieldset><fieldset><legend>速さ・以前の機能</legend>
<label class="item"><input type="checkbox"><span>4000×4000で長い線や連続した線を描いても極端に重くならないか</span></label>
<label class="item"><input type="checkbox"><span>描いた直後に「元に戻す」を押し、待たされず線が消えるか</span></label>
<label class="item"><input type="checkbox"><span>「元に戻す」「やり直す」を繰り返しても表示が壊れないか</span></label>
<label class="item"><input type="checkbox"><span>キャンバスを動かしたり拡大しても線が一瞬消えないか</span></label>
<label class="item"><input type="checkbox"><span>色相環・作品保存・マイ作品を開く操作が以前どおり使えるか</span></label>
</fieldset><p class="small">未対応端末ではペンの筆圧を確認できない場合があります。確認できない項目は無理にチェックせず、端末名とともに報告してください。</p><footer>M10の確認用ページです。過去のM01～M09の確認ページには変更を加えません。</footer></div><script>
const boxes=[...document.querySelectorAll('input[type="checkbox"]')];let data=[];try{data=JSON.parse(localStorage.getItem('illustro-m10-review')||'[]')}catch{}
const status=document.querySelector('#progress');function update(){status.textContent=boxes.filter(x=>x.checked).length+' / '+boxes.length+' 項目を確認';}
boxes.forEach((box,i)=>{box.checked=data[i]===true;box.addEventListener('change',()=>{try{localStorage.setItem('illustro-m10-review',JSON.stringify(boxes.map(x=>x.checked)))}catch{}update()})});update();
</script></body></html>
